to improve circulation"},{key:"C",text:"Avoid range-of-motion exercises until discharge"},{key:"D",text:"Reposition the client regularly and do range-of-motion exercises"}],answer:["D"],rationales:{A:"Wrong. Staying in one position raises the risk of skin breakdown.",B:"Wrong. The book calls for bedrest in the acute phase with gradual activity increase.",C:"Wrong. The book lists range-of-motion exercises as nursing care.",D:"The book lists range-of-motion exercises and repositioning to prevent skin breakdown."},takeaway:"Preventing skin breakdown during bedrest.",bookPage:"123",bookChapter:"Genitourinary System",bookSection:"Acute glomerulonephritis"},{id:"endo-acromegaly-q2",topic:"Endocrine",clientNeed:"Health Promotion and Maintenance",format:"Multiple choice",question:"An adult reports headaches, vision changes, and needing larger shoes and rings over several years. Which assessment best helps the nurse evaluate for acromegaly?",options:[{key:"A",text:"Measure the client's height to check for ongoing growth."},{key:"B",text:"Check for exophthalmos and a thyroid bruit on the neck."},{key:"C",text:"Compare the client's current features with old photographs."},{key:"D",text:"Look for a moon face, buffalo hump, and purple striae."}],answer:["C"],rationales:{A:"The book states acromegaly develops after skeletal maturity, unlike gigantism in children.",B:"The book lists these as findings of hyperthyroidism.",C:"The book notes acromegaly has a gradual onset over 7-10 years and suggests comparing old photos.",D:"The book lists these as classic signs of Cushing syndrome."},takeaway:"Recognize slow-onset acromegaly through focused history.",bookPage:"106",bookChapter:"Endocrine System",bookSection:"Acromegaly"},{id:"heme-leukemia-q10",topic:"Hematology & Oncology",clientNeed:"Reduction of Risk Potential",format:"Multiple choice",question:"After induction therapy, a client's bone marrow aspiration shows fewer than 5% blast cells. How should the nurse interpret this result?",options:[{key:"A",text:"The leukemia has progressed."},{key:"B",text:"The result confirms a new diagnosis of acute leukemia."},{key:"C",text:"The test is invalid because blasts should be zero."},{key:"D",text:"The client has achieved remission."}],answer:["D"],rationales:{A:"A low blast count after induction shows response, not progression.",B:"A high, not low, blast count supports the diagnosis of acute leukemia.",C:"The book uses fewer than 5% blasts as the marker of remission.",D:"The book states a bone marrow blast count below 5% indicates remission."},takeaway:"Evaluating response to induction chemotherapy.",bookPage:"160",bookChapter:"Hematology / Immunology",bookSection:"Leukemia"},{id:"nclex-highrisk-q15",topic:"Multisystem & Shock",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client is going home on a new anticoagulant. Which teaching point should the nurse include?",options:[{key:"A",text:"Stop taking the medication if a small bruise appears on the skin"},{key:"B",text:"Take a double dose the next day if a dose is missed"},{key:"C",text:"Report signs of bleeding, such as unusual bruising or blood in the urine"},{key:"D",text:"Expect to feel sleepy after each dose and plan rest periods"}],answer:["C"],rationales:{A:"Stopping the drug on one's own is unsafe; bleeding signs should be reported.",B:"Doubling a dose of a high-alert medication is unsafe.",C:"Anticoagulants are high-alert medications, and the book stresses educating clients on side effects; bleeding is the key one to report.",D:"Sleepiness is not the side effect the nurse would focus on for an anticoagulant."},takeaway:"Teach clients the side effects of high-alert medications.",bookPage:"8",bookChapter:"NCLEX Must-Know Content",bookSection:"High-risk conditions, labs & medication safety"},{id:"integ-pressure-q6",topic:"Integumentary",clientNeed:"Management of Care",format:"Multiple choice",question:"A nurse is caring for a bedbound client at high risk for pressure injury. Which task is appropriate to delegate to unlicensed assistive personnel (UAP)?",options:[{key:"A",text:"Turning and repositioning the client every 2 hours"},{key:"B",text:"Staging a new area of skin breakdown on the sacrum"},{key:"C",text:"Deciding which pressure-relieving device the client needs"},{key:"D",text:"Teaching the client's family about protein-rich nutrition"}],answer:["A"],rationales:{A:"Turning every 2 hours is a routine preventive measure from the book that UAP can carry out.",B:"Staging a wound requires assessment, which is an RN responsibility.",C:"Choosing a pressure-relieving device is part of planning care and needs nursing judgment.",D:"Teaching about nutrition is a nursing responsibility and is not delegated to UAP."},takeaway:"Delegate routine preventive care such as turning; keep assessment, planning and teaching with the RN.",bookPage:"178",bookChapter:"Integumentary System",bookSection:"Pressure injuries"},{id:"cardio-inflammatory-q22",topic:"Cardiovascular",clientNeed:"Management of Care",format:"Multiple choice",question:"A client with pericarditis develops new JVD, and the BP falls from 128/76 to 92/70 mm Hg. Using SBAR, which recommendation should the nurse give the provider?",options:[{key:"A",text:`"Please increase the ibuprofen dose, since the client's chest pain is getting worse."`},{key:"B",text:`"I'm concerned about tamponade. Please evaluate the client now and consider an echo."`},{key:"C",text:'"I recommend that we recheck the blood pressure in 4 hours and call if it drops."'},{key:"D",text:`"Please order compression stockings to help raise the client's low blood pressure."`}],answer:["B"],rationales:{A:"More NSAID does not address possible tamponade.",B:"The book says to always assess for tamponade in pericarditis; JVD and low BP need prompt evaluation, and echocardiography is a listed test.",C:"Waiting 4 hours delays care for a possible emergency.",D:"Compression stockings treat postural hypotension, not tamponade."},takeaway:"Give a clear, urgent SBAR recommendation for suspected tamponade.",bookPage:"56",bookChapter:"Cardiovascular System",bookSection:"Infectious and inflammatory conditions"},{id:"nclex-strategy-q1",topic:"Leadership & Delegation",clientNeed:"Management of Care",format:"Multiple choice",question:"The RN is working with a UAP and an LPN. Which task is appropriate to delegate to the UAP?",options:[{key:"A",text:"Teaching a stable client how to use an incentive spirometer"},{key:"B",text:"Giving oral medications to a client with a stable condition"},{key:"C",text:"Taking vital signs on a stable client and reporting the results"},{key:"D",text:"Evaluating whether a client's pain medication was effective"}],answer:["C"],rationales:{A:"Teaching must be done by the RN and is never delegated.",B:"Administering oral medications is listed as an LPN task, not a UAP task.",C:"The book lists taking vital signs on stable patients and reporting findings as UAP tasks.",D:"Evaluating outcomes is an RN responsibility that cannot be delegated."},takeaway:"Match tasks to scope of practice and client stability.",bookPage:"10",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy"},{id:"msk-bone-q7",topic:"Musculoskeletal",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client with osteoarthritis takes an NSAID every day for knee pain. Which finding should the nurse recognize as a possible adverse effect to report?",options:[{key:"A",text:"Knee pain that worsens after a long walk"},{key:"B",text:"Stiffness in the knee after sitting"},{key:"C",text:"Heberden's nodes on the fingers"},{key:"D",text:"New burning stomach pain and dark, tarry stools"}],answer:["D"],rationales:{A:"Pain that worsens with activity is a sign of osteoarthritis, not a drug effect.",B:"Stiffness after rest is a sign of osteoarthritis, not a drug effect.",C:"Heberden's nodes are a feature of osteoarthritis.",D:"The book says to watch for GI effects with NSAIDs; stomach pain and dark, tarry stools suggest GI irritation or bleeding."},takeaway:"Monitor clients on NSAIDs for gastrointestinal adverse effects.",bookPage:"181",bookChapter:"Musculoskeletal System",bookSection:"Osteoporosis, osteoarthritis and gout"},{id:"nclex-priorities-q16",topic:"Fundamentals & Safety",clientNeed:"Physiological Adaptation",format:"Multiple choice",question:"A nurse enters a room and finds a client in severe respiratory distress. The client is gasping and cannot speak in full sentences. What should the nurse do first?",options:[{key:"A",text:"Complete a head-to-toe assessment before deciding on any intervention"},{key:"B",text:"Intervene immediately to support the client's breathing and call for help"},{key:"C",text:"Review the client's chart to find the cause of the breathing problem"},{key:"D",text:"Ask the client to describe when the shortness of breath began"}],answer:["B"],rationales:{A:"A full assessment delays care. Severe respiratory distress is an emergency where the nurse acts first.",B:"Severe respiratory distress is one of the listed exceptions to assessing first. If the client is unstable, the nurse acts.",C:"Reviewing the chart delays care for an unstable client.",D:"A client who cannot speak in full sentences should not be asked for a detailed history before the nurse acts."},takeaway:"If the client is unstable, act; severe respiratory distress is an exception to assessment first.",bookPage:"5",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment"},{id:"neuro-encephalitis-q11",topic:"Neurological",clientNeed:"Psychosocial Integrity",format:"Multiple choice",question:`The adult child of a client recovering from encephalitis says, "Mom acts so differently now. I don't know what's happening to her." Which response by the nurse is most helpful?`,options:[{key:"A",text:`"Changes in behavior can be a complication of encephalitis. Let's talk about what you have noticed."`},{key:"B",text:'"She is probably just tired and will be fine tomorrow."'},{key:"C",text:'"You should visit less often so she can rest."'},{key:"D",text:'"This has nothing to do with her illness."'}],answer:["A"],rationales:{A:"The book lists behavioral changes and cognitive decline as complications of encephalitis; explaining this and exploring concerns supports the family.",B:"This offers false reassurance.",C:"Reducing visits does not support the family or the client.",D:"Behavioral changes are a listed complication of encephalitis."},takeaway:"Help families understand behavioral changes after encephalitis.",bookPage:"137",bookChapter:"Neurologic System",bookSection:"Encephalitis"},{id:"resp-effusion-q7",topic:"Respiratory",clientNeed:"Management of Care",format:"Multiple choice",question:"The nurse receives report on four clients with pleural effusions. Which client should the nurse assess first?",options:[{key:"A",text:"A client with a small effusion found on a routine x-ray who has no symptoms"},{key:"B",text:"A client with a known effusion reporting increasing dyspnea and pain on inspiration"},{key:"C",text:"A client with a heart failure effusion who is due for a scheduled diuretic"},{key:"D",text:"A client awaiting an ultrasound who asks when the test will be done"}],answer:["B"],rationales:{A:"The book notes mild effusions may be asymptomatic; this client is stable.",B:"Dyspnea and pleuritic chest pain are the book's effusion symptoms, and worsening dyspnea needs prompt assessment.",C:"A scheduled diuretic is routine care for a transudative effusion.",D:"A question about test timing is not urgent."},takeaway:"Assess the client whose breathing is getting worse first.",bookPage:"31",bookChapter:"Respiratory System",bookSection:"Pleural effusion"},{id:"heme-anaphylaxis-q13",topic:"Immunology & Infectious Disease",clientNeed:"Management of Care",format:"Multiple choice",question:"Four clients in an urgent care clinic report possible allergic reactions. Which client should the nurse see first?",options:[{key:"A",text:"A client with an itchy rash that began 2 days after starting a new soap"},{key:"B",text:"A client who has had mild sneezing for a week"},{key:"C",text:"A client with hives that began 6 hours ago and are fading"},{key:"D",text:"A client with a hoarse voice that began 5 minutes after eating peanuts"}],answer:["D"],rationales:{A:"A rash appearing days later is not the rapid onset typical of anaphylaxis.",B:"Week-long mild sneezing is not a rapid systemic reaction.",C:"Fading hives several hours later suggest the reaction is resolving.",D:"The book notes onset is typically within 5 to 30 minutes and that earlier onset means a more severe reaction; hoarseness signals airway involvement."},takeaway:"Prioritizing early-onset reactions with airway signs.",bookPage:"171",bookChapter:"Hematology / Immunology",bookSection:"Immunity and anaphylaxis"},{id:"fluids-main-q26",topic:"Fluids & Electrolytes",clientNeed:"Reduction of Risk Potential",format:"Multiple choice",question:"A client's serum osmolality is 318 mOsm/kg. How should the nurse interpret this result?",options:[{key:"A",text:"Below normal, meaning the serum is too dilute"},{key:"B",text:"Above normal, meaning solutes are more concentrated"},{key:"C",text:"Within the normal range for serum osmolality"},{key:"D",text:"Cannot be interpreted without an ECG tracing"}],answer:["B"],rationales:{A:"A low value would be below 270 mOsm/kg; 318 is above the range.",B:"Osmolality measures solute concentration, and 318 is above the 270-300 mOsm/kg normal range, so the serum is more concentrated than normal.",C:"The normal range is 270-300 mOsm/kg, so 318 is not normal.",D:"Osmolality is a lab value interpreted against its own range; it does not need an ECG."},takeaway:"Interpret serum osmolality as a measure of solute concentration.",bookPage:"184",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet"},{id:"gi-gallbladder-q7",topic:"Gastrointestinal",clientNeed:"Management of Care",format:"Multiple choice",question:"A client returns from an open cholecystectomy. Which action should the nurse take first?",options:[{key:"A",text:"Give the prescribed antiemetic."},{key:"B",text:"Teach the client about avoiding fatty foods at home."},{key:"C",text:"Elevate the head of the bed for comfort."},{key:"D",text:"Assess airway, breathing and circulation."}],answer:["D"],rationales:{A:"Antiemetics are given as needed after ABCs are assessed.",B:"Diet teaching comes after the client is stable.",C:"Positioning is helpful but follows airway, breathing and circulation.",D:"The book lists ABCs as the first post-op priority."},takeaway:"Assess airway, breathing and circulation first after surgery.",bookPage:"82",bookChapter:"Gastrointestinal System",bookSection:"Cholecystitis and cholelithiasis"},{id:"gu-prostate-q10",topic:"Renal & Genitourinary",clientNeed:"Management of Care",format:"Multiple choice",question:"A client with end-stage renal disease is called in for a kidney transplant tomorrow morning. The client's last hemodialysis was 3 days ago. What should the nurse do?",options:[{key:"A",text:"Proceed with surgery prep; dialysis is not needed before a transplant"},{key:"B",text:"Give extra fluids tonight to protect the new kidney"},{key:"C",text:"Tell the client the transplant will have to be cancelled"},{key:"D",text:"Contact the transplant team about dialysis within 24 hours before surgery"}],answer:["D"],rationales:{A:"Wrong. The book lists dialysis within 24 hours if needed as a pre-op priority.",B:"Wrong. Extra fluid could worsen fluid balance in a client who has not been dialyzed.",C:"Wrong. Nothing in the book makes a delay in dialysis a reason to cancel.",D:"The book lists ensuring dialysis within 24 hours if needed to optimize fluid and electrolyte balance before transplant."},takeaway:"Coordinating with the transplant team on pre-op dialysis.",bookPage:"127",bookChapter:"Genitourinary System",bookSection:"Prostate cancer"},{id:"endo-di-q3",topic:"Endocrine",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client taking lithium develops polyuria of more than 3 L per day and is diagnosed with renal diabetes insipidus. Which treatment should the nurse anticipate?",options:[{key:"A",text:"Fluid restriction to 600-800 mL per day"},{key:"B",text:"A thiazide diuretic to reduce the polyuria"},{key:"C",text:"Hypertonic saline infused to raise sodium"},{key:"D",text:"A vasopressin receptor antagonist such as tolvaptan"}],answer:["B"],rationales:{A:"This is the book's SIADH treatment and would worsen dehydration in DI.",B:"The book lists thiazide diuretics to reduce polyuria in renal DI (lithium is listed among drug causes of renal DI on the preceding page).",C:"The book uses hypertonic saline for SIADH; DI already involves hypernatremia.",D:"The book lists these for SIADH; blocking ADH effects would increase water loss."},takeaway:"Match treatment to the type of diabetes insipidus.",bookPage:"105",bookChapter:"Endocrine System",bookSection:"Diabetes insipidus"},{id:"heme-hemophilia-q6",topic:"Hematology & Oncology",clientNeed:"Management of Care",format:"Multiple choice",question:"The nurse is caring for four clients with hemophilia. Which client should the nurse see first?",options:[{key:"A",text:"A child with a small bruise on the shin from a fall yesterday"},{key:"B",text:"An adult with black, tarry stools, a rapid pulse, and low blood pressure"},{key:"C",text:"An adolescent asking how emicizumab prevents future bleeds"},{key:"D",text:"A child with a swollen knee who already has ice applied and the leg elevated"}],answer:["B"],rationales:{A:"A small, older bruise is not a sign of active, life-threatening bleeding.",B:"The book lists melena, tachycardia, and hypotension as signs of internal bleeding, which can be life-threatening.",C:"A teaching question about prophylaxis is not urgent.",D:"This joint bleed is already being managed with ice, rest, and elevation."},takeaway:"Prioritizing signs of internal bleeding over stable or teaching needs.",bookPage:"162",bookChapter:"Hematology / Immunology",bookSection:"Hemophilia"},{id:"nclex-highrisk-q22",topic:"Multisystem & Shock",clientNeed:"Reduction of Risk Potential",format:"Multiple choice",question:"A client with a critical potassium level received treatment. Which finding best shows the nurse that the treatment is effective?",options:[{key:"A",text:"The potassium level has moved toward the normal range on each repeat draw"},{key:"B",text:"The potassium level is unchanged, but the client says the weakness feels better"},{key:"C",text:"Urine output has dropped and the creatinine has risen slowly since admission"},{key:"D",text:"The potassium level improved on one draw, then worsened again on the next"}],answer:["A"],rationales:{A:"The book says improving labs indicate effective treatment and that trend interpretation is key; a steady move toward normal shows the treatment is working.",B:"A symptom report alone does not show that a critical lab has improved; the potassium has not changed.",C:"Falling urine output with a slowly rising creatinine suggests worsening kidney function, not effective treatment.",D:"One improved value followed by a worse one is not an improving trend; the book says never to look at a single lab in isolation."},takeaway:"Use lab trends, not a single value or symptom alone, to judge whether treatment is effective.",bookPage:"8",bookChapter:"NCLEX Must-Know Content",bookSection:"High-risk conditions, labs & medication safety"},{id:"integ-pressure-q1",topic:"Integumentary",clientNeed:"Reduction of Risk Potential",format:"Multiple choice",question:"A bedbound client has an area of intact skin over the sacrum with purple-maroon discoloration. How should the nurse document this finding?",options:[{key:"A",text:"Stage I pressure injury"},{key:"B",text:"Stage II pressure injury"},{key:"C",text:"Unstageable pressure injury"},{key:"D",text:"Deep tissue pressure injury"}],answer:["D"],rationales:{A:"Stage I is non-blanchable erythema (redness) of intact skin, not purple-maroon discoloration.",B:"Stage II is partial-thickness skin loss such as a blister or open ulcer, which is not described here.",C:"Unstageable injuries are covered with slough or eschar; this skin has discoloration but no slough or eschar.",D:"The book defines DTPI as a deep tissue pressure injury with purple or maroon discoloration."},takeaway:"Accurate staging and documentation of pressure injuries.",bookPage:"178",bookChapter:"Integumentary System",bookSection:"Pressure injuries"},{id:"cardio-postpci-q18",topic:"Cardiovascular",clientNeed:"Management of Care",format:"Multiple choice",question:"The nurse receives report on four clients after cardiac intervention. Which client should the nurse see first?",options:[{key:"A",text:"A client receiving prescribed IV hydration before an angiogram scheduled for later today"},{key:"B",text:"A client with occasional PVCs on the monitor who has no symptoms and stable vital signs"},{key:"C",text:"A client with a growing groin hematoma, a falling hemoglobin and a BP of 88/50 mm Hg"},{key:"D",text:"A client who wants to know when the dressing over the access site will be changed"}],answer:["C"],rationales:{A:"Hydration before contrast is planned prevention, not an emergency.",B:"Occasional PVCs without symptoms are monitored with ECG.",C:"Swelling, a hemoglobin drop and hypotension are the book's signs of access-site bleeding, which needs immediate action.",D:"A question about dressing care can wait."},takeaway:"See first the client who is actively bleeding and unstable.",bookPage:"60",bookChapter:"Cardiovascular System",bookSection:"Post-cardiac intervention complications"},{id:"nclex-strategy-q9",topic:"Leadership & Delegation",clientNeed:"Psychosocial Integrity",format:"Multiple choice",question:`A client who just received a new diagnosis is tearful and says, "I can't take anything in right now." The nurse planned to begin teaching. What is the nurse's best action?`,options:[{key:"A",text:"Continue with the full teaching plan so the client is prepared"},{key:"B",text:"Give the client written materials and leave the room"},{key:"C",text:"Acknowledge the client's feelings and plan teaching when the client is ready"},{key:"D",text:"Ask a family member to take notes during the teaching session"}],answer:["C"],rationales:{A:"Teaching that ignores readiness to learn is unlikely to be effective.",B:"Leaving written materials does not address the client's readiness or confirm learning.",C:"The book states effective teaching addresses patient readiness to learn.",D:"Teaching a family member instead does not address the client's own readiness to learn."},takeaway:"Address the client's readiness to learn before teaching.",bookPage:"11",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy"},{id:"msk-fractures-q1",topic:"Musculoskeletal",clientNeed:"Physiological Adaptation",format:"Multiple choice",question:"A client with a new forearm cast reports pain not relieved by medication and tingling in the fingers. Which action should the nurse take?",options:[{key:"A",text:"Document the findings as expected after casting"},{key:"B",text:"Report possible compartment syndrome now"},{key:"C",text:"Recheck neurovascular status in 4 hours"},{key:"D",text:"Slide a ruler under the cast for relief"}],answer:["B"],rationales:{A:"Pain and paresthesia are two of the 6 P's of compartment syndrome listed on this page, so they are not expected findings to simply document.",B:"Pain and paresthesia are among the 6 P's of compartment syndrome, a fracture complication the book lists; it must be reported promptly.",C:"The book calls for neurovascular checks every 1-2 hours in the acute phase; waiting 4 hours with these findings is unsafe.",D:"The book's cast care teaching says to avoid inserting objects into the cast."},takeaway:"Early recognition of compartment syndrome after a fracture.",bookPage:"181",bookChapter:"Musculoskeletal System",bookSection:"Fractures and compartment syndrome"},{id:"nclex-priorities-q19",topic:"Fundamentals & Safety",clientNeed:"Safety and Infection Prevention and Control",format:"Multiple choice",question:"A visitor arrives to see a client who is on isolation precautions and starts to walk into the room without stopping. What should the nurse do?",options:[{key:"A",text:"Let the visitor go in because isolation applies only to staff"},{key:"B",text:"Ask the visitor to keep the visit short and stand near the door"},{key:"C",text:"Tell the visitor to wash hands after leaving the room"},{key:"D",text:"Stop the visitor and explain hand hygiene and the PPE required before entering"}],answer:["D"],rationales:{A:"Infection control standards, including isolation, protect everyone who enters, not only staff.",B:"A short visit near the door does not replace the required precautions.",C:"Hand hygiene only after the visit misses the protection needed on entry.",D:"Following infection control standards (hand hygiene, PPE, isolation) is a key safety principle, and the nurse makes sure the visitor follows them."},takeaway:"Enforce infection control standards to prevent harm.",bookPage:"4",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment"},{id:"neuro-icp-q8",topic:"Neurological",clientNeed:"Reduction of Risk Potential",format:"Multiple choice",question:"A client with a traumatic brain injury has an ICP monitoring device. The current reading is 24 mm Hg. How should the nurse interpret this reading?",options:[{key:"A",text:"It is within the normal range"},{key:"B",text:"It is above the normal range"},{key:"C",text:"It is below the normal range"},{key:"D",text:"It cannot be interpreted without a CT scan"}],answer:["B"],rationales:{A:"The book gives normal ICP as 5-15 mm Hg, so 24 is not normal.",B:"Normal ICP is 5-15 mm Hg, so 24 mm Hg is elevated.",C:"A reading of 24 mm Hg is higher, not lower, than 5-15 mm Hg.",D:"The reading can be compared directly with the normal range."},takeaway:"Compare ICP readings with the normal range of 5-15 mm Hg.",bookPage:"133",bookChapter:"Neurologic System",bookSection:"Increased intracranial pressure"},{id:"resp-pneumonia-q9",topic:"Respiratory",clientNeed:"Basic Care and Comfort",format:"Multiple choice",question:"A client recovering from pneumonia spends most of the day in bed. Which nursing action best helps prevent atelectasis?",options:[{key:"A",text:"Encourage turning, coughing, deep breathing and incentive spirometry"},{key:"B",text:"Limit position changes to conserve the client's energy"},{key:"C",text:"Encourage shallow breathing to reduce chest discomfort"},{key:"D",text:"Keep the client flat in bed to rest the lungs"}],answer:["A"],rationales:{A:"The book says to encourage TCDB (turn, cough, deep breathe) and incentive spirometry to prevent atelectasis.",B:"Turning is part of TCDB; limiting it raises the risk of atelectasis.",C:"Shallow breathing promotes atelectasis; the book calls for deep breathing.",D:"Lying flat does not help clear secretions or expand the lungs."},takeaway:"Prevent atelectasis through lung expansion.",bookPage:"23",bookChapter:"Respiratory System",bookSection:"Pneumonia"},{id:"heme-anaphylaxis-q10",topic:"Immunology & Infectious Disease",clientNeed:"Management of Care",format:"Multiple choice",question:"A client develops anaphylaxis in an outpatient clinic, and the RN is giving epinephrine. Which task is most appropriate to assign to the assistive personnel?",options:[{key:"A",text:"Assess breath sounds for wheezing."},{key:"B",text:"Decide whether the client needs a second medication."},{key:"C",text:"Bring the emergency airway and intubation equipment to the bedside."},{key:"D",text:"Teach the client how to avoid the allergen."}],answer:["C"],rationales:{A:"Assessing breath sounds requires RN assessment.",B:"Deciding on further treatment requires nursing and provider judgment.",C:"The book's nursing priorities include keeping intubation equipment ready; gathering equipment is within the AP's role.",D:"Teaching is part of the RN's role."},takeaway:"Assigning a task to the AP so the RN can manage the airway emergency.",bookPage:"171",bookChapter:"Hematology / Immunology",bookSection:"Immunity and anaphylaxis"},{id:"fluids-main-q8",topic:"Fluids & Electrolytes",clientNeed:"Safety and Infection Prevention and Control",format:"Multiple choice",question:"A nurse is preparing to hang an IV solution labeled with an osmolarity above 300 mOsm/L. Which consideration from the book applies to this solution?",options:[{key:"A",text:"It is the routine choice for general rehydration"},{key:"B",text:"It replaces intracellular fluid losses"},{key:"C",text:"It is used cautiously because misuse can cause dehydration"},{key:"D",text:"It has the same tonicity as normal saline"}],answer:["C"],rationales:{A:"The book names isotonic fluids, not hypertonic fluids, for rehydration.",B:"The book says hypotonic fluids replace intracellular losses.",C:"The book describes hypertonic (>300 mOsm/L) fluids as used cautiously for specific conditions and able to cause dehydration if misused.",D:"Normal saline is listed as isotonic (270-300 mOsm/L), not hypertonic."},takeaway:"Safe use of hypertonic IV fluids.",bookPage:"184",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet"},{id:"gi-gallbladder-q11",topic:"Gastrointestinal",clientNeed:"Reduction of Risk Potential",format:"Multiple choice",question:"A client's HIDA scan shows that the gallbladder does not fill. What does this result indicate?",options:[{key:"A",text:"Cystic duct obstruction"},{key:"B",text:"Hepatitis"},{key:"C",text:"Normal gallbladder function"},{key:"D",text:"Gangrene of the gallbladder"}],answer:["A"],rationales:{A:"The book says nonfilling of the gallbladder on HIDA scan indicates cystic duct obstruction.",B:"Elevated liver enzymes may point to hepatitis.",C:"Nonfilling is an abnormal result.",D:"A WBC above 20,000 may indicate gangrene or perforation."},takeaway:"Interpret HIDA scan results.",bookPage:"82",bookChapter:"Gastrointestinal System",bookSection:"Cholecystitis and cholelithiasis"},{id:"gu-calculi-q11",topic:"Renal & Genitourinary",clientNeed:"Management of Care",format:"Multiple choice",question:"A client with renal colic still rates pain at 9 out of 10 an hour after the prescribed analgesic. The nurse calls the provider using SBAR. Which recommendation is most appropriate?",options:[{key:"A",text:"Hold all analgesics so the pain pattern can be observed"},{key:"B",text:"Limit fluids until the pain improves"},{key:"C",text:"Request additional or different pain medication, such as morphine or ketorolac"},{key:"D",text:"Discharge the client with instructions to return if pain worsens"}],answer:["C"],rationales:{A:"Wrong. The book calls for managing stone pain aggressively, not holding analgesia.",B:"Wrong. The book encourages high fluid intake for stones.",C:"The book says to manage stone pain aggressively and lists morphine and ketorolac; the evaluation shows the current plan is not working.",D:"Wrong. Uncontrolled severe pain needs treatment, not discharge."},takeaway:"Evaluating pain relief and recommending a change when it fails.",bookPage:"124",bookChapter:"Genitourinary System",bookSection:"Renal calculi"},{id:"endo-acromegaly-q13",topic:"Endocrine",clientNeed:"Management of Care",format:"Multiple choice",question:"The evening before transsphenoidal surgery, a client with acromegaly who has signed the consent form says, 'I'm not really sure what the surgeon is going to do.' What should the nurse do?",options:[{key:"A",text:"Notify the surgeon so the procedure can be explained again before surgery."},{key:"B",text:"Explain the surgical risks in detail and have the client sign again."},{key:"C",text:"Reassure the client that the surgery is routine and continue preparations."},{key:"D",text:"Tell the client that questions are not needed once the form is signed."}],answer:["A"],rationales:{A:"Informed consent requires understanding; the surgeon is responsible for explaining the procedure, and the book calls for preoperative education.",B:"Explaining the procedure and its risks for consent is the surgeon's responsibility.",C:"Proceeding ignores a gap in informed consent.",D:"A client may ask questions or withdraw consent at any time."},takeaway:"Advocate for informed consent.",bookPage:"107",bookChapter:"Endocrine System",bookSection:"Acromegaly"},{id:"heme-leukemia-q3",topic:"Hematology & Oncology",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client with acute leukemia has completed induction therapy and is starting the consolidation phase. The client asks what this phase is for. Which response is accurate?",options:[{key:"A",text:"To eradicate any disease remaining after induction"},{key:"B",text:"To give chemotherapy directly into the spinal fluid"},{key:"C",text:"To give high-dose chemotherapy to bring about remission"},{key:"D",text:"To give low-dose chemotherapy over a period of months"}],answer:["A"],rationales:{A:"The book defines consolidation as the phase that eradicates remaining disease.",B:"Intrathecal chemotherapy is described as CNS treatment, a separate phase.",C:"The book identifies high-dose chemotherapy for remission as the induction phase.",D:"Low-dose chemotherapy over months describes the maintenance phase."},takeaway:"Educating the client on the phases of leukemia treatment.",bookPage:"160",bookChapter:"Hematology / Immunology",bookSection:"Leukemia"},{id:"nclex-highrisk-q3",topic:"Multisystem & Shock",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client with increased intracranial pressure from cerebral edema needs IV fluids. Which type of fluid order should the nurse question?",options:[{key:"A",text:"Normal saline for volume replacement"},{key:"B",text:"A hypotonic fluid for maintenance"},{key:"C",text:"Lactated Ringer's for volume replacement"},{key:"D",text:"An isotonic fluid given to restore circulating volume"}],answer:["B"],rationales:{A:"The book lists NS as a volume replacement fluid and does not identify it as worsening cerebral edema.",B:"The book states hypotonic fluids can worsen cerebral edema, which is dangerous with increased intracranial pressure.",C:"LR is listed with NS as a volume replacement fluid, not as one that worsens cerebral edema.",D:"The book's cerebral edema warning applies to hypotonic fluids; isotonic fluids such as NS and LR are listed for volume replacement."},takeaway:"Choose fluids based on why they are used and their risks.",bookPage:"9",bookChapter:"NCLEX Must-Know Content",bookSection:"High-risk conditions, labs & medication safety"},{id:"integ-burns-q4",topic:"Integumentary",clientNeed:"Management of Care",format:"Multiple choice",question:"A nurse in the emergency department receives four clients with burns. All have a patent airway. Which client should the nurse assess first?",options:[{key:"A",text:"A client with a red, dry, painful sunburn on both shoulders"},{key:"B",text:"A client who touched a high-voltage line and has a small, dry wound on one hand"},{key:"C",text:"A client with an intact blister from a hot-water scald on the forearm"},{key:"D",text:"A client with redness on the chest from radiation therapy"}],answer:["B"],rationales:{A:"A red, dry, painful sunburn matches a superficial (1st-degree) burn, which is the least severe depth the book lists.",B:"The book notes that with electrical burns, internal injuries may exceed the visible damage, so a small skin wound does not rule out serious hidden injury.",C:"An intact blister from a scald is a partial-thickness burn on a small area; it needs care but is not the most urgent of these clients.",D:"Radiation is listed as a burn type, but localized redness from therapy is not the most urgent finding here."},takeaway:"With electrical burns, internal injury can be far worse than the visible skin damage.",bookPage:"178",bookChapter:"Integumentary System",bookSection:"Burns"},{id:"cardio-htn-q7",topic:"Cardiovascular",clientNeed:"Safety and Infection Prevention and Control",format:"Multiple choice",question:"A client in hypertensive emergency had a BP of 220/130 mm Hg when an IV nicardipine infusion was started. One hour later, which BP reading best reflects safe progress toward the treatment goal?",options:[{key:"A",text:"170/104 mm Hg"},{key:"B",text:"118/72 mm Hg"},{key:"C",text:"140/86 mm Hg"},{key:"D",text:"216/128 mm Hg"}],answer:["A"],rationales:{A:"A drop to 170/104 mm Hg lowers BP by less than 25%, matching the goal for the first hour.",B:"This is far more than a 25% drop in the first hour.",C:"This is still more than a 25% drop in the first hour.",D:"The book calls for reducing BP rapidly but cautiously; almost no change is not progress."},takeaway:"Lower BP by no more than 25% in the first hour.",bookPage:"54",bookChapter:"Cardiovascular System",bookSection:"Hypertensive urgency and emergency"},{id:"nclex-strategy-q23",topic:"Leadership & Delegation",clientNeed:"Health Promotion and Maintenance",format:"Multiple choice",question:"A client is going home on a new medication that can cause dizziness. Which teaching topic should the nurse cover first?",options:[{key:"A",text:"How to request refills from the pharmacy before running out"},{key:"B",text:"The brand and generic names of the new medication"},{key:"C",text:"How to store the medication at room temperature"},{key:"D",text:"How to prevent falls if dizziness occurs"}],answer:["D"],rationales:{A:"Refills support adherence, but they do not address the immediate safety risk from dizziness.",B:"Knowing the drug names is useful, but it does not protect the client from injury.",C:"Proper storage matters, but it does not address the risk created by dizziness.",D:"Teaching focuses on safety first, and dizziness from the medication creates a fall risk."},takeaway:"Teaching focuses on safety first.",bookPage:"11",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy"},{id:"msk-bone-q10",topic:"Musculoskeletal",clientNeed:"Basic Care and Comfort",format:"Multiple choice",question:"A nurse taught a client with osteoarthritis of the knee how to manage symptoms. Which statement shows the teaching was effective?",options:[{key:"A",text:"I'll balance rest with activity and use my cane on longer walks."},{key:"B",text:"I'll stay off my feet as much as possible from now on."},{key:"C",text:"I'll push through the pain and walk as far as I can every day."},{key:"D",text:"Using a cane will only make my knee weaker over time."}],answer:["A"],rationales:{A:"The book lists joint rest balanced with activity and assistive devices such as canes.",B:"Total rest is not what the book teaches; it calls for a balance of rest and activity.",C:"Pushing through pain ignores the need for joint rest.",D:"The book lists canes as helpful assistive devices for OA."},takeaway:"Evaluate understanding of OA self-management: rest and activity balance and assistive devices.",bookPage:"181",bookChapter:"Musculoskeletal System",bookSection:"Osteoporosis, osteoarthritis and gout"},{id:"nclex-priorities-q24",topic:"Fundamentals & Safety",clientNeed:"Management of Care",format:"Multiple choice",question:"A nurse is planning the first rounds of the shift. Which client's problem should the nurse address first?",options:[{key:"A",text:"A client with a potassium level just outside the normal range who has no symptoms"},{key:"B",text:"A client with low blood pressure who is alert and has no sign of bleeding"},{key:"C",text:"A client with a partial airway obstruction who is drooling and cannot swallow"},{key:"D",text:"A client with a slightly decreased oxygen saturation who is resting comfortably"}],answer:["C"],rationales:{A:"A mildly abnormal potassium in a client without symptoms needs follow-up, but the book says to treat airway obstruction before an abnormal lab value.",B:"Circulation issues follow airway and breathing problems.",C:"Airway problems come first; this client's airway is at risk.",D:"Breathing problems come after airway problems."},takeaway:"Airway comes first in the ABCs.",bookPage:"5",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment"},{id:"neuro-gbs-q1",topic:"Neurological",clientNeed:"Physiological Adaptation",format:"Multiple choice",question:"A client with Guillain-Barre syndrome has a vital capacity below 15 mL/kg, a weak voice, and cannot cough effectively. Which action should the nurse take?",options:[{key:"A",text:"Encourage the client to rest and recheck tomorrow"},{key:"B",text:"Prepare for intubation and mechanical ventilation"},{key:"C",text:"Begin passive range-of-motion to all extremities"},{key:"D",text:"Reposition the client and reassess in two hours"}],answer:["B"],rationales:{A:"These are signs of respiratory collapse that need urgent action, not delay.",B:"The book lists these as red flags and says to prepare for intubation and mechanical ventilation.",C:"Passive ROM is supportive care but does not address impending respiratory failure.",D:"Repositioning prevents pressure injury but does not treat failing respiratory muscles."},takeaway:"Recognize respiratory collapse and secure the airway.",bookPage:"149",bookChapter:"Neurologic System",bookSection:"Guillain-Barr\xE9 syndrome"},{id:"resp-asthma-q4",topic:"Respiratory",clientNeed:"Psychosocial Integrity",format:"Multiple choice",question:"A client having a first-ever asthma attack is wheezing and very frightened. Along with ordered treatment, which nursing action is most appropriate?",options:[{key:"A",text:"Stay with the client and use a calm, reassuring approach"},{key:"B",text:"Leave the room so the client can rest quietly"},{key:"C",text:"Tell the client the attack is not serious"},{key:"D",text:"Ask the client for a detailed health history now"}],answer:["A"],rationales:{A:"The book notes anxiety worsens asthma symptoms, especially in first-time patients, so calm support helps.",B:"Leaving a frightened client alone can increase anxiety, which the book says worsens symptoms.",C:"Dismissing the attack is false reassurance and does not ease the anxiety.",D:"Long questioning adds work of breathing; the book advises short yes/no communication."},takeaway:"Reduce anxiety, which worsens asthma symptoms.",bookPage:"28",bookChapter:"Respiratory System",bookSection:"Asthma and status asthmaticus"},{id:"heme-lupus-q11",topic:"Immunology & Infectious Disease",clientNeed:"Psychosocial Integrity",format:"Multiple choice",question:"A 24-year-old client with SLE says she avoids her friends because her rash and hair changes make her feel unattractive. Which nursing response best supports her self-image?",options:[{key:"A",text:"Advise her to stay home until the rash clears."},{key:"B",text:"Tell her that appearance changes are minor compared with kidney disease."},{key:"C",text:"Suggest strong hair dyes to cover the changes."},{key:"D",text:"Invite her to share her feelings and discuss hypoallergenic grooming products."}],answer:["D"],rationales:{A:"Isolation does not support coping or self-image.",B:"Minimizing her concern dismisses her feelings.",C:"The book recommends hypoallergenic products, not harsh ones.",D:"The book's supportive care for grooming and self-image includes hypoallergenic products and specialized hair care, and it encourages open discussion."},takeaway:"Supporting body image and social coping in SLE.",bookPage:"173",bookChapter:"Hematology / Immunology",bookSection:"Lupus erythematosus"},{id:"fluids-main-q1",topic:"Fluids & Electrolytes",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client's potassium is high, and the ECG shows tall peaked T waves and a wide QRS. Which order should the nurse anticipate to move potassium into the cells?",options:[{key:"A",text:"Magnesium sulfate IV"},{key:"B",text:"3% sodium chloride infusion"},{key:"C",text:"Regular insulin IV with D50"},{key:"D",text:"Oral vitamin D supplement"}],answer:["C"],rationales:{A:"The book lists IV magnesium sulfate for hypomagnesemia, not for hyperkalemia.",B:"The book lists 3% NaCl for hyponatremia, not for lowering potassium.",C:"The book lists regular insulin 10 units IV push with D50 to move potassium into the cells in hyperkalemia.",D:"The book lists vitamin D under calcium management, not hyperkalemia."},takeaway:"Treating hyperkalemia by shifting potassium into the cells.",bookPage:"185",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet"},{id:"gi-cirrhosis-q8",topic:"Gastrointestinal",clientNeed:"Management of Care",format:"Multiple choice",question:"The nurse is caring for a client with cirrhosis and ascites. Which task can the nurse delegate to assistive personnel?",options:[{key:"A",text:"Teach the client about alcohol cessation."},{key:"B",text:"Interpret a change in liver enzyme results."},{key:"C",text:"Measure the client's abdominal girth at the marked level."},{key:"D",text:"Assess the client for shifting dullness."}],answer:["C"],rationales:{A:"Teaching is an RN responsibility.",B:"Interpreting labs requires nursing judgment.",C:"Measuring abdominal girth is part of the book's core monitoring and is a routine measurement that can be delegated, with the RN reviewing the results.",D:"Percussion for shifting dullness is an RN assessment."},takeaway:"Delegate routine measurements and keep assessment, teaching and interpretation with the RN.",bookPage:"80",bookChapter:"Gastrointestinal System",bookSection:"Cirrhosis"},{id:"gu-overview-q3",topic:"Renal & Genitourinary",clientNeed:"Physiological Adaptation",format:"Multiple choice",question:"A client who received a kidney transplant has a temperature of 38.4 C, tenderness over the graft site, and a falling urine output. What is the nurse's best interpretation?",options:[{key:"A",text:"These findings suggest possible rejection and must be reported"},{key:"B",text:"These findings are expected while the new kidney adjusts"},{key:"C",text:"These findings point to dehydration needing oral fluids only"},{key:"D",text:"These findings mean the client needs a bladder scan first"}],answer:["A"],rationales:{A:"The book lists fever, graft tenderness, and decreased output as signs of rejection to monitor for after transplant.",B:"Wrong. The book treats this cluster as warning signs of rejection, not an expected adjustment.",C:"Wrong. Graft tenderness with fever is not explained by dehydration; the book names these as rejection signs.",D:"Wrong. A bladder scan does not address the fever and graft tenderness the book identifies as rejection signs."},takeaway:"Recognizing transplant rejection.",bookPage:"115",bookChapter:"Genitourinary System",bookSection:"Priority nursing actions"},{id:"endo-siadh-q2",topic:"Endocrine",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client with SIADH is receiving hypertonic saline. Which finding should the nurse report immediately?",options:[{key:"A",text:"Serum sodium rose 6 mEq/L over the past 24 hours"},{key:"B",text:"Body weight decreased by 0.5 kg since yesterday"},{key:"C",text:"Serum sodium rose 15 mEq/L over the past 24 hours"},{key:"D",text:"Urine output increased slightly since yesterday"}],answer:["C"],rationales:{A:"This is within the book's safe limit of 8-10 mEq/L in 24 hours.",B:"Modest weight loss fits the goal of reducing excess fluid.",C:"The book limits correction to no more than 8-10 mEq/L in 24 hours to prevent osmotic demyelination syndrome.",D:"Low urine output is a key SIADH sign, so a modest rise reflects improvement."},takeaway:"Prevent osmotic demyelination by correcting hyponatremia slowly.",bookPage:"104",bookChapter:"Endocrine System",bookSection:"SIADH"},{id:"heme-transfusion-q6",topic:"Hematology & Oncology",clientNeed:"Psychosocial Integrity",format:"Multiple choice",question:'A client about to receive a first blood transfusion says, "I am scared. I have heard people can have bad reactions to blood." Which response by the nurse is most appropriate?',options:[{key:"A",text:"Reactions almost never happen, so there is nothing to worry about."},{key:"B",text:"If you are scared, we can cancel the transfusion and try something else."},{key:"C",text:"The blood is matched and checked carefully, and I will stay with you for the first 15 minutes."},{key:"D",text:"Let's not talk about reactions, because that will only make you more nervous."}],answer:["C"],rationales:{A:"False reassurance dismisses the client's fear; the book notes reactions can occur even with matching.",B:"This does not address the fear and could interfere with needed treatment.",C:"The book's prevention steps include careful matching, ID checks, and staying with the client for the first 15 minutes, and it calls for educating and supporting the client.",D:"Avoiding the topic blocks communication and the education the book recommends."},takeaway:"Easing anxiety with honest teaching about safety measures.",bookPage:"165",bookChapter:"Hematology / Immunology",bookSection:"Blood transfusion reaction"},{id:"nclex-highrisk-q19",topic:"Multisystem & Shock",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A nurse has four medications due at the same time. Which situation needs the nurse's attention first?",options:[{key:"A",text:"An oral vitamin due for a stable client"},{key:"B",text:"An opioid due for a client whose respiratory rate has dropped since the last dose"},{key:"C",text:"A stool softener due for a client who is eating well"},{key:"D",text:"An eye drop due for a client with dry eyes"}],answer:["B"],rationales:{A:"A routine vitamin for a stable client is low risk.",B:"Opioids are high-alert medications, and a drop in breathing means the nurse must assess before giving another dose.",C:"A stool softener for a stable client is low risk.",D:"A lubricating eye drop is low risk."},takeaway:"Assess before giving high-alert medications that affect breathing.",bookPage:"8",bookChapter:"NCLEX Must-Know Content",bookSection:"High-risk conditions, labs & medication safety"},{id:"integ-pressure-q2",topic:"Integumentary",clientNeed:"Physiological Adaptation",format:"Multiple choice",question:"A pressure injury on a client's heel shows full-thickness tissue loss with visible fat, but no exposed muscle, tendon or bone. Which stage should the nurse record?",options:[{key:"A",text:"Stage II"},{key:"B",text:"Stage III"},{key:"C",text:"Stage IV"},{key:"D",text:"Unstageable"}],answer:["B"],rationales:{A:"Stage II is partial-thickness loss such as a blister or open ulcer, not full-thickness loss with fat showing.",B:"The book defines Stage III as full-thickness loss with visible fat.",C:"Stage IV involves exposure of muscle, tendon or bone, which is absent in this wound.",D:"A wound is unstageable when slough or eschar covers it; here the base is visible and fat can be seen."},takeaway:"Correct staging of pressure injuries.",bookPage:"178",bookChapter:"Integumentary System",bookSection:"Pressure injuries"},{id:"cardio-cardiomyopathy-q6",topic:"Cardiovascular",clientNeed:"Health Promotion and Maintenance",format:"Multiple choice",question:"A 28-year-old female client is being evaluated for newly diagnosed cardiomyopathy. Along with her alcohol intake, which assessment is most important for the nurse to include?",options:[{key:"A",text:"Her history of seasonal pollen allergies"},{key:"B",text:"Her usual number of hours of sleep"},{key:"C",text:"Whether she is currently pregnant"},{key:"D",text:"Her daily caffeine intake"}],answer:["C"],rationales:{A:"Pollen allergies are not listed; the book asks about hypersensitive reactions to medications.",B:"Sleep is not among the factors the book lists for cardiomyopathy assessment.",C:"The book directs the nurse to determine whether female clients are pregnant.",D:"Caffeine is not one of the lifestyle factors the book names; alcohol is."},takeaway:"Include pregnancy status in the cardiomyopathy history.",bookPage:"50",bookChapter:"Cardiovascular System",bookSection:"Cardiomyopathy"},{id:"nclex-strategy-q8",topic:"Leadership & Delegation",clientNeed:"Psychosocial Integrity",format:"Multiple choice",question:`A client who is stable declines a scheduled physical therapy session today, saying it "isn't worth it." What should the nurse do first?`,options:[{key:"A",text:"Tell the client the session is required and must be completed"},{key:"B",text:"Ask what the client understands about the purpose of the session"},{key:"C",text:"Cancel all future therapy sessions to honor the client's wishes"},{key:"D",text:"Document the refusal and take no further action"}],answer:["B"],rationales:{A:"Insisting on the session ignores patient autonomy.",B:"The book says that when a patient refuses care, the nurse assesses understanding and respects the decision.",C:"Cancelling all future care goes beyond the client's decision and skips assessing understanding.",D:"The nurse should assess the client's understanding before simply documenting."},takeaway:"Respect autonomy after assessing the client's understanding.",bookPage:"11",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy"},{id:"msk-osteomyelitis-q2",topic:"Musculoskeletal",clientNeed:"Management of Care",format:"Multiple choice",question:"A client returns from surgery after a below-knee amputation. Which nursing action is the priority in the immediate post-op period?",options:[{key:"A",text:"Begin prone positioning right away"},{key:"B",text:"Start teaching about prosthesis use"},{key:"C",text:"Discuss feelings about body image"},{key:"D",text:"Check vital signs and dressing for bleeding"}],answer:["D"],rationales:{A:"Prone positioning is listed to promote mobility, but it does not come before preventing hemorrhage.",B:"Prosthesis teaching is not listed among the book's immediate post-op priorities.",C:"Psychosocial support is listed, but bleeding control comes first right after surgery.",D:"The book lists preventing hemorrhage and monitoring vital signs and the dressing as post-op amputation priorities."},takeaway:"Preventing hemorrhage after amputation.",bookPage:"182",bookChapter:"Musculoskeletal System",bookSection:"Osteomyelitis, amputations and joint replacement"},{id:"nclex-priorities-q7",topic:"Fundamentals & Safety",clientNeed:"Safety and Infection Prevention and Control",format:"Multiple choice",question:"The laboratory calls a nurse with a critical value for a client. The nurse is in the middle of updating care plan documentation. What should the nurse do?",options:[{key:"A",text:"Act on the critical value immediately"},{key:"B",text:"Finish the documentation and then review the value"},{key:"C",text:"Record the value and report it at the next handoff"},{key:"D",text:"Wait for the next scheduled lab draw to confirm it"}],answer:["A"],rationales:{A:"The book lists acting immediately on critical lab values as a key safety principle, and safety outranks documentation.",B:"Documentation ranks below actions that prevent harm.",C:"Deferring to handoff delays action on a critical value.",D:"Waiting for another draw delays action the book says must be immediate."},takeaway:"Act immediately on critical lab values.",bookPage:"4",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment"},{id:"neuro-parkinson-q10",topic:"Neurological",clientNeed:"Management of Care",format:"Multiple choice",question:"The nurse is caring for four clients with Parkinson disease. Which client should the nurse assess first?",options:[{key:"A",text:"A client who has a masked facial expression"},{key:"B",text:"A client with a resting tremor of the right hand"},{key:"C",text:"A client who chokes during meals and now has a fever and crackles"},{key:"D",text:"A client who walks with short, shuffling steps using a walker"}],answer:["C"],rationales:{A:"A masked face is an expected sign of PD.",B:"A resting tremor is a cardinal, expected sign.",C:"The book states death in PD often results from aspiration pneumonia; choking with fever and crackles suggests this complication.",D:"Shuffling steps are expected, and the client is using an assistive device."},takeaway:"Aspiration pneumonia is a leading cause of death in PD and needs urgent assessment.",bookPage:"142",bookChapter:"Neurologic System",bookSection:"Parkinson disease"},{id:"resp-copd-q14",topic:"Respiratory",clientNeed:"Health Promotion and Maintenance",format:"Multiple choice",question:"A client with COPD asks what can be done at home or at work to lower the risk of exacerbations. Which response by the nurse is accurate?",options:[{key:"A",text:'"Open your windows on high-pollen days to bring in fresh air."'},{key:"B",text:`"Flare-ups are caused only by bacteria, so home changes won't help."`},{key:"C",text:'"A wood fire will help keep your airways warm and open."'},{key:"D",text:'"Enhanced air filtration in your home or workplace may reduce your risk."'}],answer:["D"],rationales:{A:"Pollen is a listed trigger.",B:"Triggers also include allergens, irritants and viral infections.",C:"Fire smoke is a listed airway irritant.",D:"The book's prevention tip is enhanced air filtration in the home or workplace."},takeaway:"Teach environmental changes that reduce exacerbations.",bookPage:"27",bookChapter:"Respiratory System",bookSection:"COPD"},{id:"heme-ra-q2",topic:"Immunology & Infectious Disease",clientNeed:"Physiological Adaptation",format:"Multiple choice",question:"Which assessment findings are most consistent with rheumatoid arthritis?",options:[{key:"A",text:"Morning stiffness with symmetrical pain in hand joints"},{key:"B",text:"Ruddy skin with itching after a warm shower"},{key:"C",text:"Spoon-shaped nails with difficulty swallowing"},{key:"D",text:"Joint swelling from bleeding after minor trauma"}],answer:["A"],rationales:{A:"The book lists morning stiffness, symmetrical joint pain, and involvement of the MCP, PIP, and wrist joints in RA.",B:"A ruddy complexion and itching after bathing are polycythemia findings.",C:"These findings describe Plummer-Vinson syndrome in severe iron deficiency anemia.",D:"Hemarthrosis after trauma describes hemophilia, not RA."},takeaway:"Recognizing the classic presentation of rheumatoid arthritis.",bookPage:"174",bookChapter:"Hematology / Immunology",bookSection:"Rheumatoid arthritis"},{id:"fluids-main-q17",topic:"Fluids & Electrolytes",clientNeed:"Safety and Infection Prevention and Control",format:"Multiple choice",question:"A client has been receiving a hypertonic IV solution (above 300 mOsm/L). Which finding suggests the solution is causing the harm the book warns about?",options:[{key:"A",text:"Moist mucous membranes and a steady weight"},{key:"B",text:"Urine output that matches fluid intake"},{key:"C",text:"Clear lung sounds and normal skin turgor"},{key:"D",text:"New intense thirst and dry mucous membranes"}],answer:["D"],rationales:{A:"Moist mucous membranes and a steady weight suggest adequate hydration.",B:"Balanced intake and output does not suggest dehydration.",C:"Clear lungs and normal skin turgor do not suggest dehydration or fluid overload.",D:"A hypertonic solution pulls water out of the cells; new thirst and dry mucous membranes are signs of the dehydration the book says misused hypertonic fluids can cause. (The nurse also watches for fluid overload as water shifts into the vascular space.)"},takeaway:"Evaluate clients on hypertonic fluids for signs of dehydration.",bookPage:"184",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet"},{id:"gi-uc-q2",topic:"Gastrointestinal",clientNeed:"Physiological Adaptation",format:"Multiple choice",question:"Which client report is most consistent with ulcerative colitis?",options:[{key:"A",text:"Burning heartburn that worsens when lying flat"},{key:"B",text:"Three to five semisoft, nonbloody stools daily"},{key:"C",text:"Frequent bloody diarrhea with mucus; pain eases after a stool"},{key:"D",text:"Right upper quadrant pain after a fatty meal"}],answer:["C"],rationales:{A:"Heartburn worse lying flat is a classic GERD symptom in the book.",B:"Nonbloody diarrhea of 3 to 5 semisoft stools is the book's early Crohn picture.",C:"The book describes bloody diarrhea, rectal mucus and pain relieved by defecation in UC.",D:"RUQ pain after fatty meals fits gallbladder disease in the book."},takeaway:"Recognize the classic history of ulcerative colitis.",bookPage:"85",bookChapter:"Gastrointestinal System",bookSection:"Ulcerative colitis"},{id:"gu-calculi-q8",topic:"Renal & Genitourinary",clientNeed:"Management of Care",format:"Multiple choice",question:"The nurse receives report on four clients with kidney stones. Which client should the nurse assess first?",options:[{key:"A",text:"A client who passed a stone and wants to know what type it is"},{key:"B",text:"A client with a 3 mm stone whose pain is controlled with ketorolac"},{key:"C",text:"A client who is asking for another urine strainer"},{key:"D",text:"A client with an obstructing stone who now has fever and chills"}],answer:["D"],rationales:{A:"Wrong. A question about stone type can wait.",B:"Wrong. Controlled pain is a stable finding.",C:"Wrong. Supplies can be provided after urgent needs are met.",D:"The book warns that stones can cause obstruction with infection and sepsis; fever and chills with an obstructing stone are a warning sign."},takeaway:"Recognizing infection with obstruction as the most urgent problem.",bookPage:"123",bookChapter:"Genitourinary System",bookSection:"Renal calculi"},{id:"endo-addison-q7",topic:"Endocrine",clientNeed:"Management of Care",format:"Multiple choice",question:"A nurse is caring for four clients with Addison disease. Which client should the nurse assess first?",options:[{key:"A",text:"A client asking whether the darkening of her gums will be permanent"},{key:"B",text:"A client scheduled for an ACTH stimulation test tomorrow who has questions"},{key:"C",text:"A client who developed a fever with vomiting and diarrhea overnight"},{key:"D",text:"A client who reports craving salty snacks"}],answer:["C"],rationales:{A:"Gum hyperpigmentation is an expected finding and not urgent.",B:"Test teaching is important but can wait until unstable clients are assessed.",C:"The book lists infection and fluid loss as triggers of adrenal crisis, which can require hospitalization.",D:"Salt craving is an expected symptom of adrenal insufficiency."},takeaway:"Prioritize the client at risk for adrenal crisis.",bookPage:"99",bookChapter:"Endocrine System",bookSection:"Addison disease (adrenal insufficiency)"},{id:"heme-itp-q9",topic:"Hematology & Oncology",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A 7-year-old with ITP has severe bleeding. Which treatment should the nurse prepare to give?",options:[{key:"A",text:"Aspirin"},{key:"B",text:"Hydroxyurea"},{key:"C",text:"IVIG"},{key:"D",text:"Desmopressin"}],answer:["C"],rationales:{A:"The book says to avoid aspirin in ITP.",B:"Hydroxyurea is used in sickle cell disease and polycythemia.",C:"The book says to treat severe bleeding in children with IVIG, steroids, or platelets if critical.",D:"Desmopressin is listed for mild hemophilia A."},takeaway:"Anticipating treatment of severe bleeding in childhood ITP.",bookPage:"168",bookChapter:"Hematology / Immunology",bookSection:"Idiopathic thrombocytopenic purpura (ITP)"},{id:"nclex-highrisk-q11",topic:"Multisystem & Shock",clientNeed:"Basic Care and Comfort",format:"Multiple choice",question:"A client who is eating very little is receiving D5 1/2NS. The client asks why there is sugar in the IV fluid. Which response by the nurse is accurate?",options:[{key:"A",text:"It is used to correct a high sodium level by adding free water"},{key:"B",text:"It replaces blood loss after surgery"},{key:"C",text:"It provides hydration and some calories and prevents tissue breakdown"},{key:"D",text:"It is the fluid of choice for clients with swelling in the brain"}],answer:["C"],rationales:{A:"The book gives this purpose for D5W in hypernatremia, not for D5 1/2NS.",B:"The book lists NS and LR for volume replacement.",C:"The book states D5 1/2NS is used for hydration, provides calories and prevents catabolism (breakdown of body tissue).",D:"The book does not describe D5 1/2NS for cerebral edema; it lists this fluid for hydration, calories and preventing catabolism."},takeaway:"Explain why a fluid is chosen, including its caloric role.",bookPage:"9",bookChapter:"NCLEX Must-Know Content",bookSection:"High-risk conditions, labs & medication safety"},{id:"integ-skin-q3",topic:"Integumentary",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client is diagnosed with a herpes skin infection. Which medication should the nurse anticipate being prescribed?",options:[{key:"A",text:"Acyclovir"},{key:"B",text:"Clotrimazole"},{key:"C",text:"Fluconazole"},{key:"D",text:"Oral antihistamine"}],answer:["A"],rationales:{A:"The book lists acyclovir and valacyclovir as antivirals used for herpes.",B:"The book lists clotrimazole as a topical antifungal, not as treatment for a viral herpes infection.",C:"The book lists fluconazole as an oral antifungal for systemic fungal infection, not for herpes.",D:"Oral antihistamines are listed as antipruritics to reduce itching; they do not treat the herpes virus."},takeaway:"Matching the drug class to the type of skin infection.",bookPage:"179",bookChapter:"Integumentary System",bookSection:"Skin infections, skin cancer and wound care"},{id:"cardio-acs-q2",topic:"Cardiovascular",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client with an inferior MI has ST elevation in V4R and a low blood pressure. Which prescribed medication should the nurse question?",options:[{key:"A",text:"IV fluid bolus to support blood pressure"},{key:"B",text:"Dobutamine infusion for inotropic support"},{key:"C",text:"Chewable aspirin to inhibit platelets"},{key:"D",text:"Sublingual nitroglycerin for chest pain"}],answer:["D"],rationales:{A:"The book recommends IV fluids for right ventricular infarct.",B:"Positive inotropes such as dobutamine are recommended for right ventricular infarct.",C:"Aspirin is given in MI unless contraindicated; nothing in the stem contraindicates it.",D:"The book says to avoid nitrates in right ventricular infarct because they worsen already low preload."},takeaway:"Avoid preload reducers in right ventricular MI.",bookPage:"48",bookChapter:"Cardiovascular System",bookSection:"Acute coronary syndrome"},{id:"nclex-strategy-q16",topic:"Leadership & Delegation",clientNeed:"Management of Care",format:"Multiple choice",question:"A nurse is calling a provider about a client using SBAR. Which statement belongs in the Recommendation part of the report?",options:[{key:"A",text:'"I would like you to come see the client now and consider new orders."'},{key:"B",text:`"I'm calling about the client in room 4, whose oxygen saturation has dropped."`},{key:"C",text:'"The client had abdominal surgery yesterday and has a history of heart failure."'},{key:"D",text:`"The client's lungs sound wet, and I think the client is getting worse."`}],answer:["A"],rationales:{A:"The Recommendation states clearly what the nurse wants done, which the book says every provider call needs.",B:"This describes the Situation.",C:"This gives the Background.",D:"This is the nurse's Assessment."},takeaway:"End SBAR with a clear recommendation; incomplete communication is a common trap.",bookPage:"10",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy"},{id:"msk-bone-q1",topic:"Musculoskeletal",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client is starting alendronate for osteoporosis. Which instruction should the nurse include?",options:[{key:"A",text:"Take it with milk at bedtime"},{key:"B",text:"Lie down for 30 minutes afterward"},{key:"C",text:"Take it with water and stay upright"},{key:"D",text:"Stop weight-bearing activity"}],answer:["C"],rationales:{A:"The book specifies taking it with water and sitting upright, which bedtime dosing lying down does not allow.",B:"Lying down contradicts the book's instruction to sit upright after the dose.",C:"The book states bisphosphonates such as alendronate are taken with water while sitting upright.",D:"The book recommends weight-bearing exercise as part of osteoporosis management."},takeaway:"Safe administration teaching for bisphosphonates.",bookPage:"181",bookChapter:"Musculoskeletal System",bookSection:"Osteoporosis, osteoarthritis and gout"},{id:"nclex-priorities-q21",topic:"Fundamentals & Safety",clientNeed:"Basic Care and Comfort",format:"Multiple choice",question:`A client at risk for falls tells the nurse, "I need to go to the bathroom right now," and starts to get up. What is the nurse's best action?`,options:[{key:"A",text:"Assist the client to stand and walk with the client to the bathroom"},{key:"B",text:"Tell the client to wait until the next scheduled round"},{key:"C",text:"Let the client go alone to preserve independence"},{key:"D",text:"Raise the bed to its highest position so the client stays in bed"}],answer:["A"],rationales:{A:"Preventing falls is a key safety principle; staying with and helping the client meets the elimination need safely.",B:"Making the client wait may lead the client to get up alone and fall.",C:"Walking alone puts a client at risk for falls in danger of injury.",D:"A high bed increases the injury risk if the client tries to get out anyway."},takeaway:"Meet elimination and mobility needs while preventing falls.",bookPage:"4",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment"},{id:"neuro-parkinson-q12",topic:"Neurological",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"An anticholinergic medication is added to the treatment plan of a client with Parkinson disease. The client asks how it will help. Which explanation by the nurse is accurate?",options:[{key:"A",text:'"It replaces the need for physical therapy."'},{key:"B",text:'"It is converted into dopamine in the brain."'},{key:"C",text:'"It stops the breakdown of dopamine."'},{key:"D",text:'"It blocks acetylcholine to reduce your tremor."'}],answer:["D"],rationales:{A:"Therapy remains part of PD care.",B:"This describes levodopa.",C:"This describes MAO-B inhibitors such as rasagiline.",D:"The book states anticholinergics block acetylcholine to reduce tremors."},takeaway:"Know the action of each Parkinson medication class.",bookPage:"144",bookChapter:"Neurologic System",bookSection:"Parkinson disease"},{id:"resp-pe-q3",topic:"Respiratory",clientNeed:"Pharmacological and Parenteral Therapies",format:"Multiple choice",question:"A client with PE is receiving a continuous heparin infusion. Which nursing intervention is most appropriate?",options:[{key:"A",text:"Monitor for bleeding and limit venipunctures and injections"},{key:"B",text:"Keep the client on strict bed rest without range of motion"},{key:"C",text:"Restrict oral fluids to less than 1 liter per day"},{key:"D",text:"Give pain medication by intramuscular injection"}],answer:["A"],rationales:{A:"During anticoagulant therapy the book directs monitoring for bleeding and limiting invasive procedures.",B:"The book encourages early ambulation or chair rest and range-of-motion exercises every 8 hours.",C:"The book recommends at least 2 L/day of fluid if not restricted.",D:"Injections are limited during anticoagulation because of the bleeding risk."},takeaway:"Prevent and detect bleeding during anticoagulation.",bookPage:"20",bookChapter:"Respiratory System",bookSection:"Pulmonary embolism"},{id:"heme-anaphylaxis-q3",topic:"Immunology & Infectious Disease",clientNeed:"Health Promotion and Maintenance",format:"Multiple choice",question:"A client asks why the body responds faster the second time it meets the same germ. The nurse's explanation should be based on which feature of the immune system?",options:[{key:"A",text:"Innate immunity, because neutrophils remember earlier infections"},{key:"B",text:"Skin and mucous membranes, which strengthen after each exposure"},{key:"C",text:"Adaptive immunity, whose B and T cells form long-lasting memory"},{key:"D",text:"Complement proteins, which act faster after the first infection"}],answer:["C"],rationales:{A:"The book states innate immunity has no memory and gives the same response every time.",B:"Skin and mucous membranes are innate barriers; the book does not describe them as having memory.",C:"The book states adaptive immunity uses B and T cells, is highly specific, and has long-lasting memory with a faster response on re-exposure.",D:"Complement proteins belong to innate immunity, which the book says has no memory."},takeaway:"Explaining immune memory to a client.",bookPage:"169",bookChapter:"Hematology / Immunology",bookSection:"Immunity and anaphylaxis"},{id:"fluids-main-q10",topic:"Fluids & Electrolytes",clientNeed:"Basic Care and Comfort",format:"Multiple choice",question:"A client is admitted with a sodium level outside the 135-145 mEq/L range. Which routine nursing measure from the book should the nurse include in the care plan?",options:[{key:"A",text:"Monitor intake and output and adjust dietary sodium"},{key:"B",text:"Encourage a high-potassium diet"},{key:"C",text:"Restrict all oral fluids"},{key:"D",text:"Give a vitamin D supplement daily"}],answer:["A"],rationales:{A:"The book's sodium management tips are to monitor intake and output and adjust dietary sodium.",B:"The book links regulating dietary potassium to potassium management, not sodium.",C:"Complete fluid restriction is not among the book's sodium management tips.",D:"The book lists vitamin D under calcium management."},takeaway:"Basic care measures for a sodium imbalance: intake and output and diet.",bookPage:"185",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet"},{id:"gi-pancreatitis-q2",topic:"Gastrointestinal",clientNeed:"Reduction of Risk Potential",format:"Multiple choice",question:"A client with acute pancreatitis has fat necrosis noted on imaging. Which laboratory change should the nurse anticipate as a result?",options:[{key:"A",text:"Serum calcium below the normal range"},{key:"B",text:"Serum glucose below the normal range"},{key:"C",text:"Serum lipase within the normal range"},{key:"D",text:"Serum amylase below the normal range"}],answer:["A"],rationales:{A:"The book explains that fat necrosis binds free calcium, leading to hypocalcemia.",B:"The book describes hyperglycemia from beta-cell injury, not low glucose.",C:"The book states lipase is elevated in pancreatic inflammation.",D:"The book states amylase rises in acute pancreatitis."},takeaway:"Anticipate hypocalcemia linked to fat necrosis.",bookPage:"70",bookChapter:"Gastrointestinal System",bookSection:"Pancreatitis"},{id:"neuro-gbs-q4",topic:"Neurological",clientNeed:"Reduction of Risk Potential",format:"Select all that apply",question:"A client with Guillain-Barre syndrome has weakness that is now moving up to the trunk. Which findings are red flags for respiratory collapse? Select all that apply.",options:[{key:"A",text:"Shallow, rapid breathing"},{key:"B",text:"Vital capacity below 15 mL/kg"},{key:"C",text:"A strong, effective cough"},{key:"D",text:"A change in the client's voice"},{key:"E",text:"Use of accessory muscles"},{key:"F",text:"Weakness that started in the legs"}],answer:["A","B","D","E"],rationales:{A:"Shallow or rapid breathing is a listed red flag.",B:"Vital capacity below 15 mL/kg is a listed red flag.",C:"The red flag is the inability to cough, not an effective cough.",D:"Voice changes are a listed red flag.",E:"Use of accessory muscles is a listed red flag.",F:"Leg weakness first is the usual GBS pattern, not a respiratory red flag."},takeaway:"Detect respiratory collapse early and prepare for intubation.",bookPage:"149",bookChapter:"Neurologic System",bookSection:"Guillain-Barr\xE9 syndrome"},{id:"msk-fractures-q7",topic:"Musculoskeletal",clientNeed:"Basic Care and Comfort",format:"Select all that apply",question:"A client with a closed forearm fracture is in the acute phase and waiting for definitive treatment. Which nursing measures should the nurse include? Select all that apply.",options:[{key:"A",text:"Immobilize the arm with a splint"},{key:"B",text:"Have the client move the arm to test function"},{key:"C",text:"Elevate the injured arm"},{key:"D",text:"Check neurovascular status every 1 to 2 hours"},{key:"E",text:"Check neurovascular status once per shift"},{key:"F",text:"Keep the arm hanging down at the client's side"}],answer:["A","C","D"],rationales:{A:"The book says to immobilize with splints.",B:"Moving the injured arm can worsen the injury; the book says to immobilize it.",C:"The book says to elevate the limb.",D:"The book says to monitor NV status every 1 to 2 hours in the acute phase.",E:"Once a shift is less often than the book's every 1 to 2 hours in the acute phase.",F:"Letting the arm hang down is the opposite of the book's instruction to elevate the limb."},takeaway:"Immobilize, elevate and monitor neurovascular status every 1 to 2 hours in the acute phase.",bookPage:"181",bookChapter:"Musculoskeletal System",bookSection:"Fractures and compartment syndrome"},{id:"nclex-strategy-q20",topic:"Leadership & Delegation",clientNeed:"Health Promotion and Maintenance",format:"Select all that apply",question:"A nurse plans to begin discharge teaching for a client this afternoon. On arrival, the nurse reassesses the client. Which findings mean the nurse should delay the teaching? Select all that apply.",options:[{key:"A",text:"The client is in severe respiratory distress"},{key:"B",text:"The client is alert and asking questions about home care"},{key:"C",text:"The client's vital signs are worsening and the client is newly confused"},{key:"D",text:"The client has a family member at the bedside who wants to learn too"},{key:"E",text:"The client has finished lunch and is sitting up in a chair"}],answer:["A","C"],rationales:{A:"Teaching is ineffective if the client is unstable; severe respiratory distress needs action first.",B:"An alert client asking questions shows readiness to learn.",C:"Worsening vital signs and new confusion are signs of instability, and teaching is ineffective if the client is unstable.",D:"A family member who wants to learn does not prevent teaching.",E:"Sitting up after a meal does not suggest instability."},takeaway:"Teaching is ineffective if the client is unstable.",bookPage:"11",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy"},{id:"endo-pheo-q9",topic:"Endocrine",clientNeed:"Safety and Infection Prevention and Control",format:"Select all that apply",question:"A nurse is teaching a client with pheochromocytoma about factors that can trigger a hypertensive episode. Which factors should the nurse include? Select all that apply.",options:[{key:"A",text:"Resting in a quiet room"},{key:"B",text:"Strenuous exercise"},{key:"C",text:"A full, distended bladder"},{key:"D",text:"Eating a high-salt meal"},{key:"E",text:"Deep palpation of the abdomen"},{key:"F",text:"Certain medications"}],answer:["B","C","E","F"],rationales:{A:"The book recommends rest and stress reduction; rest is not a trigger.",B:"The book lists exercise as a trigger.",C:"The book lists bladder distention as a trigger.",D:"The book lists a high-salt diet as preoperative care, not as a trigger.",E:"The book warns that deep palpation risks a hypertensive crisis.",F:"The book lists certain medications as triggers."},tak
