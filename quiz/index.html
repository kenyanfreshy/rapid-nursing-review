eaway:"Teach the client to avoid triggers of hypertensive crisis.",bookPage:"101",bookChapter:"Endocrine System",bookSection:"Pheochromocytoma"},{id:"fluids-main-q12",topic:"Fluids & Electrolytes",clientNeed:"Physiological Adaptation",format:"Select all that apply",question:"A client's adrenal cortex is producing excess aldosterone. Which effects should the nurse anticipate? Select all that apply.",options:[{key:"A",text:"Increased sodium reabsorption"},{key:"B",text:"Increased water reabsorption"},{key:"C",text:"Increased potassium excretion"},{key:"D",text:"Potassium retention"},{key:"E",text:"Release of the hormone from the posterior pituitary"}],answer:["A","B","C"],rationales:{A:"The book states aldosterone promotes sodium reabsorption.",B:"The book states aldosterone promotes water reabsorption along with sodium.",C:"The book states aldosterone promotes potassium excretion.",D:"The book says aldosterone promotes potassium excretion, not retention.",E:"The book says aldosterone comes from the adrenal cortex; ADH is released by the posterior pituitary."},takeaway:"Predicting fluid and electrolyte effects of aldosterone.",bookPage:"184",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet"},{id:"gu-uti-q8",topic:"Renal & Genitourinary",clientNeed:"Health Promotion and Maintenance",format:"Select all that apply",question:"The nurse reviews health histories at a women's clinic. Which factors does the book list as raising the risk of a urinary tract infection? Select all that apply.",options:[{key:"A",text:"Recent urinary catheterization"},{key:"B",text:"Drinking plenty of fluids each day"},{key:"C",text:"Use of a diaphragm with spermicide"},{key:"D",text:"Dehydration"},{key:"E",text:"Wiping from front to back"},{key:"F",text:"Recent pregnancy and childbirth"}],answer:["A","C","D","F"],rationales:{A:"The book lists recent catheterization as a UTI risk factor.",B:"Wrong. The book recommends increasing fluids as UTI care.",C:"The book lists diaphragm and spermicide use as a risk factor.",D:"The book lists dehydration as a risk factor.",E:"Wrong. Wiping front to back is a hygiene habit the book promotes.",F:"The book lists pregnancy and childbirth as a risk factor."},takeaway:"Identifying UTI risk factors for prevention.",bookPage:"120",bookChapter:"Genitourinary System",bookSection:"Urinary tract infection (UTI)"},{id:"gi-gallbladder-q14",topic:"Gastrointestinal",clientNeed:"Basic Care and Comfort",format:"Select all that apply",question:"A client with acute cholecystitis is having episodes of severe pain. Which nursing actions are appropriate? Select all that apply.",options:[{key:"A",text:"Stay with the client during pain episodes"},{key:"B",text:"Keep the bed flat"},{key:"C",text:"Elevate the head of the bed"},{key:"D",text:"Offer a milkshake for comfort"},{key:"E",text:"Monitor and re-evaluate the pain"}],answer:["A","C","E"],rationales:{A:"The book says to stay with the client during pain episodes.",B:"The book advises elevating the head of the bed, not keeping it flat.",C:"Elevating the head of the bed reduces pressure on the diaphragm.",D:"Fatty and dairy foods are to be avoided.",E:"The book says to monitor and evaluate pain."},takeaway:"Provide comfort measures during biliary pain.",bookPage:"82",bookChapter:"Gastrointestinal System",bookSection:"Cholecystitis and cholelithiasis"},{id:"nclex-priorities-q11",topic:"Fundamentals & Safety",clientNeed:"Management of Care",format:"Select all that apply",question:"A nurse is planning care for a client admitted with chest pain who is also anxious. Which priority decisions follow ABCs and Maslow's hierarchy? Select all that apply.",options:[{key:"A",text:"Address the low oxygen saturation before the client's anxiety"},{key:"B",text:"Treat an abnormal lab value before a partial airway obstruction"},{key:"C",text:"Manage an airway problem before a breathing problem"},{key:"D",text:"Address the client's psychosocial needs before physiological needs"},{key:"E",text:"Treat hypotension before hypoxia when no hemorrhage is present"},{key:"F",text:"Address breathing problems before circulation issues"}],answer:["A","C","F"],rationales:{A:"The book states a client with chest pain and low oxygen saturation takes priority over pain or anxiety.",B:"The book says to treat airway obstruction before an abnormal lab value.",C:"Airway problems come first, then breathing.",D:"Maslow's hierarchy places physiological needs before psychosocial needs.",E:"The book treats hypoxia before hypotension unless hemorrhage is present.",F:"Breathing problems come before circulation issues in the ABCs."},takeaway:"Prioritize airway, breathing, circulation, then psychosocial needs.",bookPage:"5",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment"},{id:"integ-pressure-q8",topic:"Integumentary",clientNeed:"Reduction of Risk Potential",format:"Select all that apply",question:"A nurse reviews the admission data for an older adult client. Which findings increase the client's risk for developing a pressure injury? Select all that apply.",options:[{key:"A",text:"Weight loss and poor appetite indicating malnutrition"},{key:"B",text:"Dry mucous membranes and low fluid intake indicating dehydration"},{key:"C",text:"Walks independently several times a day"},{key:"D",text:"Urinary and fecal incontinence"},{key:"E",text:"Eats protein-rich meals at every visit"},{key:"F",text:"Unable to change position in bed without help"}],answer:["A","B","D","F"],rationales:{A:"Malnutrition is a listed risk factor.",B:"Dehydration is a listed risk factor.",C:"Walking independently means the client is mobile, which lowers risk.",D:"Incontinence is a listed risk factor.",E:"Protein-rich nutrition is a protective measure in the book, not a risk factor.",F:"Immobility is a listed risk factor."},takeaway:"Recognize pressure injury risk factors so prevention can start early.",bookPage:"178",bookChapter:"Integumentary System",bookSection:"Pressure injuries"},{id:"heme-dic-q11",topic:"Hematology & Oncology",clientNeed:"Physiological Adaptation",format:"Select all that apply",question:"A client who is 34 weeks pregnant develops DIC after an abruptio placentae. Which actions should the nurse anticipate? Select all that apply.",options:[{key:"A",text:"Insert a pulmonary artery catheter before the coagulopathy is corrected"},{key:"B",text:"Monitor the fetus"},{key:"C",text:"Encourage ambulation to improve circulation"},{key:"D",text:"Give oxygen"},{key:"E",text:"Prepare for a possible cesarean section"}],answer:["B","D","E"],rationales:{A:"The book states a pulmonary artery catheter is inserted only after correcting coagulopathy.",B:"The book's guidance for DIC in pregnancy includes monitoring the fetus.",C:"The book calls for bedrest in DIC.",D:"The book's guidance for DIC in pregnancy includes giving oxygen.",E:"The book's guidance for DIC in pregnancy includes preparing for a possible C-section."},takeaway:"Anticipating maternal and fetal care in obstetric DIC.",bookPage:"164",bookChapter:"Hematology / Immunology",bookSection:"Disseminated intravascular coagulation (DIC)"},{id:"resp-asthma-q9",topic:"Respiratory",clientNeed:"Management of Care",format:"Select all that apply",question:"A client with status asthmaticus is on mechanical ventilation when the ventilator alarm sounds. Which actions by the nurse are appropriate? Select all that apply.",options:[{key:"A",text:"Look at the client before checking the ventilator"},{key:"B",text:"Silence the alarm and review the ventilator settings first"},{key:"C",text:"Confirm a manual resuscitation (Ambu) bag is at the bedside"},{key:"D",text:"Confirm suction equipment is available at the bedside"},{key:"E",text:"Leave to find the respiratory therapist before assessing"}],answer:["A","C","D"],rationales:{A:"The book says to always look over the patient before checking the ventilator.",B:"The book says the client is assessed before the ventilator.",C:"The book says an Ambu bag should always be at the bedside.",D:"The book says suction should always be available at the bedside.",E:"The nurse must assess the client first rather than leave the bedside."},takeaway:"Assess the client before the equipment.",bookPage:"30",bookChapter:"Respiratory System",bookSection:"Asthma and status asthmaticus"},{id:"heme-anaphylaxis-q5",topic:"Immunology & Infectious Disease",clientNeed:"Physiological Adaptation",format:"Select all that apply",question:"A client who ate peanuts 10 minutes ago is being assessed for anaphylaxis. Which findings should the nurse recognize as systemic symptoms of anaphylaxis? Select all that apply.",options:[{key:"A",text:"Hives and flushing"},{key:"B",text:"Swelling of the lips and face"},{key:"C",text:"Hoarseness and stridor"},{key:"D",text:"Tachycardia and dizziness"},{key:"E",text:"Bradycardia with high blood pressure"}],answer:["A","B","C","D"],rationales:{A:"The book lists urticaria (hives) and flushing as skin symptoms.",B:"Angioedema (swelling) is a listed skin symptom.",C:"Hoarseness and stridor are listed respiratory symptoms.",D:"The book lists tachycardia, dizziness, and syncope as cardiovascular symptoms.",E:"The book lists tachycardia and hypotension in anaphylaxis, not bradycardia with high blood pressure."},takeaway:"Recognizing multisystem signs of anaphylaxis.",bookPage:"170",bookChapter:"Hematology / Immunology",bookSection:"Immunity and anaphylaxis"},{id:"cardio-hf-q9",topic:"Cardiovascular",clientNeed:"Basic Care and Comfort",format:"Select all that apply",question:"A client with right-sided heart failure is following a prescribed sodium restriction. Which lunch choices show the client understands the diet? Select all that apply.",options:[{key:"A",text:"Fresh grilled chicken with steamed vegetables"},{key:"B",text:"Canned chicken noodle soup with saltine crackers"},{key:"C",text:"Fresh fruit salad"},{key:"D",text:"Deli ham sandwich with pickles"},{key:"E",text:"Baked potato with unsalted margarine"},{key:"F",text:"Frozen pepperoni pizza"}],answer:["A","C","E"],rationales:{A:"Fresh, unprocessed meat and vegetables are low in sodium.",B:"Canned soup and salted crackers are high in sodium.",C:"Fresh fruit is naturally low in sodium.",D:"Deli meats and pickles are high in sodium.",E:"A plain baked potato with unsalted margarine is a low-sodium choice.",F:"Frozen pizza and cured meats are high in sodium."},takeaway:"Evaluate the client's food choices against the sodium restriction.",bookPage:"51",bookChapter:"Cardiovascular System",bookSection:"Heart failure"},{id:"nclex-highrisk-q5",topic:"Multisystem & Shock",clientNeed:"Reduction of Risk Potential",format:"Select all that apply",question:"A nurse reviews the morning results for several clients. Which results are critical findings that require action? Select all that apply.",options:[{key:"A",text:"Potassium outside the normal range on a client with weakness"},{key:"B",text:"A stable hemoglobin that matches the previous three days"},{key:"C",text:"Rising creatinine in a client whose urine output is low"},{key:"D",text:"An elevated lactate in a client being treated for sepsis"},{key:"E",text:"A normal creatinine in a client with adequate urine output"}],answer:["A","C","D"],rationales:{A:"Potassium abnormalities are listed as critical labs that require action.",B:"A stable trend does not suggest bleeding; the book flags a falling hemoglobin.",C:"Elevated creatinine with low urine output is listed as a critical lab requiring action.",D:"Elevated lactate in sepsis is listed as a critical lab requiring action.",E:"A normal creatinine with adequate urine output is not a listed critical finding."},takeaway:"Interpret labs in context and act on critical results.",bookPage:"8",bookChapter:"NCLEX Must-Know Content",bookSection:"High-risk conditions, labs & medication safety"},{id:"neuro-meningitis-q7",topic:"Neurological",clientNeed:"Physiological Adaptation",format:"Select all that apply",question:"The nurse is assessing a client admitted with suspected acute meningitis. Which findings support this diagnosis? Select all that apply.",options:[{key:"A",text:"Nuchal rigidity"},{key:"B",text:"Fever with severe headache"},{key:"C",text:"Pain in the back of the thigh when the knee is extended with the hip flexed"},{key:"D",text:"Clear cerebrospinal fluid with normal glucose and protein"},{key:"E",text:"Photophobia"}],answer:["A","B","C","E"],rationales:{A:"Nuchal rigidity is a classic sign of meningitis.",B:"Headache and fever are classic signs of meningitis.",C:"This describes a positive Kernig sign.",D:"Clear CSF with normal glucose and protein is the normal finding on p.136; meningitis causes cloudy CSF, low glucose and high protein.",E:"Photophobia is listed among acute meningitis symptoms."},takeaway:"Recognize classic signs and a positive Kernig test in meningitis.",bookPage:"136",bookChapter:"Neurologic System",bookSection:"Meningitis"},{id:"msk-bone-q2",topic:"Musculoskeletal",clientNeed:"Health Promotion and Maintenance",format:"Select all that apply",question:"A client with gout asks what can bring on another attack. Which items should the nurse identify as triggers? Select all that apply.",options:[{key:"A",text:"Drinking plenty of fluids"},{key:"B",text:"Alcohol"},{key:"C",text:"Following a low-purine diet"},{key:"D",text:"Shellfish"},{key:"E",text:"Red meat"},{key:"F",text:"Thiazide diuretics"}],answer:["B","D","E","F"],rationales:{A:"The book lists fluids as part of chronic gout management, not as a trigger.",B:"Alcohol is listed as a gout trigger.",C:"A low-purine diet is part of chronic gout management in the book.",D:"Shellfish is listed as a gout trigger.",E:"Red meat is listed as a gout trigger.",F:"Thiazides are listed as a gout trigger."},takeaway:"Teaching to prevent gout flares by avoiding triggers.",bookPage:"182",bookChapter:"Musculoskeletal System",bookSection:"Osteoporosis, osteoarthritis and gout"},{id:"nclex-strategy-q18",topic:"Leadership & Delegation",clientNeed:"Management of Care",format:"Select all that apply",question:"A nurse is caring for an alert, competent client who is scheduled for a procedure later today. Which actions reflect the nurse's ethical and legal responsibilities? Select all that apply.",options:[{key:"A",text:"Make sure the client understands the procedure before witnessing the consent signature"},{key:"B",text:"Ask a family member to sign the consent because it is faster"},{key:"C",text:"Document care accurately and only after it has been done"},{key:"D",text:"Share the client's diagnosis with the roommate who asks about it"},{key:"E",text:"Respect the client's own choices about care after confirming understanding"},{key:"F",text:"Chart the pre-procedure medication before giving it to save time"}],answer:["A","C","E"],rationales:{A:"Informed consent is a key concept, and the client must understand what is being agreed to.",B:"An alert, competent client makes the decision; having family sign ignores patient autonomy.",C:"Documentation accuracy is a key concept.",D:"This breaks confidentiality.",E:"Patient autonomy is a key concept, and the book says to assess understanding.",F:"Charting a medication before it is given makes the record inaccurate."},takeaway:"Protect consent, autonomy, confidentiality and accurate documentation.",bookPage:"11",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy"},{id:"endo-hypothyroid-q10",topic:"Endocrine",clientNeed:"Basic Care and Comfort",format:"Select all that apply",question:"A client with hypothyroidism has gained weight and reports constipation. Which dietary recommendations should the nurse include? Select all that apply.",options:[{key:"A",text:"Choose high-fiber foods"},{key:"B",text:"Follow a high-calorie diet to boost energy"},{key:"C",text:"Choose a low-calorie diet"},{key:"D",text:"Include high-protein foods"},{key:"E",text:"Limit fiber to reduce abdominal distention"},{key:"F",text:"Expect calorie needs to be adjusted as metabolism improves"}],answer:["A","C","D","F"],rationales:{A:"The book recommends a high-fiber diet.",B:"The book recommends a low-calorie diet for hypothyroidism.",C:"The book recommends a low-calorie diet.",D:"The book recommends a high-protein diet.",E:"The book recommends high fiber, which also helps constipation.",F:"The book states calories should be adjusted as metabolism improves."},takeaway:"Plan a low-calorie, high-protein, high-fiber diet.",bookPage:"95",bookChapter:"Endocrine System",bookSection:"Hypothyroidism"},{id:"fluids-main-q22",topic:"Fluids & Electrolytes",clientNeed:"Pharmacological and Parenteral Therapies",format:"Select all that apply",question:"A client's bicarbonate is 13 mEq/L, and the arterial pH is 7.05. Which actions should the nurse anticipate based on the book? Select all that apply.",options:[{key:"A",text:"Prepare to give sodium bicarbonate"},{key:"B",text:"Monitor the client's ventilation"},{key:"C",text:"Watch the ECG for peaked T waves related to hyperkalemia"},{key:"D",text:"Give magnesium sulfate IV"},{key:"E",text:"Start a 3% sodium chloride infusion"},{key:"F",text:"Expect flat T waves from alkalosis"}],answer:["A","B","C"],rationales:{A:"The book lists sodium bicarbonate tabs or drip for low bicarbonate when the pH is below 7.1.",B:"The book says to monitor ventilation for bicarbonate imbalance.",C:"The book links acidosis to peaked T waves secondary to hyperkalemia.",D:"Magnesium sulfate IV is the book's treatment for low magnesium.",E:"3% sodium chloride is the book's treatment for hyponatremia.",F:"Flat T waves are linked to alkalosis, not acidosis."},takeaway:"Manage severe acidosis with bicarbonate replacement, ventilation monitoring and ECG watch for hyperkalemia.",bookPage:"185",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet"},{id:"gu-uti-q13",topic:"Renal & Genitourinary",clientNeed:"Physiological Adaptation",format:"Select all that apply",question:"A client is admitted with suspected acute pyelonephritis. Which assessment findings does the nurse expect? Select all that apply.",options:[{key:"A",text:"Painless, clear urine"},{key:"B",text:"Costovertebral tenderness"},{key:"C",text:"Weak stream with dribbling at the end of voiding"},{key:"D",text:"Foul-smelling or bloody urine"},{key:"E",text:"Leakage of urine when laughing"},{key:"F",text:"Fever with nausea and vomiting"}],answer:["B","D","F"],rationales:{A:"Wrong. The book lists foul or bloody urine and dysuria with pyelonephritis.",B:"The book lists costovertebral tenderness as an exam finding.",C:"Wrong. Weak stream and dribbling are BPH symptoms.",D:"The book lists foul or bloody urine as a symptom.",E:"Wrong. Leakage with laughing describes stress incontinence.",F:"The book lists fever, nausea and vomiting as pyelonephritis symptoms."},takeaway:"Recognizing the expected findings of kidney infection.",bookPage:"121",bookChapter:"Genitourinary System",bookSection:"Urinary tract infection (UTI)"},{id:"gi-cirrhosis-q10",topic:"Gastrointestinal",clientNeed:"Health Promotion and Maintenance",format:"Select all that apply",question:"During a health history, which factors should the nurse recognize as causes of cirrhosis? Select all that apply.",options:[{key:"A",text:"Hepatitis C infection"},{key:"B",text:"Long-term alcohol abuse"},{key:"C",text:"Regular aerobic exercise"},{key:"D",text:"Chemical toxin exposure"},{key:"E",text:"A high-fiber diet"},{key:"F",text:"Hepatitis B infection"}],answer:["A","B","D","F"],rationales:{A:"Hepatitis C is a common cause.",B:"Alcohol abuse is a common cause.",C:"Exercise is not listed as a cause.",D:"Chemical toxin exposure is listed among other causes.",E:"A high-fiber diet is not listed as a cause.",F:"Hepatitis B is listed among the other causes of cirrhosis."},takeaway:"Identify risk factors for cirrhosis.",bookPage:"79",bookChapter:"Gastrointestinal System",bookSection:"Cirrhosis"},{id:"nclex-priorities-q10",topic:"Fundamentals & Safety",clientNeed:"Reduction of Risk Potential",format:"Select all that apply",question:"A nurse reviews the past four hours of data for a postoperative client. Which findings are early signs of decline that the nurse should act on? Select all that apply.",options:[{key:"A",text:"Respiratory rate increasing from 16 to 26"},{key:"B",text:"Oxygen saturation decreasing from 97% to 91%"},{key:"C",text:"Steady vital signs within the client's baseline"},{key:"D",text:"New confusion in a client who was oriented this morning"},{key:"E",text:"Urine output decreasing over the last several hours"},{key:"F",text:"Client reports sleeping well and asks for breakfast"}],answer:["A","B","D","E"],rationales:{A:"Increasing respiratory rate is a listed early sign of decline.",B:"Decreasing oxygen saturation is a listed early sign of decline.",C:"The book points to worsening vital sign trends; stable values at baseline are not a sign of decline.",D:"New confusion or agitation is a listed early sign of decline.",E:"Decreased urine output is a listed early sign of decline.",F:"Restful sleep and appetite are not among the signs of decline."},takeaway:"Recognize early deterioration so care can be escalated.",bookPage:"6",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment"},{id:"integ-skin-q4",topic:"Integumentary",clientNeed:"Safety and Infection Prevention and Control",format:"Select all that apply",question:"A client is being discharged with a healing surgical wound and a prescription for an oral antibiotic. Which instructions should the nurse include? Select all that apply.",options:[{key:"A",text:"Keep the wound clean and dry"},{key:"B",text:"Stop the antibiotic once the wound looks better"},{key:"C",text:"Report signs of infection, such as increasing redness or drainage"},{key:"D",text:"Learn the side effects and dosing schedule of the antibiotic"},{key:"E",text:"Cover the wound with a damp cloth to keep it moist"},{key:"F",text:"Apply a topical corticosteroid if the wound becomes red"}],answer:["A","C","D"],rationales:{A:"The book teaches to keep wounds clean and dry.",B:"Stopping early goes against the book's teaching on medication adherence.",C:"The book teaches clients to report signs of infection.",D:"The book's medication adherence teaching includes understanding side effects and dosage schedules.",E:"A damp cloth is not a clean wound dressing and holds moisture against the skin around the wound; the book teaches keeping wounds clean and dry and reporting signs of infection, and any dressing should follow the prescribed wound care.",F:"The book lists topical corticosteroids for eczema and psoriasis, not for wound redness, which should be reported."},takeaway:"Prevent and detect wound infection through hygiene, reporting and medication adherence.",bookPage:"179",bookChapter:"Integumentary System",bookSection:"Skin infections, skin cancer and wound care"},{id:"heme-transfusion-q12",topic:"Hematology & Oncology",clientNeed:"Management of Care",format:"Select all that apply",question:"The nurse asks assistive personnel (AP) to take vital signs for a client receiving a blood transfusion. Which findings should the nurse tell the AP to report immediately? Select all that apply.",options:[{key:"A",text:"The client asks for a snack"},{key:"B",text:"Chills or a new fever"},{key:"C",text:"Itching or new hives"},{key:"D",text:"The client wants to watch television"},{key:"E",text:"Shortness of breath"},{key:"F",text:"Back or chest pain"}],answer:["B","C","E","F"],rationales:{A:"A snack request is not a sign of a reaction.",B:"The book lists fever and chills as reaction findings to monitor.",C:"The book lists itching and hives as reaction findings.",D:"This is not a sign of a reaction.",E:"The book lists dyspnea as a reaction finding.",F:"The book lists chest or back pain as a reaction finding."},takeaway:"Giving the AP clear reporting criteria for transfusion reactions.",bookPage:"165",bookChapter:"Hematology / Immunology",bookSection:"Blood transfusion reaction"},{id:"resp-emphysema-q14",topic:"Respiratory",clientNeed:"Safety and Infection Prevention and Control",format:"Select all that apply",question:"A client with severe emphysema is being discharged. Which actions should the nurse include to prevent infection? Select all that apply.",options:[{key:"A",text:"Screen visitors for illness"},{key:"B",text:"Invite a grandchild who has a cold to visit"},{key:"C",text:"Avoid crowds"},{key:"D",text:"Wait until sputum turns green before calling about an infection"},{key:"E",text:"Get infections treated promptly"}],answer:["A","C","E"],rationales:{A:"Screening visitors is listed under infection prevention.",B:"Exposure to a person with a respiratory infection increases risk.",C:"Avoiding crowds is listed under infection prevention.",D:"The book calls for prompt treatment of infections to reduce bronchospasm and secretions.",E:"Treating infections promptly is a listed collaborative intervention."},takeaway:"Protect the client with emphysema from respiratory infection.",bookPage:"33",bookChapter:"Respiratory System",bookSection:"Emphysema"},{id:"heme-lupus-q7",topic:"Immunology & Infectious Disease",clientNeed:"Health Promotion and Maintenance",format:"Select all that apply",question:"The nurse reviews the medication history of a client with new joint pain and a facial rash. Which medications are risk factors for lupus? Select all that apply.",options:[{key:"A",text:"Hydroxychloroquine"},{key:"B",text:"Hydralazine"},{key:"C",text:"Procainamide"},{key:"D",text:"Belimumab"},{key:"E",text:"Phenytoin"}],answer:["B","C","E"],rationales:{A:"Hydroxychloroquine is a lupus treatment.",B:"The book lists hydralazine among medications that are risk factors.",C:"The book lists procainamide among medications that are risk factors.",D:"Belimumab is listed as a lupus treatment.",E:"The book lists phenytoin among medications that are risk factors."},takeaway:"Recognizing medications linked to lupus.",bookPage:"172",bookChapter:"Hematology / Immunology",bookSection:"Lupus erythematosus"},{id:"cardio-tamponade-q6",topic:"Cardiovascular",clientNeed:"Reduction of Risk Potential",format:"Select all that apply",question:"The nurse is reviewing the histories of several clients. Which conditions place a client at risk for cardiac tamponade? Select all that apply.",options:[{key:"A",text:"Kidney failure with uremia"},{key:"B",text:"Heart rupture after a recent MI"},{key:"C",text:"Iron-deficiency anemia"},{key:"D",text:"Systemic lupus erythematosus"},{key:"E",text:"Seasonal allergic rhinitis"},{key:"F",text:"Blunt chest trauma from a car crash"}],answer:["A","B","D","F"],rationales:{A:"The book lists kidney failure (uremia) as a cause of tamponade.",B:"Heart rupture after MI or surgery is listed as a cause.",C:"Anemia is not among the causes the book lists.",D:"Autoimmune diseases such as SLE and RA are listed causes.",E:"Allergic rhinitis is not a listed cause.",F:"Blunt or penetrating trauma is a listed cause."},takeaway:"Identify clients at risk so tamponade is recognized early.",bookPage:"45",bookChapter:"Cardiovascular System",bookSection:"Cardiac tamponade"},{id:"nclex-highrisk-q4",topic:"Multisystem & Shock",clientNeed:"Physiological Adaptation",format:"Select all that apply",question:"A nurse is reviewing the admitting diagnoses of clients on a busy unit. Which conditions does the nurse recognize as life-threatening high-risk conditions requiring close monitoring? Select all that apply.",options:[{key:"A",text:"Acute respiratory distress syndrome (ARDS)"},{key:"B",text:"Uncomplicated ankle sprain"},{key:"C",text:"Cardiac tamponade"},{key:"D",text:"Increased intracranial pressure"},{key:"E",text:"Seasonal allergic rhinitis"},{key:"F",text:"Septic shock"}],answer:["A","C","D","F"],rationales:{A:"ARDS is listed among the life-threatening respiratory conditions.",B:"An uncomplicated sprain is not a life-threatening condition and is not on the list.",C:"Cardiac tamponade is listed among the life-threatening cardiovascular conditions.",D:"Increased intracranial pressure is listed among the life-threatening neurological conditions.",E:"Seasonal allergies are not life-threatening and are not on the list.",F:"Sepsis and septic shock are listed under infection."},takeaway:"Know which conditions are high risk so early signs are monitored.",bookPage:"7",bookChapter:"NCLEX Must-Know Content",bookSection:"High-risk conditions, labs & medication safety"},{id:"neuro-stroke-q10",topic:"Neurological",clientNeed:"Pharmacological and Parenteral Therapies",format:"Select all that apply",question:"The nurse reviews medications used in stroke care. Which drug and purpose pairs are correct? Select all that apply.",options:[{key:"A",text:"Stool softener: dissolve the clot in a vessel"},{key:"B",text:"Alteplase (rt-PA): dissolve the clot in an ischemic stroke"},{key:"C",text:"Clopidogrel: break up an existing clot within 3 hours"},{key:"D",text:"Aspirin: help prevent new clots"},{key:"E",text:"Warfarin: shrink a hemorrhagic hematoma"},{key:"F",text:"Apixaban: help prevent clots"}],answer:["B","D","F"],rationales:{A:"Stool softeners are listed as supportive care, not as clot-dissolving drugs.",B:"The book lists rt-PA (alteplase) for clot busting in ischemic stroke.",C:"Clopidogrel is an antiplatelet used for clot prevention; rt-PA is the clot-busting drug.",D:"Aspirin is listed among the antiplatelets used for clot prevention.",E:"Warfarin is an anticoagulant for clot prevention; a hematoma is removed surgically per the book.",F:"Apixaban is listed as an anticoagulant for clot prevention."},takeaway:"Match stroke medications to their intended action.",bookPage:"132",bookChapter:"Neurologic System",bookSection:"Stroke and TIA"},{id:"msk-spinal-q2",topic:"Musculoskeletal",clientNeed:"Safety and Infection Prevention and Control",format:"Select all that apply",question:"A client is treated for an ankle sprain. Which instructions are consistent with the book's treatment? Select all that apply.",options:[{key:"A",text:"Apply ice for no more than 20 minutes at a time"},{key:"B",text:"Keep ice on the ankle continuously for an hour"},{key:"C",text:"Elevate the ankle"},{key:"D",text:"Use heat instead of ice at first"},{key:"E",text:"Wrap the ankle with a compression bandage"},{key:"F",text:"Keep walking on it to prevent stiffness"}],answer:["A","C","E"],rationales:{A:"The book's RICE treatment limits ice to 20 minutes maximum.",B:"An hour exceeds the book's 20-minute maximum for ice.",C:"Elevation is part of RICE.",D:"The book lists ice, not heat, in RICE.",E:"Compression is part of RICE.",F:"The book lists rest and immobilization, not continued activity."},takeaway:"Safe RICE treatment, including the 20-minute limit on ice.",bookPage:"183",bookChapter:"Musculoskeletal System",bookSection:"Spinal disorders, sprains and strains"},{id:"nclex-strategy-q15",topic:"Leadership & Delegation",clientNeed:"Management of Care",format:"Matrix (NGN)",question:"An RN is reviewing tasks for the shift. For each task, indicate whether the RN may delegate it or must keep it.",options:[{key:"1",text:"Helping a stable client with morning hygiene"},{key:"2",text:"Deciding whether a client's new symptom needs a call to the provider"},{key:"3",text:"Performing wound care for a stable client"},{key:"4",text:"Evaluating whether discharge teaching was effective"},{key:"5",text:"Taking vital signs on a stable client and reporting them"}],answer:["May delegate","RN must keep","May delegate","RN must keep","May delegate"],rationales:{1:"UAP can assist with hygiene.",2:"This is clinical judgment, which is never delegated.",3:"LPNs can perform wound care.",4:"Evaluating outcomes is an RN responsibility.",5:"UAP can take vital signs on stable clients and report findings."},takeaway:"Delegate based on stability and task complexity; keep assessment, teaching, evaluation and judgment.",bookPage:"10",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy",columns:["May delegate","RN must keep"]},{id:"fluids-main-q4",topic:"Fluids & Electrolytes",clientNeed:"Reduction of Risk Potential",format:"Matrix (NGN)",question:"A nurse is reviewing ECG findings for several clients with electrolyte imbalances. For each ECG finding, indicate which electrolyte imbalance the book links it to.",options:[{key:"1",text:"U wave with flat or inverted T waves"},{key:"2",text:"Tall peaked T waves with a wide QRS"},{key:"3",text:"Shortened QT interval"},{key:"4",text:"Torsades de pointes"}],answer:["Potassium imbalance","Potassium imbalance","Calcium imbalance","Magnesium imbalance"],rationales:{1:"The book lists ST depression, flat or inverted T waves and a U wave under hypokalemia.",2:"The book lists tall peaked T waves, wide QRS and PR prolongation under hyperkalemia.",3:"The book lists a shortened QT under hypercalcemia.",4:"The book lists torsades de pointes and a prolonged QT under hypomagnesemia."},takeaway:"Linking ECG changes to the electrolyte imbalance that causes them.",bookPage:"185",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet",columns:["Potassium imbalance","Calcium imbalance","Magnesium imbalance"]},{id:"neuro-icp-q5",topic:"Neurological",clientNeed:"Basic Care and Comfort",format:"Matrix (NGN)",question:"A client with a traumatic brain injury has increased intracranial pressure. For each nursing action, indicate whether it is indicated or contraindicated.",options:[{key:"1",text:"Raise the head of the bed to 30 degrees"},{key:"2",text:"Keep the head midline in a neutral position"},{key:"3",text:"Place a pillow under the knees to flex the hips"},{key:"4",text:"Limit each suctioning pass to 10-15 seconds or less"},{key:"5",text:"Lay the bed flat to improve blood flow to the brain"}],answer:["Indicated","Indicated","Contraindicated","Indicated","Contraindicated"],rationales:{1:"Indicated. The book says to elevate the HOB 30 degrees.",2:"Indicated. The book says to keep the head midline and neutral.",3:"Contraindicated. The book says to avoid hip flexion because it can raise ICP.",4:"Indicated. The book limits suctioning to 10-15 seconds or less.",5:"Contraindicated. The book specifies HOB 30 degrees, not flat."},takeaway:"Position and care for the client in ways that avoid further rises in ICP.",bookPage:"133",bookChapter:"Neurologic System",bookSection:"Increased intracranial pressure",columns:["Indicated","Contraindicated"]},{id:"nclex-priorities-q12",topic:"Fundamentals & Safety",clientNeed:"Safety and Infection Prevention and Control",format:"Matrix (NGN)",question:"A nurse has several tasks for a client at risk for falls and aspiration. For each action, indicate whether it is a higher or lower priority according to the safety principle.",options:[{key:"1",text:"Responding to the bed alarm as the client tries to stand alone"},{key:"2",text:"Charting the morning intake and output"},{key:"3",text:"Stopping the meal when the client coughs and chokes while eating"},{key:"4",text:"Reviewing the diet handout the client will need at discharge"}],answer:["Higher priority","Lower priority","Higher priority","Lower priority"],rationales:{1:"Preventing a fall prevents harm, which the book ranks above comfort, education or documentation.",2:"Documentation ranks below actions that prevent harm.",3:"Preventing aspiration is a listed key safety principle and prevents harm.",4:"Education ranks below actions that prevent harm."},takeaway:"Choose the action that prevents harm over comfort, education or documentation.",bookPage:"4",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment",columns:["Higher priority","Lower priority"]},{id:"msk-spinal-q6",topic:"Musculoskeletal",clientNeed:"Management of Care",format:"Matrix (NGN)",question:"A nurse is precepting a new graduate who is caring for a client with suspected compartment syndrome of the lower leg. For each action by the new graduate, indicate whether it is appropriate or inappropriate.",options:[{key:"1",text:"Raises the leg on two pillows to reduce swelling"},{key:"2",text:"Applies an ice pack to the calf"},{key:"3",text:"Notifies the provider immediately"},{key:"4",text:"Assesses the leg for pain, pallor, paresthesia and pulses"},{key:"5",text:"Prepares the client for a possible fasciotomy"}],answer:["Inappropriate","Inappropriate","Appropriate","Appropriate","Appropriate"],rationales:{1:"Inappropriate. The book's compartment syndrome graphic says not to elevate the limb, even though routine fracture care includes elevation.",2:"Inappropriate. The book says not to apply cold.",3:"Appropriate. The book calls it a medical emergency, so the provider must be told right away.",4:"Appropriate. Assessing the 6 P's tracks the book's signs of compartment syndrome.",5:"Appropriate. The book lists immediate fasciotomy as the treatment."},takeaway:"Supervise care so suspected compartment syndrome gets prompt escalation and no elevation or cold.",bookPage:"183",bookChapter:"Musculoskeletal System",bookSection:"Spinal disorders, sprains and strains",columns:["Appropriate","Inappropriate"]},{id:"integ-pressure-q5",topic:"Integumentary",clientNeed:"Physiological Adaptation",format:"Matrix (NGN)",question:"A wound care nurse assesses pressure injuries on several clients. For each finding, indicate the stage it matches.",options:[{key:"1",text:"Intact skin over the heel with redness that does not blanch"},{key:"2",text:"Shallow open ulcer with partial-thickness skin loss on the coccyx"},{key:"3",text:"Wound on the hip completely covered by black eschar"},{key:"4",text:"Blister over the ischium from prolonged sitting"},{key:"5",text:"Wound bed on the sacrum covered with yellow slough"}],answer:["Stage I","Stage II","Unstageable","Stage II","Unstageable"],rationales:{1:"Non-blanchable erythema of intact skin is Stage I.",2:"Partial-thickness skin loss presenting as an open ulcer is Stage II.",3:"A wound covered with eschar cannot be staged, so the book classifies it as unstageable.",4:"The book describes Stage II as partial-thickness loss presenting as a blister or open ulcer.",5:"A wound covered with slough is unstageable because the base cannot be seen."},takeaway:"Accurate staging of pressure injuries guides care and documentation.",bookPage:"178",bookChapter:"Integumentary System",bookSection:"Pressure injuries",columns:["Stage I","Stage II","Unstageable"]},{id:"nclex-highrisk-q21",topic:"Multisystem & Shock",clientNeed:"Reduction of Risk Potential",format:"Matrix (NGN)",question:"A nurse is reviewing morning results. For each result, indicate whether it requires action or needs no immediate action.",options:[{key:"1",text:"ABG results showing acidosis"},{key:"2",text:"A blood glucose at an extreme low"},{key:"3",text:"A potassium level that is normal and matches prior results"},{key:"4",text:"ABG results showing alkalosis"},{key:"5",text:"A hemoglobin that has stayed the same for three days"}],answer:["Requires action","Requires action","No immediate action","Requires action","No immediate action"],rationales:{1:"ABG changes indicating acidosis are listed as critical labs that require action.",2:"Blood glucose extremes are critical labs that require action.",3:"A normal, stable potassium is not a potassium abnormality.",4:"ABG changes indicating alkalosis are listed as critical labs that require action.",5:"A stable hemoglobin does not suggest bleeding; a falling one would."},takeaway:"Recognize critical labs that require action.",bookPage:"8",bookChapter:"NCLEX Must-Know Content",bookSection:"High-risk conditions, labs & medication safety",columns:["Requires action","No immediate action"]},{id:"resp-cheat-q13",topic:"Respiratory",clientNeed:"Safety and Infection Prevention and Control",format:"Matrix (NGN)",question:"The nurse checks oxygen setups for several clients. For each setup, indicate whether it is correct or needs correction.",options:[{key:"1",text:"Partial rebreather mask at 3 L/min"},{key:"2",text:"Heated, humidified high-flow nasal cannula at 50 L/min for a client with severe hypoxemia"},{key:"3",text:"Nasal cannula at 4 L/min for a client with mild hypoxia who is eating"},{key:"4",text:"Bag-valve mask at 15 L/min for emergency manual ventilation"}],answer:["Needs correction","Correct setup","Correct setup","Correct setup"],rationales:{1:"The book lists 6 to 15 L/min for a partial rebreather; 3 L/min is too low.",2:"HFNC runs up to 60 L/min, heated and humidified, for severe cases.",3:"The nasal cannula runs at 1 to 6 L/min for mild hypoxia and lets the client talk and eat.",4:"The book lists the BVM at 15 L/min for emergency manual ventilation."},takeaway:"Match each oxygen device to its correct flow and use.",bookPage:"41",bookChapter:"Respiratory System",bookSection:"Respiratory system cheat sheet",columns:["Correct setup","Needs correction"]},{id:"gu-bph-q6",topic:"Renal & Genitourinary",clientNeed:"Reduction of Risk Potential",format:"Matrix (NGN)",question:"The nurse reviews test results for a client being evaluated for BPH. For each result, indicate whether it is normal or abnormal according to the book.",options:[{key:"1",text:"Uroflowmetry shows decreased urine flow"},{key:"2",text:"PSA of 2 ng/mL"},{key:"3",text:"Urinalysis is clear with no bacteria"},{key:"4",text:"Urinalysis shows bacteria, blood, and protein"},{key:"5",text:"Uroflowmetry flow of 25 mL/sec with a voided volume over 200 mL"}],answer:["Abnormal","Normal","Normal","Abnormal","Normal"],rationales:{1:"Abnormal. The book states decreased flow indicates urinary obstruction.",2:"Normal. The book gives a normal PSA as under 4 ng/mL.",3:"Normal. The book describes clear urine with no bacteria as normal.",4:"Abnormal. The book lists bacteria, blood and protein as signs of infection.",5:"Normal. The book gives over 200 mL and over 21 mL/sec as normal uroflowmetry."},takeaway:"Interpreting BPH diagnostics against the book's ranges.",bookPage:"125",bookChapter:"Genitourinary System",bookSection:"Benign prostatic hyperplasia (BPH)",columns:["Normal","Abnormal"]},{id:"heme-ida-q13",topic:"Hematology & Oncology",clientNeed:"Basic Care and Comfort",format:"Matrix (NGN)",question:"The nurse evaluates a client's understanding of self-care teaching for iron deficiency anemia. For each client statement, indicate whether it shows understanding or a need for further teaching.",options:[{key:"1",text:'"I will plan my meals using the iron-rich food list you gave me."'},{key:"2",text:'"I will skip meals on the days my mouth is sore."'},{key:"3",text:'"I will plan rest breaks between my household chores."'},{key:"4",text:'"I will push through my tiredness and do all my chores at once."'}],answer:["Shows understanding","Needs further teaching","Shows understanding","Needs further teaching"],rationales:{1:"Shows understanding. The book's dietary guidance is to provide iron-rich food lists and teach balanced nutrition.",2:"Needs further teaching. Skipping meals works against the book's goal of balanced, iron-rich nutrition; mouth lesion discomfort should be addressed instead.",3:"Shows understanding. The book says to ensure rest to reduce activity intolerance.",4:"Needs further teaching. Pushing through fatigue ignores the book's guidance to ensure rest for activity intolerance."},takeaway:"Evaluating self-care teaching about nutrition and rest in IDA.",bookPage:"157",bookChapter:"Hematology / Immunology",bookSection:"Iron deficiency anemia",columns:["Shows understanding","Needs further teaching"]},{id:"endo-hyperpara-q16",topic:"Endocrine",clientNeed:"Reduction of Risk Potential",format:"Matrix (NGN)",question:"A nurse is reviewing laboratory results for a client being evaluated for hyperparathyroidism. For each result, indicate whether it is consistent or not consistent with hyperparathyroidism.",options:[{key:"1",text:"Serum phosphorus above normal"},{key:"2",text:"Total serum calcium 11.6 mg/dL"},{key:"3",text:"Total serum calcium 8.0 mg/dL"},{key:"4",text:"Ionized calcium 5.9 mg/dL"},{key:"5",text:"Serum PTH 112 pg/mL"}],answer:["Not consistent","Consistent","Not consistent","Consistent","Consistent"],rationales:{1:"Not consistent. The book states phosphorus is often low in hyperparathyroidism.",2:"Consistent. The book lists total calcium above 10.5 mg/dL.",3:"Not consistent. 8.0 mg/dL is below the normal range of 8.4-10.2 mg/dL.",4:"Consistent. The book lists ionized calcium above 5.5 mg/dL.",5:"Consistent. The book lists a normal PTH of 10-65 pg/mL and an elevated PTH in more than 90% of cases."},takeaway:"Interpret laboratory results for hyperparathyroidism.",bookPage:"108",bookChapter:"Endocrine System",bookSection:"Hyperparathyroidism",columns:["Consistent","Not consistent"]},{id:"heme-ra-q15",topic:"Immunology & Infectious Disease",clientNeed:"Basic Care and Comfort",format:"Matrix (NGN)",question:"The nurse is planning care for clients with rheumatoid arthritis. For each nursing action, indicate whether it is a focus of the acute phase or the chronic phase.",options:[{key:"1",text:"Rest the inflamed joints"},{key:"2",text:"Promote gentle movement"},{key:"3",text:"Encourage independence in daily activities"},{key:"4",text:"Use assistive devices"}],answer:["Acute phase","Acute phase","Chronic phase","Chronic phase"],rationales:{1:"Acute phase. The book says to rest inflamed joints during the acute phase.",2:"Acute phase. The book says to promote gentle movement during the acute phase.",3:"Chronic phase. The book says to encourage independence during the chronic phase.",4:"Chronic phase. The book says to use assistive devices during the chronic phase."},takeaway:"Matching activity and rest measures to the phase of RA.",bookPage:"174",bookChapter:"Hematology / Immunology",bookSection:"Rheumatoid arthritis",columns:["Acute phase","Chronic phase"]},{id:"gi-appendicitis-q14",topic:"Gastrointestinal",clientNeed:"Management of Care",format:"Matrix (NGN)",question:"The nurse is assessing a client the day after appendectomy. For each finding, indicate whether it is expected or should be reported.",options:[{key:"1",text:"Mild incisional pain controlled with analgesics"},{key:"2",text:"Rigid abdomen with a new fever"},{key:"3",text:"Walking in the hall with assistance"},{key:"4",text:"Tolerating a regular diet"},{key:"5",text:"Rising heart rate with spreading abdominal pain"}],answer:["Expected","Report","Expected","Expected","Report"],rationales:{1:"Pain management is part of routine postoperative care.",2:"Rigidity and fever suggest peritonitis, a complication that delays discharge.",3:"Early ambulation is expected.",4:"Diet as tolerated is expected.",5:"A rising heart rate with spreading pain suggests peritonitis."},takeaway:"Identify postoperative complications that need reporting.",bookPage:"89",bookChapter:"Gastrointestinal System",bookSection:"Appendicitis",columns:["Expected","Report"]},{id:"cardio-cardiomyopathy-q5",topic:"Cardiovascular",clientNeed:"Physiological Adaptation",format:"Matrix (NGN)",question:"The nurse is reviewing notes for clients with cardiomyopathy. For each finding, indicate the type of cardiomyopathy it describes.",options:[{key:"1",text:"Enlarged ventricles with blood stasis"},{key:"2",text:"Thickened ventricular walls with rapid contraction"},{key:"3",text:"Stiff ventricles with preserved contraction"},{key:"4",text:"Impaired relaxation and a risk of sudden death in young athletes"},{key:"5",text:"Least common type; many clients die within 1-2 years"}],answer:["Dilated","Hypertrophic","Restrictive","Hypertrophic","Restrictive"],rationales:{1:"The book lists enlarged ventricles and blood stasis under dilated cardiomyopathy.",2:"Thickened walls and rapid contraction are characteristics of hypertrophic cardiomyopathy.",3:"Stiff ventricles, impaired filling and preserved contraction describe restrictive cardiomyopathy.",4:"The book lists impaired relaxation for HCM and links it to sudden death in young athletes.",5:"The book calls restrictive cardiomyopathy the least common type with a poor 1-2 year prognosis."},takeaway:"Differentiate the three types of cardiomyopathy.",bookPage:"49",bookChapter:"Cardiovascular System",bookSection:"Cardiomyopathy",columns:["Dilated","Hypertrophic","Restrictive"]},{id:"nclex-strategy-q12",topic:"Leadership & Delegation",clientNeed:"Safety and Infection Prevention and Control",format:"Matrix (NGN)",question:"A client suddenly develops severe shortness of breath. For each possible nurse action, indicate whether the nurse should consider it or eliminate it using the answer-selection strategy.",options:[{key:"1",text:"Go to the client and address airway and breathing right away"},{key:"2",text:"Finish charting on another client before going to the room"},{key:"3",text:"Independently change the dose of the client's prescribed medication"},{key:"4",text:"Tell the client this will never happen again"}],answer:["Consider","Eliminate","Eliminate","Eliminate"],rationales:{1:"The book says to choose airway over everything else and prioritize unstable patients.",2:"This delays care unnecessarily, which the book says to avoid.",3:"Changing a prescribed dose independently is outside nursing scope, which the book says to avoid.",4:"This uses absolute language like 'never', which the book says to avoid."},takeaway:"Eliminate unsafe, delaying, out-of-scope and absolute options.",bookPage:"12",bookChapter:"NCLEX Must-Know Content",bookSection:"Delegation, communication & answer strategy",columns:["Consider","Eliminate"]},{id:"fluids-main-q16",topic:"Fluids & Electrolytes",clientNeed:"Safety and Infection Prevention and Control",format:"Matrix (NGN)",question:"A nurse reviews orders for a hypotonic IV solution for three clients. For each client, indicate whether the hypotonic solution fits the book's use or needs caution.",options:[{key:"1",text:"A client with extensive partial- and full-thickness burns"},{key:"2",text:"A client who needs replacement of intracellular fluid losses"},{key:"3",text:"A client with a traumatic brain injury and increased intracranial pressure"}],answer:["Use with caution","Fits the book's use","Use with caution"],rationales:{1:"Needs caution. The book warns about using hypotonic solutions in clients with burns.",2:"Fits the book's use. Hypotonic solutions are used to replace intracellular fluid losses.",3:"Needs caution. The book warns about using hypotonic solutions in clients with increased intracranial pressure."},takeaway:"Recognize the client conditions in which hypotonic fluids need caution.",bookPage:"184",bookChapter:"Fluid & Electrolytes",bookSection:"Fluids and electrolytes cheat sheet",columns:["Fits the book's use","Use with caution"]},{id:"neuro-cranial-q4",topic:"Neurological",clientNeed:"Basic Care and Comfort",format:"Matrix (NGN)",question:"A client with trigeminal neuralgia wants to avoid painful attacks at home. For each comfort measure, indicate whether it is appropriate or not appropriate.",options:[{key:"1",text:"Shield the face from cold wind outdoors"},{key:"2",text:"Avoid unnecessary touching of the affected cheek"},{key:"3",text:"Sit directly in front of a fan blowing on the face"},{key:"4",text:"Have a family member gently stroke the jaw during an attack"}],answer:["Appropriate","Appropriate","Not appropriate","Not appropriate"],rationales:{1:"Appropriate. The book says attacks are triggered by light touch or wind.",2:"Appropriate. Light touch is a listed trigger, so avoiding it may prevent attacks.",3:"Not appropriate. Moving air on the face is like wind, a listed trigger.",4:"Not appropriate. Light touch is a listed trigger and can worsen the pain."},takeaway:"Prevent pain by avoiding known triggers.",bookPage:"153",bookChapter:"Neurologic System",bookSection:"Bell palsy, trigeminal neuralgia and related",columns:["Appropriate","Not appropriate"]},{id:"nclex-priorities-q18",topic:"Fundamentals & Safety",clientNeed:"Physiological Adaptation",format:"Matrix (NGN)",question:"A nurse is sorting client problems by the ABCs. For each problem, indicate whether it is an airway, breathing or circulation problem.",options:[{key:"1",text:"A client who is choking on food and cannot speak"},{key:"2",text:"A client whose oxygen saturation is falling and whose breaths are rapid and shallow"},{key:"3",text:"A client with low blood pressure and weak pulses and no sign of bleeding"},{key:"4",text:"An unresponsive client with snoring respirations from the tongue blocking the throat"}],answer:["Airway","Breathing","Circulation","Airway"],rationales:{1:"Choking that blocks speech is an airway obstruction, which comes first in the ABCs.",2:"Falling saturation with rapid, shallow breathing is a breathing problem, addressed after the airway.",3:"Low blood pressure and weak pulses are circulation issues, which follow airway and breathing.",4:"A tongue blocking the throat is an airway obstruction; airway problems come first."},takeaway:"Airway problems come first, breathing problems next, and circulation issues follow.",bookPage:"5",bookChapter:"NCLEX Must-Know Content",bookSection:"Priorities, safety & clinical judgment",columns:["Airway","Breathing","Circulation"]}];var Xm=[];var Do="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAACQCAIAAABoJHXvAABqPUlEQVR42u39d9wkR3E/jld194Td2fzkdDmfTiedTjolJJERIJNkg20MBpuMyRiTweQkwGSTkSwkIbIsEEmgnE7hgnQ5PTnt82ycnZnuru8fvbvPPuFkDh/+ffz6eXjQa293prunq7u6wruq8NInXw7/d/3vudj/TcH/Eez/rv8j2P9djUsA0KncjwAEgIu+p8e9gRrfw0meXfDUknfSHzGYxQ8+TrNLvsiC8dBSrdHJu3icMZysqVMkGJ3aI+ZuIiJENP/lnGkNVG+IAACBCICIEAAQ5093/VnzTmz+s82fmv8EAERkjAGg1vqkgwFAxhrvskQ7J/knmX+bd2GIjHOtdXM8iIhY73fxa7a2Y75niNQyttYbEIEx1FoTwUle58/DEomIiBhjAMAYKqUKhWIYhuYbcymtAYAxhoy1Dss8y3n9zkjJQqEYRZF5KyLinC+4kzFGmkqlcqVSbe2itU3OOTImpWz9prmaiUgIseD+5mdDCQRgiFKqQqEQRbJOP8aiKCqVSkSktS4UilLK5lDNC5oPWhPnjHMmlTLfNFrmzTWnNRUKpSiSAFAql/1abcnX+WNY4qldiPiB971r5YrlUkrGWK1W27fvwH9cd8PQ0HA8HgeAatU/+6wz3/7WNxJpzsWXvvLvt/7+tnQ6FUUyHo9/5F/f29HebibXr9V273n0P669fmZ2Noqiv3zB8174l88/
