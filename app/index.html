    const kx = Object.keys(x).length, ky = Object.keys(y).length;
    if (kx !== ky) return kx > ky ? x : y;
    return sortStr(JSON.stringify(x), JSON.stringify(y)) >= 0 ? x : y;
  }
  function unionBy(a, b, key, pick = richer) {
    const m = new Map();
    for (const x of [...arr(a), ...arr(b)]) {
      if (!obj(x)) continue;
      const k = key(x);
      m.set(k, m.has(k) ? pick(m.get(k), x) : x);
    }
    return [...m.values()];
  }
  const unionSet = (a, b) => [...new Set([...arr(a), ...arr(b)])].sort((x, y) => (typeof x === 'number' && typeof y === 'number' ? x - y : sortStr(String(x), String(y))));

  // Older attempts (before attempt ids) are keyed by their content.
  const attemptKey = a => a.id || `${a.qid}|${a.at || a.day}|${JSON.stringify(a.selected ?? null)}`;
  const attemptTime = a => time(a.at) || time(a.day);

  // "Edited last" with a stable tie-break so both orders give the same answer.
  // With no edit times (progress saved before sync existed), a real value beats the default.
  function newer(aVal, aAt, bVal, bAt, isDefault = () => false) {
    const ta = time(aAt), tb = time(bAt);
    if (ta !== tb) return ta > tb ? 'a' : 'b';
    const da = aVal == null || isDefault(aVal), db = bVal == null || isDefault(bVal);
    if (da !== db) return da ? 'b' : 'a';
    return sortStr(JSON.stringify(aVal ?? null), JSON.stringify(bVal ?? null)) >= 0 ? 'a' : 'b';
  }

  function mergePlan(a, b, ea, eb) {
    if (!a && !b) return null;
    // A plan removed on one device stays removed only if that removal is the newer edit.
    const w = newer(a, ea, b, eb);
    const win = w === 'a' ? a : b, lose = w === 'a' ? b : a;
    if (!win) return null;
    if (lose && lose.title === win.title && lose.created === win.created) {
      return { ...win, completed: unionSet(win.completed, lose.completed) };
    }
    return win;
  }

  const sessionStart = s => time(s && s.started);
  function pickSession(a, b) {
    if (!a || !b) return a || b || null;
    const ta = sessionStart(a), tb = sessionStart(b);
    if (ta !== tb) return ta > tb ? a : b;
    // Same session on both devices: keep the one further along.
    const na = Object.keys(a.answers || {}).length + (a.index || 0), nb = Object.keys(b.answers || {}).length + (b.index || 0);
    if (na !== nb) return na > nb ? a : b;
    return sortStr(String(a.id), String(b.id)) <= 0 ? a : b;
  }
  function pickCase(a, b) {
    if (!a || !b) return a || b || null;
    const na = Object.keys(a.submitted || {}).length + (a.index || 0), nb = Object.keys(b.submitted || {}).length + (b.index || 0);
    if (a.caseId === b.caseId && na !== nb) return na > nb ? a : b;
    const ta = time(a.updated || a.started), tb = time(b.updated || b.started);
    if (ta !== tb) return ta > tb ? a : b;
    return sortStr(JSON.stringify(a), JSON.stringify(b)) >= 0 ? a : b;
  }

  // The part of the state that travels to the server.
  function syncable(state) {
    const out = {};
    for (const [k, v] of Object.entries(state || {})) if (!LOCAL_ONLY.includes(k)) out[k] = v;
    out.book = { marks: arr(state?.book?.marks) };
    return out;
  }

  // merge(local, remote) → the new local state. Local-only settings come from `local`.
  function mergeState(local, remote) {
    const L = obj(local) || {}, R = obj(remote) || {};
    const eL = obj(L.edited) || {}, eR = obj(R.edited) || {};
    const edited = {};
    for (const k of ['name', 'plan', 'reminder']) {
      const t = time(eL[k]) >= time(eR[k]) ? eL[k] : eR[k];
      if (t) edited[k] = t;
    }
    const nameW = newer(L.name, eL.name, R.name, eR.name, n => !String(n).trim() || n === 'Student');
    const remW = newer(L.reminder, eL.reminder, R.reminder, eR.reminder, r => !r.on && !r.title && !r.notes);

    const attempts = unionBy(L.attempts, R.attempts, attemptKey)
      .sort((x, y) => attemptTime(x) - attemptTime(y) || sortStr(attemptKey(x), attemptKey(y)));
    const history = unionBy(L.history, R.history, h => h.id)
      .sort((x, y) => time(x.finished) - time(y.finished) || sortStr(String(x.id), String(y.id)));
    const caseHistory = unionBy(L.caseHistory, R.caseHistory, h => `${h.caseId}|${h.finished}`)
      .sort((x, y) => time(x.finished) - time(y.finished) || sortStr(String(x.caseId), String(y.caseId)));
    const reports = unionBy(L.reports, R.reports, r => r.id || `${r.created}|${r.qid}|${r.reason}`,
      (x, y) => (x.status === 'sent') !== (y.status === 'sent') ? (x.status === 'sent' ? x : y) : richer(x, y))
      .sort((x, y) => time(x.created) - time(y.created) || sortStr(String(x.id), String(y.id)));

    const lastOpen = [L.lastOpen, R.lastOpen].filter(Boolean).sort().pop();
    const out = {
      ...L,
      name: nameW === 'a' ? (L.name ?? R.name) : (R.name ?? L.name),
      reminder: remW === 'a' ? (L.reminder ?? R.reminder) : (R.reminder ?? L.reminder),
      plan: mergePlan(L.plan ?? null, R.plan ?? null, eL.plan, eR.plan),
      attempts, history, caseHistory, reports,
      bookmarks: unionSet(L.bookmarks, R.bookmarks),
      readLessons: unionSet(L.readLessons, R.readLessons),
      readSections: unionSet(L.readSections, R.readSections),
      milestones: unionSet(L.milestones, R.milestones),
      book: { ...(obj(L.book) || {}), marks: unionSet(L.book?.marks, R.book?.marks) },
      session: pickSession(L.session ?? null, R.session ?? null),
      caseSession: pickCase(L.caseSession ?? null, R.caseSession ?? null),
      edited,
    };
    if (lastOpen) out.lastOpen = lastOpen;
    // A session that this device already finished must not come back from the other copy.
    if (out.session && history.some(h => h.id === out.session.id)) out.session = null;
    return out;
  }
  return { mergeState, syncable, LOCAL_ONLY };
})();

// Optional account (Sign in with Apple) + progress sync, on Supabase.
// Same design as Critical Care Certified: Supabase Auth (Apple provider) + Postgres with
// row-level security, reached with plain fetch (no SDK). Schema: backend/supabase.sql.
//
// iPhone: the native shell runs Apple's sign-in sheet (expo-apple-authentication with a
//   SHA-256 nonce) and hands back the identity token, exchanged here at
//   /auth/v1/token?grant_type=id_token. The shell then calls Purchases.logIn(<user id>) so the
//   RevenueCat subscription is attached to the account.
// Web: Supabase's Apple OAuth redirect with PKCE: only this browser, which made the code verifier,
//   can exchange the returned ?code= for a session (tokens put in a link by someone else are ignored).
// Nobody has to sign in: without an account everything stays on the device, as before.

const Account = (() => {
  const cfg = () => ({ ...RNR_CONFIG, ...(window.__RNR_CONFIG__ || {}) });
  const configured = () => {
    const c = cfg();
    return !!(c.supabaseUrl && c.supabaseKey && !/REPLACE_ME/.test(c.supabaseUrl + c.supabaseKey));
  };
  const isWeb = () => !!window.__RNR_WEB__;
  const bridge = () => window.ReactNativeWebView;
  // The card shows on the phone only once the Apple provider is live (config.appleSignIn).
  const enabled = () => configured() && (isWeb() || cfg().appleSignIn === true);
  const base = () => cfg().supabaseUrl.replace(/\/$/, '');

  const SESSION_KEY = 'rnr.session.v1', SYNCED_KEY = 'rnr.lastSynced.v1';
  const read = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const write = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let status = { session: read(SESSION_KEY, null), syncing: false, lastError: null, lastSyncedAt: read(SYNCED_KEY, null) };
  const listeners = new Set();
  const set = p => { status = { ...status, ...p }; listeners.forEach(l => { try { l(status); } catch {} }); };
  const onChange = fn => { listeners.add(fn); return () => listeners.delete(fn); };

  function tellNative(userId) {
    try { bridge()?.postMessage(JSON.stringify({ type: 'account', userId: userId || null })); } catch {}
  }
  function saveSession(s) {
    write(SESSION_KEY, s);
    if (!s) write(SYNCED_KEY, null);
    set({ session: s, ...(s ? {} : { lastSyncedAt: null, lastError: null }) });
    tellNative(s?.userId);
  }

  // Every failure says which step failed, so problems can be diagnosed from a screenshot.
  const stepOf = path => path.includes('/functions/v1/entitlement') ? 'the subscription check'
    : path.includes('/functions/v1/book-page') ? 'the book page'
    : path.includes('/storage/') ? 'the question bank'
    : path.includes('/auth/') ? 'sign-in'
    : path.includes('save_progress') || path.includes('/progress') ? 'progress sync'
    : path.includes('delete-account') ? 'account deletion'
    : path.includes('reset_progress') ? 'resetting synced progress'
    : 'the server';

  async function call(path, init = {}) {
    const headers = { apikey: cfg().supabaseKey, 'Content-Type': 'application/json', ...(init.headers || {}) };
    if (init.auth) {
      const s = await validSession();
      if (!s) throw new Error('Please sign in again.');
      headers.Authorization = `Bearer ${s.accessToken}`;
    }
    let res;
    try { res = await fetch(base() + path, { method: init.method || 'GET', body: init.body, headers, cache: 'no-store' }); }
    catch (e) { throw new Error(`Couldn't reach ${stepOf(path)}. Check your connection and try again. (${e?.message || e})`); }
    const text = await res.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch { body = text; }
    if (!res.ok) {
      const msg = body?.error_description || body?.msg || body?.message || body?.error || `${stepOf(path)} failed (${res.status})`;
      const err = new Error(typeof msg === 'string' ? msg : `${stepOf(path)} failed (${res.status})`);
      err.status = res.status; err.body = body; throw err;
    }
    return body;
  }

  const fromAuth = b => ({
    accessToken: b.access_token, refreshToken: b.refresh_token,
    expiresAt: Date.now() + (b.expires_in || 3600) * 1000,
    userId: b.user.id, email: b.user.email || '',
  });
  let refreshing = null;
  async function validSession() {
    const s = status.session;
    if (!s) return null;
    if (s.expiresAt - Date.now() > 60_000) return s;
    refreshing = refreshing || (async () => {
      try {
        const b = await call('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: s.refreshToken }) });
        const n = fromAuth(b); saveSession(n); return n;
      } catch (e) {
        if (e.status === 400 || e.status === 401) saveSession(null);
        return null;
      } finally { setTimeout(() => { refreshing = null; }, 0); }
    })();
    return refreshing;
  }

  // ---- Sign in with Apple ----
  let applePending = null;
  window.__rnrAppleResult = r => { const p = applePending; applePending = null; p?.(r || { ok: false }); };
  function nativeApple() {
    return new Promise(resolve => {
      applePending = resolve;
      setTimeout(() => { if (applePending === resolve) { applePending = null; resolve({ ok: false, error: "Sign in with Apple didn't answer. Try again." }); } }, 180000);
      bridge().postMessage(JSON.stringify({ type: 'apple-signin' }));
    });
  }
  async function signInWithApple() {
    if (bridge()) {
      const r = await nativeApple();
      if (!r?.ok) { if (r?.cancelled) return false; throw new Error(r?.error || "Sign in with Apple didn't finish."); }
      const b = await call('/auth/v1/token?grant_type=id_token', { method: 'POST', body: JSON.stringify({ provider: 'apple', id_token: r.identityToken, nonce: r.rawNonce }) });
      saveSession(fromAuth(b));
      return true;
    }
    const verifier = randomString(64);
    try { sessionStorage.setItem(PKCE_KEY, verifier); } catch { throw new Error('This browser blocks storage, so sign-in can’t finish. Allow site data for this page and try again.'); }
    const challenge = await sha256url(verifier);
    const back = location.origin + location.pathname;
    location.href = `${base()}/auth/v1/authorize?provider=apple&redirect_to=${encodeURIComponent(back)}&code_challenge=${challenge}&code_challenge_method=s256`;
    return false;
  }
  const PKCE_KEY = 'rnr.pkce.v1';
  function randomString(n) {
    const a = new Uint8Array(n); crypto.getRandomValues(a);
    return Array.from(a, b => 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._~'[b % 66]).join('');
  }
  async function sha256url(text) {
    const d = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)));
    let b = ''; for (const x of d) b += String.fromCharCode(x);
    return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // Back from Apple: exchange ?code= with the verifier this browser kept. Tokens in the URL fragment
  // are never accepted (that would let a crafted link sign someone into another account).
  async function consumeAuthRedirect() {
    const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
    const clean = () => history.replaceState(null, '', location.pathname);
    const errText = q.get('error_description') || q.get('error') || h.get('error_description') || h.get('error');
    if (errText) { clean(); throw new Error(`Sign-in didn't finish: ${errText}`); }
    if (h.get('access_token')) clean();          // ignore implicit-flow tokens in links
    const code = q.get('code');
    if (!code) return false;
    let verifier = null;
    try { verifier = sessionStorage.getItem(PKCE_KEY); sessionStorage.removeItem(PKCE_KEY); } catch {}
    clean();
    if (!verifier) throw new Error('Sign-in started in another tab or browser. Tap Sign in with Apple again here.');
    const b = await call('/auth/v1/token?grant_type=pkce', { method: 'POST', body: JSON.stringify({ auth_code: code, code_verifier: verifier }) });
    saveSession(fromAuth(b));
    return true;
  }
  async function signOut() {
    try { await call('/auth/v1/logout', { method: 'POST', auth: true }); } catch {}
    saveSession(null);
  }
  // Deletes the account on the server (Edge Function `delete-account`, Auth admin API). On the iPhone,
  // Apple is asked once more for an authorization code so the server can revoke the Sign in with Apple
  // token too. Cancelling that sheet cancels the deletion.
  async function deleteAccount() {
    let appleAuthorizationCode = null;
    if (bridge()) {
      const r = await nativeApple();
      if (!r?.ok) { if (r?.cancelled) { const e = new Error('Deletion cancelled.'); e.cancelled = true; throw e; } }
      else appleAuthorizationCode = r.authorizationCode || null;
    }
    await call('/functions/v1/delete-account', { method: 'POST', auth: true, body: JSON.stringify({ appleAuthorizationCode }) });
    saveSession(null);
  }
  // "Reset data" while signed in: clear the synced copy too, so the next sync doesn't bring it back.
  async function resetSynced() {
    if (!status.session) return;
    await call('/rest/v1/rpc/reset_progress', { method: 'POST', auth: true, body: '{}' });
  }

  // ---- Web: Pro check and private content ----
  const checkWebAccess = () => call('/functions/v1/entitlement', { method: 'POST', auth: true, body: '{}' });
  const privateJson = (bucket, path) => call(`/storage/v1/object/authenticated/${bucket}/${path}`, { auth: true });
  async function bookPage(page) {
    const s = await validSession();
    if (!s) throw new Error('Please sign in again.');
    let res;
    try {
      res = await fetch(`${base()}/functions/v1/book-page?page=${encodeURIComponent(page)}`, { headers: { apikey: cfg().supabaseKey, Authorization: `Bearer ${s.accessToken}` }, cache: 'no-store' });
    } catch (e) { throw new Error(`Couldn't reach the book page. Check your connection. (${e?.message || e})`); }
    if (!res.ok) { let m = `Couldn't load page ${page} (${res.status}).`; try { m = (await res.json()).error || m; } catch {} throw new Error(m); }
    return res.blob();
  }

  // ---- Progress sync: GET → merge → save with version check (409 → merge again) ----
  async function syncNow(get, replace) {
    if (!configured() || !status.session || status.syncing) return false;
    set({ syncing: true, lastError: null });
    try {
      for (let attempt = 0; attempt < 4; attempt++) {
        const rows = await call(`/rest/v1/progress?select=state,version&user_id=eq.${status.session.userId}`, { auth: true });
        const remote = Array.isArray(rows) ? rows[0] : null;
        const baseVersion = remote?.version || 0;
        const merged = remote?.state ? mergeState(get(), remote.state) : get();
        try {
          await call('/rest/v1/rpc/save_progress', { method: 'POST', auth: true, body: JSON.stringify({ p_state: syncable(merged), p_base_version: baseVersion }) });
          replace(merged);
          const at = Date.now(); write(SYNCED_KEY, at); set({ lastSyncedAt: at });
          return true;
        } catch (e) {
          if (e.status === 409 || /version_conflict/.test(e.message)) continue;   // another device saved first
          throw e;
        }
      }
      throw new Error('Sync kept conflicting with another device. It will retry automatically.');
    } catch (e) {
      set({ lastError: navigator.onLine === false ? "You're offline. Changes will sync when you reconnect." : e.message });
      return false;
    } finally {
      set({ syncing: false });
    }
  }

  // "Report a problem" entries go to the review queue once the learner is signed in.
  async function sendReports(reports) {
    const q = (reports || []).filter(r => r && r.status !== 'sent');
    if (!q.length || !status.session) return [];
    await call('/rest/v1/issue_reports', { method: 'POST', auth: true, headers: { Prefer: 'return=minimal,resolution=ignore-duplicates' },
      body: JSON.stringify(q.map(r => ({ id: String(r.id || `${r.created}|${r.qid}`).slice(0, 80), question_id: r.qid || null, reason: String(r.reason || '').slice(0, 80), details: String(r.details || '').slice(0, 2000), created_at: r.created }))) });
    return q.map(r => r.id);
  }

  // Phone: remind the shell which RevenueCat user to use (logIn is idempotent).
  if (status.session) setTimeout(() => tellNative(status.session.userId), 0);

  return {
    configured, enabled, isWeb, onChange, get status() { return status; },
    signInWithApple, consumeAuthRedirect, signOut, deleteAccount, resetSynced,
    checkWebAccess, privateJson, bookPage, syncNow, sendReports,
    webAppUrl: () => cfg().webAppUrl, supportEmail: () => cfg().supportEmail,
  };
})();

window.__RNR_WEB__=true;window.__RNR_ACCOUNT__=Account;
// Web app only: book pages are protected. The app asks for `pages/pNNN.webp`; on the web,
// pageImg() calls window.__rnrWebPageSrc(p) instead, which returns a blank placeholder tagged
// with the page number. This module swaps each placeholder for a <canvas> and draws the page
// fetched one at a time from the `book-page` Edge Function (Pro check + per-account limits,
// no-store), with a watermark naming the account. There is no image file to save or drag,
// and nothing is cached on disk: pages live only in memory for this tab.
const WebReader = (() => {
  const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  const W = 900, H = 1350;
  const cache = new Map();            // page → Promise<ImageBitmap|HTMLImageElement>
  const MAX_CACHED = 24;

  window.__rnrWebPageSrc = p => `${BLANK}#rnr-page-${Number(p)}`;

  function label() {
    return String(window.__RNR_ACCOUNT_LABEL__ || 'Rapid Nursing Review Pro');
  }
  async function decode(blob) {
    if (window.createImageBitmap) return createImageBitmap(blob);
    const url = URL.createObjectURL(blob);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      return img;
    } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  }
  function load(page) {
    if (!cache.has(page)) {
      const pr = window.__RNR_ACCOUNT__.bookPage(page).then(decode);
      pr.catch(() => cache.delete(page));
      cache.set(page, pr);
      while (cache.size > MAX_CACHED) cache.delete(cache.keys().next().value);
    }
    return cache.get(page);
  }

  function message(ctx, text) {
    ctx.fillStyle = '#f4f5f8'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#5b6478'; ctx.font = '600 30px system-ui, -apple-system, sans-serif'; ctx.textAlign = 'center';
    const words = String(text).split(' '); let line = '', y = H / 2 - 40;
    for (const w of words) {
      if (ctx.measureText(line + w).width > W - 160) { ctx.fillText(line.trim(), W / 2, y); line = ''; y += 42; }
      line += w + ' ';
    }
    ctx.fillText(line.trim(), W / 2, y);
  }
  function watermark(ctx, page) {
    const who = label(), stamp = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    ctx.save();
    ctx.globalAlpha = 0.07; ctx.fillStyle = '#000';
    ctx.font = '700 30px system-ui, -apple-system, sans-serif'; ctx.textAlign = 'center';
    ctx.translate(W / 2, H / 2); ctx.rotate(-Math.PI / 6);
    for (let y = -H; y <= H; y += 210) for (let x = -W; x <= W; x += 520) ctx.fillText(`${who} · ${stamp}`, x + ((y / 210) % 2 ? 260 : 0), y);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#5b6478'; ctx.font = '500 18px system-ui, -apple-system, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`Licensed to ${who} · Rapid Nursing Review · p. ${page}`, W - 24, H - 18);
    ctx.restore();
  }

  function swap(img) {
    const m = /#rnr-page-(\d+)$/.exec(img.getAttribute('src') || '');
    if (!m) return;
    const page = Number(m[1]);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    for (const a of img.attributes) if (a.name !== 'src' && a.name !== 'alt' && a.name !== 'loading') c.setAttribute(a.name, a.value);
    c.classList.add('rnr-page');
    c.setAttribute('role', 'img');
    c.setAttribute('aria-label', img.getAttribute('alt') || `Book page ${page}`);
    c.dataset.rnrPage = String(page);
    img.replaceWith(c);
    const ctx = c.getContext('2d');
    message(ctx, `Loading page ${page}…`);
    load(page).then(bmp => {
      if (!c.isConnected) return;
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(bmp, 0, 0, W, H);
      watermark(ctx, page);
    }).catch(e => { if (c.isConnected) message(ctx, e?.message || `Couldn't load page ${page}.`); });
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches?.('img[src*="#rnr-page-"]')) swap(root);
    root.querySelectorAll('img[src*="#rnr-page-"]').forEach(swap);
  }
  function start() {
    scan(document.body);
    new MutationObserver(list => {
      for (const r of list) {
        if (r.type === 'attributes') scan(r.target);
        else r.addedNodes.forEach(scan);
      }
    }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
    // A browser can't block the computer's screenshot keys. As a deterrent, pages blur whenever the
    // window loses focus (screenshot and snipping tools usually take focus) or Print Screen is pressed.
    const hide = on => document.body.classList.toggle('rnr-shield', on);
    window.addEventListener('blur', () => hide(true));
    window.addEventListener('focus', () => hide(false));
    document.addEventListener('visibilitychange', () => hide(document.visibilityState !== 'visible'));
    document.addEventListener('keydown', e => { if (e.key === 'PrintScreen' || (e.metaKey && e.shiftKey && /^[345]$/.test(e.key))) { hide(true); setTimeout(() => hide(!document.hasFocus()), 1500); } });
    document.addEventListener('keyup', e => { if (e.key === 'PrintScreen') { hide(true); setTimeout(() => hide(!document.hasFocus()), 1500); } });
    // No saving or dragging the book pages.
    for (const ev of ['contextmenu', 'dragstart', 'copy']) {
      document.addEventListener(ev, e => { if (e.target?.closest?.('canvas.rnr-page, .reader, .inline-page, #page-viewer')) e.preventDefault(); });
    }
  }
  return { start };
})();

// Web app entry (https://nclexrapidnursingreview.com/app/). The public page holds no questions and
// no book: it signs the learner in with Apple, asks the server (entitlement → RevenueCat) whether
// that account has an active Rapid Nursing Review Pro subscription bought in the iPhone app, then
// downloads the question bank from private storage and starts the same app the phone runs.
// No purchase happens here and there are no links to outside payment.

const Gate = (() => {
  const APPLE = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M16.37 12.8c-.02-2.1 1.72-3.12 1.8-3.17-.98-1.43-2.5-1.63-3.04-1.65-1.29-.13-2.52.76-3.18.76-.66 0-1.67-.74-2.75-.72-1.41.02-2.72.82-3.45 2.09-1.47 2.55-.38 6.33 1.06 8.4.7 1.01 1.54 2.15 2.63 2.11 1.06-.04 1.46-.68 2.73-.68 1.28 0 1.64.68 2.75.66 1.14-.02 1.86-1.03 2.55-2.05.8-1.17 1.13-2.31 1.15-2.37-.03-.01-2.21-.85-2.25-3.38zM14.3 6.62c.58-.71.98-1.69.87-2.67-.84.03-1.86.56-2.46 1.27-.54.62-1.01 1.62-.89 2.58.94.07 1.9-.48 2.48-1.18z"/></svg>';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const el = () => document.getElementById('rnr-gate');

  function screen(inner) {
    el().innerHTML = `<div class="wg-card"><img class="wg-cover" src="pages/cover.webp" alt="Rapid Nursing Review: All Body Systems at a Glance, book cover" width="96" height="144">
      <h1>Rapid Nursing Review</h1><p class="wg-sub">NCLEX-RN® Review · Web</p>${inner}
      <p class="wg-fine"><a href="../privacy.html">Privacy</a> · <a href="../terms.html">Terms</a> · <a href="../support.html">Support</a> · <a href="mailto:alexkorirbooks@gmail.com">alexkorirbooks@gmail.com</a></p>
      <p class="wg-fine">NCLEX® is a registered trademark of NCSBN, which does not sponsor or endorse this app.</p></div>`;
  }
  function signInScreen(err) {
    screen(`<p>For Rapid Nursing Review Pro subscribers. Sign in with the same Apple ID you use in the iPhone app and pick up where you left off.</p>
      ${err ? `<p class="wg-err" role="alert">${esc(err)}</p>` : ''}
      <button class="apple-btn" id="wg-apple" type="button">${APPLE}<span>Sign in with Apple</span></button>
      <p class="wg-help">First time? In the iPhone app, open <b>Settings → Sync and web access</b> and tap <b>Sign in with Apple</b> once. That links your subscription and progress to your Apple ID.</p>`);
    document.getElementById('wg-apple').onclick = () => Account.signInWithApple().catch(e => signInScreen(e.message));
  }
  function noAccessScreen() {
    screen(`<p class="wg-err" role="alert">We couldn't find an active Rapid Nursing Review Pro subscription for this Apple ID.</p>
      <ol class="wg-steps"><li>On your iPhone, open Rapid Nursing Review and subscribe, or tap Restore Purchases.</li>
      <li>In the app, open <b>Settings → Sync and web access</b> and tap <b>Sign in with Apple</b> with this same Apple ID.</li>
      <li>Come back here and tap Check again.</li></ol>
      <div class="wg-row"><button class="btn" id="wg-again" type="button">Check again</button><button class="btn secondary" id="wg-out" type="button">Sign out</button></div>`);
    document.getElementById('wg-again').onclick = () => start();
    document.getElementById('wg-out').onclick = async () => { await Account.signOut(); signInScreen(); };
  }
  function errorScreen(msg) {
    screen(`<p class="wg-err" role="alert">${esc(msg || 'Something went wrong.')}</p>
      <div class="wg-row"><button class="btn" id="wg-again" type="button">Try again</button><button class="btn secondary" id="wg-out" type="button">Sign out</button></div>`);
    document.getElementById('wg-again').onclick = () => start();
    document.getElementById('wg-out').onclick = async () => { await Account.signOut(); signInScreen(); };
  }
  const wait = text => screen(`<p class="wg-wait" role="status">${esc(text)}</p>`);

  function bootApp(content, access) {
    const s = Account.status.session;
    const pages = Number(content?.book?.pages) || 196;
    // Book text stays on the server; search on the web looks at section titles only.
    window.__RNR_CONTENT__ = { ...content, pageText: Array.from({ length: pages }, () => '') };
    window.__RNR_PRO__ = true;
    window.__RNR_WEB_ACCESS__ = access;
    window.__RNR_ACCOUNT__ = Account;
    window.__RNR_ACCOUNT_LABEL__ = s.email && !/privaterelay/i.test(s.email) ? s.email : `account ${s.userId.slice(0, 8)}`;
    const tag = document.createElement('script');
    tag.src = window.__RNR_APP_JS__;
    tag.onload = () => { document.body.classList.remove('gate-on'); el().remove(); };
    tag.onerror = () => errorScreen("Couldn't load the app. Reload the page to try again.");
    document.body.appendChild(tag);
  }

  async function start() {
    if (!Account.configured()) { screen(`<p class="wg-err" role="alert">The web app isn't connected to its server yet.</p>`); return; }
    wait('Checking your subscription…');
    try {
      await Account.consumeAuthRedirect();
      if (!Account.status.session) return signInScreen();
      const access = await Account.checkWebAccess();
      if (!access?.active) return noAccessScreen();
      wait('Loading your questions…');
      const content = await Account.privateJson('content', 'content.json');
      if (!content?.bookQuestions || !content?.nclexBank) throw new Error("The question bank didn't download completely. Reload the page to try again.");
      bootApp(content, access);
    } catch (e) {
      if (!Account.status.session) return signInScreen(e.message);
      errorScreen(e.message);
    }
  }
  return { start };
})();

WebReader.start();Gate.start();
})();
</script>
