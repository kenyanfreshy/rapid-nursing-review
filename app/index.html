/* ---- Book panel (right side) and book-structured course lists ---- */
.book-toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:white;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--green)}
.book-toggle svg{width:17px;height:17px}
.book-toggle[aria-expanded="true"]{background:var(--sage);border-color:#cddcbe}
.book-panel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:#fcfdfb;border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;box-shadow:-12px 0 40px #1c3d2512}
.book-backdrop{position:fixed;inset:0;background:#14271d55;z-index:29}
body.book-open .app-shell{margin-right:400px}
.bp-head{display:flex;gap:14px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.bp-cover{width:52px;height:78px;object-fit:cover;border-radius:4px;box-shadow:0 4px 12px #0003;flex-shrink:0;background:#3a3f45}
.bp-head h2{font-size:15px;line-height:1.25}
.bp-head p{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.bp-head .icon-button{margin-left:auto;align-self:flex-start}
.bp-tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line)}
.bp-tab{padding:9px 12px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.bp-tab[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green)}
.bp-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 24px}
.bp-search{margin-bottom:14px}
.bp-search input{padding:9px 11px;font-size:12px}
.toc-chapter{border:1px solid var(--line);border-radius:10px;background:white;margin-bottom:8px;overflow:hidden}
.toc-chapter>button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;text-align:left}
.toc-num{min-width:38px;height:26px;padding:0 7px;display:grid;place-items:center;border-radius:13px;font-size:10px;font-weight:700;color:white;font-family:Manrope,sans-serif}
.toc-chapter strong{font-size:12px;font-weight:650;display:block}
.toc-chapter small{color:var(--muted);font-size:10px}
.toc-chapter .toc-caret{margin-left:auto;transition:transform .2s;color:var(--muted)}
.toc-chapter .toc-caret svg{width:15px;height:15px}
.toc-chapter[data-open="true"] .toc-caret{transform:rotate(90deg)}
.toc-sections{border-top:1px solid #eef0e9;padding:4px 0}
.section-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid #f1f3ee}
.section-row:first-child{border-top:0}
.sec-pages{font-size:9px;font-weight:650;color:#7f8977;background:#f3f5ef;border-radius:4px;padding:3px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.section-row h3{font-size:12px;font-weight:600;letter-spacing:-.1px;line-height:1.35}
.section-row p{font-size:10px;color:var(--muted);margin-top:2px}
.section-row .done{color:#5e7d4c;font-weight:600}
.sec-actions{display:flex;gap:6px}
.mini{border:1px solid #dfe4d9;background:white;border-radius:6px;padding:5px 9px;font-size:10px;font-weight:600;white-space:nowrap}
.mini:hover{background:#f1f5ec}
.mini.solid{background:var(--green);border-color:var(--green);color:white}
.mini.solid:hover{background:#38654e}
.reader-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.reader-nav .where{font-size:11px;color:var(--muted);text-align:center;flex:1;min-width:0}
.reader-nav .where strong{display:block;color:var(--ink);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-frame{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#eef0ea;aspect-ratio:2/3;max-width:100%}
.page-frame img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.page-locked{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:#f3f5ef;font-size:12px;color:var(--muted)}
.page-locked strong{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.reader-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.reader-tools input{width:64px;padding:5px 7px;font-size:11px}
.reader-section{margin-top:14px;padding:12px;border-radius:9px;background:#f2f4ec;border:1px solid #e6eade}
.reader-section small{display:block;font-size:9px;letter-spacing:1px;color:#7f8977;text-transform:uppercase;margin-bottom:4px}
.reader-section h3{font-size:13px;margin-bottom:8px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.page-viewer{width:min(760px,96vw);max-height:96vh;padding:12px;background:#2a2f33;border:0}
.page-viewer img{width:100%;height:auto;display:block;border-radius:4px}
.page-viewer .pv-bar{display:flex;justify-content:space-between;align-items:center;color:#e8ece6;font-size:12px;padding:0 2px 10px}
.page-viewer .pv-bar button{color:#e8ece6;border:1px solid #ffffff33;border-radius:6px;padding:6px 10px;font-size:11px}
.book-ref{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.book-ref span{font-size:10px;color:#638351;font-weight:600}
.inline-page{margin-top:10px;max-width:340px}
.inline-page img{width:100%;border-radius:5px;border:1px solid var(--line)}
.chapter-block{margin-bottom:26px}
.chapter-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.chapter-head h2{font-size:17px}
.chapter-head p{font-size:11px;color:var(--muted)}
.chapter-head .title-actions{margin-left:auto}
.chapter-list{border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden}
.chapter-list .section-row{padding:12px 16px}
.chapter-list .section-row h3{font-size:13px}
.course-grid.chapters{grid-template-columns:repeat(4,1fr)}
@media(max-width:1600px){body.book-open .course-grid.chapters{grid-template-columns:repeat(2,1fr)}body.book-open .stats{grid-template-columns:repeat(2,1fr)}body.book-open .hero-row{grid-template-columns:1fr}}
@media(max-width:1280px){body.book-open .app-shell{margin-right:0}.course-grid.chapters{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1281px){.book-backdrop{display:none}}
@media(max-width:650px){.book-toggle span:last-child{display:none}.book-toggle{padding:7px}.course-grid.chapters{grid-template-columns:1fr}.section-row{grid-template-columns:1fr auto}.section-row .sec-pages{grid-column:1/-1;justify-self:start}.chapter-head{flex-wrap:wrap}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.book-panel[hidden],.book-backdrop[hidden]{display:none}

/* ---- Colorful navigation (each tab has its own color) ---- */
.nav-link svg{color:var(--nc)}
.nav-link.active{background:color-mix(in srgb,var(--nc) 12%,white);color:color-mix(in srgb,var(--nc) 80%,#111)}
.nav-link.active:after{background:var(--nc)}
.nav-link:hover{background:color-mix(in srgb,var(--nc) 8%,white);color:color-mix(in srgb,var(--nc) 80%,#111)}
.filter.active{border-color:currentColor}
.bp-tab[aria-selected="true"]{color:#ea580c;border-bottom-color:#ea580c}
.bp-tab:nth-child(1)[aria-selected="true"]{color:#2563eb;border-bottom-color:#2563eb}

/* ---- Exam and quiz screens stay plain white ---- */
#modal.exam{background:#fff}
#modal.exam .modal-header h2{color:#111}
#modal.exam .quiz-progress{background:#eee}
#modal.exam .quiz-progress div{background:#333}
#modal.exam .answer{background:#fff;border-color:#d9d9d9}
#modal.exam .answer-letter{border-color:#d0d0d0}
#modal.exam .answer.selected{border-color:#111;background:#fff;box-shadow:0 0 0 1px #111}
#modal.exam .answer.correct{border-color:#2f7a3d;background:#fff;box-shadow:inset 4px 0 0 #2f7a3d}
#modal.exam .answer.incorrect{border-color:#b3261e;background:#fff;box-shadow:inset 4px 0 0 #b3261e}
#modal.exam .answer .mark{margin-left:auto;color:#2f7a3d}
#modal.exam .rationale{background:#fff;border-color:#e2e2e2}
#modal.exam .rationale-list div,#modal.exam .rationale-list strong{color:#333}
#modal.exam .mistake-picks button{background:#fff;color:#444;border-color:#d9d9d9}
#modal.exam .mistake-picks button.active{background:#f2f2f2;border-color:#111;color:#111}
#modal.exam .simple-explanation{background:#f7f7f7}
#modal.exam .result-score{color:#111}
#modal.exam .primary{background:#111;border-color:#111;color:#fff}
#modal.exam .primary:hover{background:#333}
#modal.exam .secondary{background:#fff;border-color:#d9d9d9}
#modal.exam .result-item .ok{color:#2f7a3d}#modal.exam .result-item .redo{color:#b3261e}
.type-hint{font-size:11px;color:#666;margin:-10px 0 12px;font-weight:600;letter-spacing:.2px}
.q-tags{font-size:10px;color:#666;letter-spacing:.3px;text-transform:uppercase;margin:6px 0 2px}
.review-note{font-size:11px;background:#fafafa;border-left:3px solid #999;padding:8px 10px;margin-top:12px}
.answer.multi .answer-letter{border-radius:4px}
.matrix-wrap{overflow-x:auto;margin-bottom:6px}
table.matrix,table.trend{border-collapse:collapse;width:100%;font-size:12px}
table.matrix th,table.matrix td,table.trend th,table.trend td{border:1px solid #e3e3e3;padding:8px;text-align:center;vertical-align:middle}
table.matrix tbody th{text-align:left;font-weight:500;min-width:160px}
table.matrix thead th,table.trend thead th{background:#fafafa;font-size:11px;font-weight:650}
.cell{width:30px;height:30px;border:1.5px solid #bbb;border-radius:50%;font-size:13px;line-height:1}
.cell.on{border-color:#111;background:#111;color:#fff}
.cell.key{border-color:#2f7a3d;background:#2f7a3d;color:#fff}
.cell.wrong{border-color:#b3261e;background:#b3261e;color:#fff}
.order-list{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:7px}
.order-empty{font-size:11px;color:#888;border:1px dashed #ccc;border-radius:8px;padding:12px;text-align:center}
.order-item .answer-letter{background:#111;color:#fff;border-color:#111}
.need-title{font-size:13px;margin:18px 0 8px}
.need-list{display:grid;gap:10px;margin-bottom:12px}
.need-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:11px}
.need-row .progress-track{grid-column:1/-1;margin:0}
.need-row small{color:var(--muted)}

/* ---- NGN case studies ---- */
.case-profile{font-size:12px;color:#333;background:#fafafa;border:1px solid #eee;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.ehr{border:1px solid #e3e3e3;border-radius:8px;margin-bottom:16px;overflow:hidden}
.ehr-tabs{display:flex;background:#fafafa;border-bottom:1px solid #e3e3e3;overflow-x:auto}
.ehr-tabs button{padding:9px 14px;font-size:11px;font-weight:650;color:#666;border-bottom:2px solid transparent;white-space:nowrap}
.ehr-tabs button[aria-selected="true"]{color:#111;border-bottom-color:#111;background:#fff}
.ehr-body{padding:10px 12px;font-size:12px;line-height:1.6;max-height:180px;overflow-y:auto}
.ehr-body p{margin-bottom:6px}
.steps-dots{display:flex;gap:5px;margin:-4px 0 12px}
.steps-dots span{flex:1;height:4px;border-radius:2px;background:#e6e6e6}
.steps-dots .done{background:#333}.steps-dots .now{background:#999}
.hl-passage{font-size:13px;line-height:2.1}
.hl{border:1px solid #ccc;border-radius:5px;padding:2px 6px;background:#fff}
.hl.on{background:#fff3b0;border-color:#a68a00}
.hl.correct{box-shadow:inset 0 -3px 0 #2f7a3d}.hl.incorrect{box-shadow:inset 0 -3px 0 #b3261e}
.cloze{font-size:13px;line-height:2.4}
.cloze-select{width:auto;display:inline-block;padding:5px 8px;font-size:12px}
.cloze-select.correct{border-color:#2f7a3d}.cloze-select.incorrect{border-color:#b3261e}
.cloze-key{font-size:11px;color:#2f7a3d}
.bowtie{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.bow-col{display:grid;gap:6px;align-content:start}
.bow-col h4{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#555}
.bow-col h4 small{text-transform:none;letter-spacing:0;font-weight:400}
.answer.bow{padding:9px 10px;font-size:11px}

/* ---- NCLEX topic picker (NurseBound style) ---- */
.segmented{display:inline-flex;gap:4px;background:#eef0ea;border-radius:12px;padding:4px;margin-bottom:18px}
.segmented button{padding:8px 16px;border-radius:9px;font-size:12px;font-weight:650;color:#59635a}
.segmented button[aria-selected="true"],.segmented button[aria-checked="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0000001a}
.segmented.pool{display:flex}.segmented.pool button{flex:1}
.segmented.mode{margin:0;display:flex}.segmented.mode button{flex:1}
.feature-row{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-bottom:20px}
.feature-card{border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px}
.feature-card h3{font-size:18px}.feature-card p{font-size:12px;opacity:.85}
.feature-card.bp{background:linear-gradient(135deg,#ea580c,#e11d48);color:#fff}
.feature-card.bp .eyebrow{color:#ffe1cc}
.feature-card.bp .primary{background:#fff;color:#b8330c;border-color:#fff;align-self:flex-start;margin-top:auto}
.feature-card.ngn{background:linear-gradient(135deg,#4f46e5,#8b5cf6);color:#fff}
.feature-card.ngn .eyebrow{color:#e0dcff}
.case-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.case-pill{display:inline-flex;gap:6px;align-items:center;background:#ffffff26;border:1px solid #ffffff40;color:#fff;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:600}
.case-pill:hover{background:#ffffff40}.case-pill small{opacity:.8}
.pro-chip{display:inline-block;font-size:8px;font-weight:800;letter-spacing:1px;background:#fbbf24;color:#3b2500;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:middle}
.free-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#0b0f19;color:#f1f5f9;border-radius:12px;padding:14px 18px;margin-bottom:18px}
.free-banner strong{display:block;font-size:13px}.free-banner span{font-size:11px;color:#a9b4c8}
.free-banner .primary.light{background:#22d3ee;border-color:#22d3ee;color:#04131a}
.picker{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px}
.picker-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.picker-head .eyebrow{margin:0}
.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:1100px){.topic-grid{grid-template-columns:repeat(3,1fr)}}
.topic-tile{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px 14px 22px;border-radius:14px;background:color-mix(in srgb,var(--tc) 9%,white);border:1.5px solid color-mix(in srgb,var(--tc) 18%,white);min-height:58px}
.topic-tile:hover{background:color-mix(in srgb,var(--tc) 14%,white)}
.topic-tile .bar{position:absolute;left:10px;top:14px;bottom:14px;width:4px;border-radius:3px;background:var(--tc)}
.topic-tile .name{flex:1;font-size:13px;font-weight:650;color:color-mix(in srgb,var(--tc) 55%,#111);line-height:1.3}
.topic-tile .count{background:var(--tc);color:#fff;font-weight:700;font-size:11px;border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.topic-tile .tick{color:var(--tc)}.topic-tile .tick svg{width:16px;height:16px}
.topic-tile.on{border-color:var(--tc);box-shadow:0 0 0 1.5px var(--tc);background:color-mix(in srgb,var(--tc) 16%,white)}
.picker-controls{display:grid;grid-template-columns:1.4fr .8fr 1fr;gap:12px;margin-top:16px;align-items:end}
.picker-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;color:var(--muted)}
.primary.start{background:linear-gradient(135deg,#ea580c,#e11d48);border:0;padding:12px 22px;font-size:13px}
@media(max-width:650px){.feature-row{grid-template-columns:1fr}.picker-controls{grid-template-columns:1fr 1fr}.picker-controls .field:first-child{grid-column:1/-1}.bowtie{grid-template-columns:1fr}.picker{padding:14px}}

/* ---- Paywall (NurseBound design) ---- */
#modal.paywall{width:440px;max-width:calc(100% - 16px);background:#0b0f19;border:1px solid #232a44;color:#f1f5f9}
.pw{position:relative;padding:22px 20px 18px;display:grid;gap:12px;background:radial-gradient(ellipse at 50% 0%,#6366f155,transparent 60%),linear-gradient(160deg,#0b0f19,#141238)}
.pw-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:#ffffff14;color:#f1f5f9;display:grid;place-items:center}
.pw-head{display:flex;gap:12px;align-items:center;padding-right:40px}
.pw-icon{width:52px;height:52px;border-radius:12px;object-fit:cover}
.pw-eyebrow{color:#22d3ee;font-size:11px;letter-spacing:3px;font-weight:800}
.pw-head h2{color:#fff;font-size:19px;line-height:1.3;letter-spacing:-.3px}
.pw-reason{font-size:12px;color:#fbbf24}
.pw-marquee{overflow:hidden;margin:0 -20px}
.pw-track{display:flex;width:max-content;animation:pw-scroll 32s linear infinite}
.pw-chips{display:flex;gap:8px;padding-right:8px}
.pw-chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:7px 12px;border-radius:999px;background:#06b6d41f;border:1px solid #22d3ee59;font-size:13px;font-weight:600}
.pw-chip svg{width:14px;height:14px;color:#22d3ee}
@keyframes pw-scroll{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.pw-track{animation:none}.pw-marquee{overflow-x:auto}}
.pw-plans{display:grid;gap:10px}
.pw-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{display:grid;gap:3px;text-align:left;padding:12px;border-radius:18px;border:1.5px solid #ffffff1f;background:#ffffff0b;color:#f1f5f9}
.plan.on{border:2.5px solid #22d3ee;background:#06b6d41f;box-shadow:0 0 18px #06b6d466}
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.plan-top>span:first-child{display:grid;gap:4px}
.plan-label{font-size:12px;letter-spacing:2.4px;color:#a9b4c8;font-weight:700}
.pw-badge{justify-self:start;border:1px solid #22d3ee;background:#06b6d41f;color:#22d3ee;border-radius:7px;padding:1px 7px;font-size:9px;letter-spacing:2px;font-weight:800}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff47;flex-shrink:0;display:grid;place-items:center}
.plan.on .radio{border-color:#22d3ee}.plan.on .radio:after{content:'';width:11px;height:11px;border-radius:50%;background:#22d3ee}
.plan-price{display:flex;align-items:flex-end;gap:2px}
.plan-price strong{font-size:26px;line-height:1.2;font-weight:800;font-family:system-ui,sans-serif}
.plan.wide .plan-price strong{font-size:22px}
.plan-price span{color:#a9b4c8;font-size:13px;padding-bottom:4px}
.plan-line{color:#a9b4c8;font-size:12px}
.plan-save{color:#fbbf24;font-size:12px;font-weight:700}
.pw-cta{display:grid;gap:1px;justify-items:center;border-radius:20px;padding:13px 18px;background:#22d3ee;color:#04131a;box-shadow:0 4px 20px #06b6d48c}
.pw-cta strong{font-size:18px;font-weight:800}.pw-cta span{font-size:13px;color:#0b3b47}
.pw-links{display:flex;justify-content:center;gap:12px;font-size:14px;color:#7c879c}
.pw-links button,.pw-links a{color:#22d3ee;font-weight:600}
.pw-links.small{font-size:12px}.pw-links.small a,.pw-links.small button{color:#a9b4c8;text-decoration:underline;font-weight:400}
.pw-terms{font-size:11px;line-height:1.45;color:#a9b4c8;text-align:center}
#modal.paywall::backdrop{background:#04060dcc}

/* ===================================================================
   Colorful theme, drawn from the book: the cover's charcoal, white and
   yellow, plus the rainbow chapter colors of its table of contents.
   Exam and quiz screens (#modal.exam) stay plain white.
   =================================================================== */
:root{--cover:#2b2f33;--cover2:#454a51;--yellow:#ffe500;--yellow2:#ffc531;--violet:#7c3aed;--pink:#db2777;--blue:#2563eb;--cyan:#06b6d4;--orange:#f97316;--rose:#f43f5e;--green:#16a34a;--lime:#84cc16;--fuchsia:#c026d3;--bg:#f6f7fb}
body{background:linear-gradient(180deg,#f8f6ff 0%,#f6f7fb 220px,#f6f7fb 100%)}

/* Brand: the book cover is the logo */
.brand{gap:12px;padding:0 6px;font-size:inherit;letter-spacing:0}
.brand-cover{width:46px;height:69px;object-fit:cover;border-radius:4px;box-shadow:0 6px 16px #0000003d,0 0 0 1px #00000014;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-title{font-family:Manrope,sans-serif;font-weight:800;font-size:13px;letter-spacing:.2px;color:var(--cover);text-transform:uppercase}
.brand-title.big{font-size:25px;letter-spacing:-.5px;margin-top:2px}
.brand .brand-sub{font-size:6.5px;letter-spacing:.9px;margin-top:6px;color:#b38f00;font-weight:700}
.topbar-logo{display:none;width:26px;height:39px;object-fit:cover;border-radius:3px;box-shadow:0 2px 6px #0003}
@media(max-width:850px){.topbar-logo{display:block}}

/* Sidebar: solid color pill for the active tab */
.sidebar{background:#fff}
.nav-link{font-weight:550}
.nav-link.active{background:var(--nc);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--nc) 35%,transparent)}
.nav-link.active svg{color:#fff}
.nav-link.active:after{background:#fff}
.sidebar-note{background:linear-gradient(135deg,var(--yellow),var(--yellow2));border:0;color:var(--cover)}
.sidebar-note p{color:#5b4a00}.sidebar-note .text-link,.little-spark{color:var(--cover)}
.avatar{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;box-shadow:none;border-color:#fff}

/* Top bar */
.topbar{background:#ffffffd9;backdrop-filter:blur(8px)}
.book-toggle{background:var(--cover);border-color:var(--cover);color:var(--yellow)}
.book-toggle[aria-expanded="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--cover)}

/* Headings */
.eyebrow{background:linear-gradient(90deg,var(--violet),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.feature-card .eyebrow,.free-banner .eyebrow{background:none;color:inherit;-webkit-background-clip:initial;background-clip:initial;opacity:.85}
h1{color:var(--cover)}

/* Buttons */
.primary{background:linear-gradient(135deg,var(--violet),var(--pink));border:0;box-shadow:0 6px 18px #db27774d}
.primary:hover{background:linear-gradient(135deg,#6d28d9,#be185d)}
.primary.light{background:var(--yellow);color:var(--cover);box-shadow:0 6px 18px #ffe50059}
.primary.light:hover{background:#fff176}
.secondary{border-color:#e4e1f5}.secondary:hover{background:#f5f3ff}
.text-link{color:var(--violet)}
.mini.solid{background:var(--cc,var(--violet));border-color:var(--cc,var(--violet))}
.mini.solid:hover{filter:brightness(.92);background:var(--cc,var(--violet))}

/* Stat tiles: one color each */
.stat{border:0;color:#fff;box-shadow:0 10px 24px #1f1a4014}
.stat:nth-child(1){background:linear-gradient(135deg,var(--blue),var(--cyan))}
.stat:nth-child(2){background:linear-gradient(135deg,var(--orange),var(--rose))}
.stat:nth-child(3){background:linear-gradient(135deg,var(--green),var(--lime))}
.stat:nth-child(4){background:linear-gradient(135deg,var(--violet),var(--fuchsia))}
.stat .stat-top,.stat .stat-foot,.stat .stat-foot .positive{color:#ffffffd9}
.stat .stat-icon{background:#ffffff2e;color:#fff}

/* Hero: the cover's charcoal, white title and yellow accent */
.focus-card{background:radial-gradient(ellipse at 85% 0%,#5b616a 0%,transparent 55%),linear-gradient(160deg,var(--cover2),var(--cover))}
.focus-card h2{color:#fff}.focus-card p{color:#d5d9de}
.focus-label{background:#ffe50024;border-color:#ffe50059;color:var(--yellow)}
.orbital .star{color:var(--yellow)}.orbit-dot{background:var(--yellow)}.orbit-dot.second{background:#ffffff80}
.orbital:before,.orbital:after,.orbit{border-color:#ffe5002e}
.exam-card{background:linear-gradient(150deg,var(--yellow),var(--yellow2));border:0;color:var(--cover)}
.exam-card p,.exam-top,.exam-count span{color:#5b4a00}
.exam-card .secondary{background:var(--cover);color:#fff;border:0}
.exam-card .secondary:hover{background:#1b1e21}

/* Chapter cards and lists take their chapter color */
.course-card{border:0;box-shadow:0 8px 22px #1f1a4012;border-top:6px solid var(--cc);background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 10%,white),#fff 70%)}
.course-bottom{background:color-mix(in srgb,var(--cc) 8%,white);border-top-color:color-mix(in srgb,var(--cc) 20%,white)}
.course-bottom button{color:color-mix(in srgb,var(--cc) 75%,#111);font-weight:650}
.chapter-head{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--cc) 12%,white)}
.chapter-head h2{color:color-mix(in srgb,var(--cc) 60%,#111)}
.chapter-list{border-color:color-mix(in srgb,var(--cc) 25%,white)}
.chapter-list .sec-pages{background:color-mix(in srgb,var(--cc) 14%,white);color:color-mix(in srgb,var(--cc) 65%,#111)}
.filter{border-color:color-mix(in srgb,var(--cc) 30%,white);color:color-mix(in srgb,var(--cc) 70%,#111)}
.filter.active{background:var(--cc);border-color:var(--cc);color:#fff}

/* Panels and the activity chart */
.panel{border:0;box-shadow:0 8px 22px #1f1a4010}
.chart .bar-col:nth-child(7n+1) .bar{background:#9b8ad6}.chart .bar-col:nth-child(7n+2) .bar{background:#e0609a}
.chart .bar-col:nth-child(7n+3) .bar{background:#e2b72c}.chart .bar-col:nth-child(7n+4) .bar{background:#55b6e0}
.chart .bar-col:nth-child(7n+5) .bar{background:#8cc63f}.chart .bar-col:nth-child(7n+6) .bar{background:#f07f3c}
.chart .bar-col.today .bar{background:linear-gradient(180deg,var(--violet),var(--pink))}
.subtle-pill{background:#f5f3ff;border-color:#e4e1f5;color:var(--violet)}
.progress-fill{background:linear-gradient(90deg,var(--violet),var(--pink))}
.course-card .progress-fill{background:var(--cc)}
.need-row .progress-fill{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.notice{background:#fff8cc;border-color:#ffe56b;color:#5b4a00}

/* Book panel header in the cover's colors */
.bp-head{background:linear-gradient(160deg,var(--cover2),var(--cover));border-bottom:0}
.bp-head h2{color:#fff}.bp-head p{color:#d5d9de}
.bp-head p:first-line{color:var(--yellow)}
.bp-head .icon-button{color:#fff}.bp-head .icon-button:hover{background:#ffffff1f}
.bp-cover{width:58px;height:87px}

/* Dialogs that are not exams get a cheerful accent line */
#modal:not(.exam):not(.paywall) .modal-header{background:linear-gradient(90deg,#9b8ad6,#e0609a,#e2b72c,#55b6e0,#8cc63f,#f07f3c,#5cc7b8) top/100% 5px no-repeat}
.mode-option.active{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet);background:#f5f3ff}
.check-label input{accent-color:var(--violet)}
.check-day.checked{background:var(--green);border-color:var(--green)}
/* lists outside a chapter (e.g. "Re-read what you missed") use the brand violet */
.panel .chapter-list{--cc:#7c3aed}
.brand .brand-sub{white-space:nowrap;font-size:6px;letter-spacing:.6px}
.toc-chapter[data-open="true"]{border-color:color-mix(in srgb,var(--cc) 40%,white);box-shadow:inset 4px 0 0 var(--cc)}
.toc-chapter .sec-pages{background:color-mix(in srgb,var(--cc,#7c3aed) 14%,white);color:color-mix(in srgb,var(--cc,#7c3aed) 65%,#111)}
/* Big logo: the cover's title block across the top of the sidebar */
.brand{display:block;padding:0}
.brand-logo{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 10px 24px #00000033,0 0 0 1px #0000000f}
.brand:hover .brand-logo{box-shadow:0 12px 28px #00000047,0 0 0 1px #0000001a}
.sidebar{padding-top:20px}
.workspace-label{margin-top:26px}

/* Paywall: no scroll bars. The feature strip stays inside the dialog, and spacing is tighter so it fits on one screen. */
#modal.paywall{overflow-x:hidden;scrollbar-width:none;max-height:calc(100dvh - 24px)}
#modal.paywall::-webkit-scrollbar{display:none}
.pw{gap:10px;padding:18px 18px 14px;overflow:hidden}
.pw-marquee{margin:0 -18px;overflow:hidden}
@media(prefers-reduced-motion:reduce){.pw-marquee{overflow-x:auto;scrollbar-width:none}.pw-marquee::-webkit-scrollbar{display:none}}
.pw-head h2{font-size:18px}
.plan{padding:10px 12px}
.plan-price strong{font-size:24px}
.pw-cta{padding:11px 16px}
.pw-terms{font-size:10.5px}
.pw :focus-visible{outline-color:#22d3ee}

/* Each section (disease) has its own color: left stripe, page chip and Quiz button */
.section-row{box-shadow:inset 4px 0 0 var(--sc,transparent)}
.section-row .sec-pages{background:color-mix(in srgb,var(--sc) 14%,white);color:color-mix(in srgb,var(--sc) 70%,#111)}
.section-row h3{color:color-mix(in srgb,var(--sc) 55%,#111)}
.section-row .mini.sec-quiz{background:var(--sc);border-color:var(--sc);color:#fff}
.section-row .mini.sec-quiz:hover{background:var(--sc);filter:brightness(.9)}
.section-row .mini:not(.solid){border-color:color-mix(in srgb,var(--sc) 35%,white);color:color-mix(in srgb,var(--sc) 70%,#111)}
.section-row:hover{background:color-mix(in srgb,var(--sc) 5%,white)}
.reader-section{border-left:4px solid var(--cc,#7c3aed)}

/* Tagline: Learn. Test. Understand. evenly spaced, one color per word */
.tagline{display:inline-grid;grid-template-columns:repeat(3,auto);column-gap:1.4em;font-family:Manrope,sans-serif;font-weight:800;letter-spacing:.2px}
.tagline span:nth-child(1){color:#2563eb}.tagline span:nth-child(2){color:#db2777}.tagline span:nth-child(3){color:#ea580c}
.app-footer>.tagline{font-size:12px}
.modal-header h2 .tagline{column-gap:.9em}
@media(max-width:650px){.app-footer>.tagline{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;width:100%;font-size:13px}}
.filter{background:color-mix(in srgb,var(--cc) 9%,white)}.filter:hover{background:color-mix(in srgb,var(--cc) 16%,white)}.filter.active{background:var(--cc)}

/* Phones: all 19 NCLEX topics fit on one screen (designed for the 6.9" iPhone, 440 × 956 pt,
   minus the status bar and home indicator). The picker comes first; the exam and case cards follow it. */
@media (max-width:500px){
  .practice-flow{display:flex;flex-direction:column}
  .practice-flow .pf-extras{order:2;margin-top:18px}
  .practice-head .page-heading{margin-bottom:10px}
  .practice-head .eyebrow,.practice-head .page-heading p{display:none}
  .practice-head h1{font-size:21px;letter-spacing:-.6px;line-height:1.25}
  .practice-head .title-actions .secondary{padding:7px 10px;font-size:10px}
  main:has(.practice-flow){padding-top:12px}
  main:has(.practice-flow) .segmented{margin-bottom:8px;padding:3px}
  main:has(.practice-flow) .segmented button{padding:6px 12px;font-size:11px}
  .picker{padding:10px;border-radius:14px}
  .picker .segmented.pool{margin-bottom:6px}
  .picker-head{margin:2px 0 6px}
  .topic-grid{gap:6px}
  .topic-tile{min-height:0;height:40px;padding:4px 8px 4px 16px;gap:6px;border-radius:10px}
  .topic-tile .bar{left:7px;top:9px;bottom:9px;width:3px}
  .topic-tile .name{font-size:11.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .topic-tile .count{font-size:10px;padding:2px 7px}
  .topic-tile .tick svg{width:13px;height:13px}
  .picker-controls{grid-template-columns:1.25fr .7fr 1fr;gap:6px;margin-top:8px}
  .picker-controls .field:first-child{grid-column:auto}
  .picker-controls .field{font-size:10px;gap:3px}
  .picker-controls select{padding:7px 6px;font-size:11px}
  .picker-controls .segmented.mode button{padding:6px 4px;font-size:11px}
  .picker-controls .pro-chip{display:none}
  .picker-foot{margin-top:8px;font-size:11px}
  .primary.start{padding:10px 18px}
}
@media (max-width:500px){.picker-controls .segmented.mode{padding:2px}.picker-controls .segmented.mode button{padding:7px 4px}}

/* ---- Components shared by every color theme (light values here; nb-theme.css restyles them for the dark themes) ---- */
.nav-link{--nc:var(--nl)}
.test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:20px}
.test-card{display:flex;flex-direction:column;gap:10px;padding:16px;background:#fff;border:1px solid #e6e3f3;border-radius:18px;box-shadow:0 8px 22px #1f1a4012}
.test-card .tc-top{display:flex;justify-content:space-between;align-items:flex-start}
.test-card .tc-eyebrow{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:700;font-size:10.5px;letter-spacing:2px;color:#6b6880;text-transform:uppercase;padding-top:8px}
.icon-tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ea580c,#e11d48)}
.icon-tile svg{width:20px;height:20px}
.test-card h3{font-size:20px;line-height:1.2;font-weight:800}
.test-card p{font-size:14px;line-height:1.45;color:#6b6880}
.test-card .tc-meta{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;color:#6b6880;margin-top:auto}
.test-card .primary{width:100%;padding:12px;font-size:15px}

/* No visible scroll bars anywhere (scrolling still works by swipe, wheel and keyboard),
   and the app never scrolls sideways: everything fits the screen width. */
html,body{overflow-x:hidden;max-width:100%}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.app-shell,main{min-width:0;overflow-x:clip}

/* =====================================================================
   Device layouts (auto, by screen width and orientation)
   - iPhone            < 600px   phone layout, bottom bar, picker first
   - iPad portrait   600–1099px  bottom bar, no sidebar, picker first, roomier grids
   - iPad landscape / desktop ≥ 1100px  sidebar layout
   ===================================================================== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.case-choose .search-item{gap:14px}
@media (max-width:1099px){
  /* hide the sidebar (opened only from the menu), full-width content, bottom tab bar */
  .sidebar{transform:translateX(-100%);width:260px;box-shadow:10px 0 40px #0000004d;transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .app-shell{margin-left:0}
  .topbar-logo{display:block}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;padding:6px 2px calc(8px + env(safe-area-inset-bottom,0px))}
  .tab{--tc:var(--tl);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:10.5px;color:var(--tc);background:none;border:0;padding:2px 0;text-decoration:none;min-width:0}
  .tab .tab-ic{width:42px;height:30px;border-radius:12px;display:grid;place-items:center}
  .tab svg{width:21px;height:21px;color:var(--tc)}
  .tab[aria-current="page"] .tab-ic{background:var(--tc)}
  .tab[aria-current="page"] svg{width:19px;height:19px}
  .tab .tab-label{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mobile-menu{display:none}
  .app-shell{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .toast{left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .topbar{height:60px}
  main{min-height:0}
  /* picker first, then the exam and case cards */
  .practice-flow{display:flex;flex-direction:column}
  .practice-flow .pf-extras{order:2;margin-top:18px}
}
/* iPad portrait (and large phones in landscape): roomier grids, larger touch targets */
@media (min-width:600px) and (max-width:1099px){
  main{padding:26px 32px 0}
  .topbar{padding:0 32px}
  .topic-grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .topic-tile{min-height:56px}
  .topic-tile .name{font-size:14px}
  .test-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(4,1fr)}
  .course-grid.chapters{grid-template-columns:repeat(3,1fr)}
  .tab{font-size:12px}
  .tab .tab-ic{width:52px;height:32px}
  .hero-row{grid-template-columns:1fr 300px}
  .picker-controls{grid-template-columns:1.4fr .8fr 1fr}
}
@media (min-width:600px) and (max-width:759px){
  .test-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .course-grid.chapters{grid-template-columns:repeat(2,1fr)}
  .hero-row{grid-template-columns:1fr}
}
/* iPad landscape / desktop with the sidebar: four test cards across */
@media (min-width:1100px){
  .test-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:1099px){.tabbar{background:#fff;border-top:1px solid #e6e3f3}.tab[aria-current="page"] svg{color:#fff}}
/* Picker first on every device; the exam and case cards follow */
.practice-flow{display:flex;flex-direction:column}
.practice-flow .pf-extras{order:2;margin-top:18px}
@media (min-width:1100px){.topic-grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:600px) and (max-width:1099px) and (max-height:1150px){.topic-tile{min-height:46px}}
/* Short phones (iPhone 16, 15, SE): drop the page title (the top bar already says "Practice questions")
   and size the tiles from the screen height so all topics and Start fit above the tab bar */
@media (max-width:599px) and (max-height:850px){
  .practice-head{display:none}

  .topic-tile{height:clamp(28px,calc((100dvh - 420px) / 10),37px)}

/* Shorter iPad screens (mini portrait, Air landscape): compact page heading so Start stays on screen */

/* Bottom bar labels: always shown in full on every iPhone (no "Bookma…"). Size follows the screen width. */

  .tab{padding:2px 0}

}
@media (max-width:430px){.tab .tab-ic{width:clamp(34px,9.5vw,42px)}}
/* Phones and iPad portrait: menu button back in the top corner (opens the side menu with Overview and every page);
   five tabs at the bottom. */
@media (max-width:1099px){

/* ==== NurseBound add-ons: Question Bank card, exam screen, tutor, motivation, confetti ==== */
:root{--nc1:#ea580c;--nc2:#e11d48}
html[data-ui="ocean"]{--nc1:#0f766e;--nc2:#0284c7}
html[data-ui="sunrise"]{--nc1:#dc2626;--nc2:#ea580c}
/* NCLEX topics / Book chapters: evenly spaced, each its own color (NurseBound tab colors) */
.segmented.view-seg{display:flex;width:100%}
.segmented.view-seg button{flex:1;text-align:center;color:#1D4ED8}
.segmented.view-seg button+button{color:#065F46}
.segmented.view-seg button[aria-selected="true"]{background:#1D4ED8;color:#fff}
.segmented.view-seg button+button[aria-selected="true"]{background:#065F46;color:#fff}
html:not([data-ui="daylight"]) .segmented.view-seg button{color:#93C5FD}
html:not([data-ui="daylight"]) .segmented.view-seg button+button{color:#6EE7B7}
html:not([data-ui="daylight"]) .segmented.view-seg button[aria-selected="true"]{background:#93C5FD;color:#0b1020}
html:not([data-ui="daylight"]) .segmented.view-seg button+button[aria-selected="true"]{background:#6EE7B7;color:#0b1020}
/* Question Bank card */
.picker.qb-card{background:color-mix(in srgb,var(--nc1) 13%,#fff);border:1px solid var(--nc1);border-radius:18px}
html:not([data-ui="daylight"]) .picker.qb-card{background:color-mix(in srgb,var(--nc1) 22%,#111527);border-color:color-mix(in srgb,var(--nc1) 65%,#fff)}
.qb-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.qb-icon{flex:none;width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--nc1),var(--nc2));color:#fff}
.qb-icon svg{width:24px;height:24px;stroke-width:2}
.qb-head h2{margin:0;font-family:var(--display,inherit);font-size:21px;line-height:26px;font-weight:700}
.qb-head p{margin:2px 0 0;font-size:13px;line-height:18px;color:var(--muted)}
.qb-stats{display:flex;gap:8px;margin-bottom:12px}
.qb-stat{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px;border-radius:14px;background:var(--surface,#fff);border:1px solid var(--line)}
.qb-stat strong{font-family:var(--mono,ui-monospace,monospace);font-size:13px;line-height:18px;font-weight:700}
.qb-stat span{font-family:var(--mono,ui-monospace,monospace);font-size:9.5px;line-height:14px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.qb-bar{height:9px;border-radius:99px;background:var(--sunk,#eef1f8);overflow:hidden;margin-bottom:14px}
.qb-bar div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--nc1),var(--nc2));min-width:0}
.qb-clear{font-size:13px;font-weight:600;color:var(--nc2);padding:2px 0}
html:not([data-ui="daylight"]) .qb-clear{color:color-mix(in srgb,var(--nc2) 65%,#fff)}
.qb-card .picker-head .eyebrow{letter-spacing:1.2px}
.topic-tile.on{border-width:2px}
/* Client need, Questions and Mode on one level */
.picker-controls{align-items:end}
.picker-controls .field{display:grid;grid-template-rows:16px 40px;gap:4px;margin:0;align-content:end}
.picker-controls .field-label{font-size:12px;line-height:16px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-controls select{height:40px;margin:0;box-sizing:border-box}
.picker-controls .segmented.mode{height:40px;box-sizing:border-box;margin:0;padding:3px;align-items:stretch}
.picker-controls .segmented.mode button{padding:0 6px;display:flex;align-items:center;justify-content:center}
/* Book chapter chips: evenly spaced */
.filter-row{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.filter-row .filter{width:100%;margin:0;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:599px){.filter-row{grid-template-columns:1fr 1fr}.filter-row .filter{font-size:11px;padding-left:6px;padding-right:6px}}

/* ---- Exam screen: NurseBound question view (light, on white) ---- */
html body #modal.exam{--x-ok:#15803d;--x-oks:#dcf5e4;--x-crit:#c81e3a;--x-crits:#fde2e6;--x-t1:#ea580c;--x-t2:#e11d48;--x-s1:#fce9df;--x-s2:#fbe2e7;--x-sunk:#eef1f8;--x-line:#e1e5ef;--x-ink:#0d1324;--x-muted:#5b6478}
html body #modal.exam .modal-body{display:flex;flex-direction:column;gap:14px}
html body #modal.exam .nb-qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
html body #modal.exam .nb-qcount{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;color:var(--x-muted)}
.nb-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:5px 10px;border-radius:999px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:flex-start}
.nb-chip svg{width:12px;height:12px;flex:none;stroke-width:2}
.nb-chip.acc{background:#fce9df;color:#ea580c}.nb-chip.acc2{background:#fbe2e7;color:#e11d48}.nb-chip.mute{background:#eef1f8;color:#5b6478}.nb-chip.crit{background:#fde2e6;color:#c81e3a}.nb-chip.book{background:#dcf5e4;color:#065f46}
html body #modal.exam .nb-chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
html body #modal.exam .quiz-progress.nb-bar{height:9px;border-radius:99px;background:var(--x-sunk);margin:0}
html body #modal.exam .quiz-progress.nb-bar div{background:linear-gradient(90deg,#ea580c,#e11d48);border-radius:99px}
html body #modal.exam .nb-qcard{background:#fff;border:1px solid var(--x-line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:9px;box-shadow:0 6px 14px #ea580c14}
html body #modal.exam .question-stem{margin:0;font-family:'Figtree','DM Sans',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:23px;color:var(--x-ink)}
html body #modal.exam .answer-options{display:flex;flex-direction:column;gap:9px;margin:0}
html body #modal.exam .answer{display:flex;align-items:flex-start;gap:10px;padding:13px;border-radius:14px;border:1.5px solid var(--x-line);background:#fff;box-shadow:none;color:var(--x-ink);font-size:15px;line-height:22px;text-align:left;width:100%}
html body #modal.exam .answer .answer-letter{flex:none;width:16px;height:auto;min-width:16px;border:0;background:none;border-radius:0;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;line-height:22px;text-transform:uppercase;color:var(--x-ink);justify-content:flex-start}
html body #modal.exam .answer.multi .answer-letter{width:18px;height:18px;min-width:18px;margin-top:2px;border:1.5px solid #b8c0d4;border-radius:5px;display:flex;align-items:center;justify-content:center;line-height:1;font-size:12px}
html body #modal.exam .answer.multi.selected .answer-letter{background:var(--x-t1);border-color:var(--x-t1);color:#fff}
html body #modal.exam .answer.selected{background:var(--x-s1);border-color:var(--x-t1);box-shadow:none}
html body #modal.exam .answer.correct{background:var(--x-oks);border-color:var(--x-ok);box-shadow:none}
html body #modal.exam .answer.incorrect{background:var(--x-crits);border-color:var(--x-crit);box-shadow:none}
html body #modal.exam .answer.correct .answer-letter{color:var(--x-ok)}html body #modal.exam .answer.incorrect .answer-letter{color:var(--x-crit)}
html body #modal.exam .answer .mark{margin-left:auto;color:var(--x-ok);flex:none}
html body #modal.exam .opt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
html body #modal.exam .why{font-size:13px;line-height:18px;color:var(--x-muted)}
html body #modal.exam .why b{color:var(--x-ink)}
html body #modal.exam .why.hl{color:var(--x-ink);background:#fff8db;border:1px solid #f5d76e;border-radius:8px;padding:6px 8px}
html body #modal.exam .why.hl b{color:var(--x-ok)}
html body #modal.exam .order-item.correct{background:var(--x-oks);border-color:var(--x-ok)}html body #modal.exam .order-item.incorrect{background:var(--x-crits);border-color:var(--x-crit)}
html body #modal.exam .order-item .answer-letter{width:30px;height:30px;min-width:30px;border-radius:15px;background:var(--x-t1);color:#fff;display:flex;align-items:center;justify-content:center;line-height:1}
html body #modal.exam .type-hint{margin:0;font-size:12px;color:var(--x-muted)}
/* result, key points, takeaway, sources */
html body #modal.exam .rationale{background:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.nb-result{display:flex;gap:8px;align-items:flex-start}
.nb-result svg{width:19px;height:19px;flex:none;margin-top:2px;stroke-width:2}
.nb-result strong{display:block;font-size:15px;line-height:22px}
.nb-result span{display:block;font-size:13px;color:#5b6478}
.nb-result.ok,.nb-result.ok strong{color:#15803d}.nb-result.no,.nb-result.no strong{color:#c81e3a}
.nb-keypoints{background:#fff8db;border:1px solid #f5d76e;border-radius:14px;padding:12px}
.nb-keypoints h4{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:13px;color:#a16207}
.nb-keypoints h4 svg{width:15px;height:15px}
.nb-keypoints ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13px;line-height:19px;color:#0d1324}
.nb-keypoints mark,.rationale-list mark{background:linear-gradient(transparent 40%,#fde68a 40%);color:inherit;padding:0 1px}
.nb-note{display:flex;gap:10px;border-radius:14px;padding:12px}
.nb-note svg{width:16px;height:16px;flex:none;margin-top:2px;stroke-width:2}
.nb-note strong{display:block;font-size:13px;line-height:18px}
.nb-note p{margin:2px 0 0;font-size:13px;line-height:18px;color:#0d1324}
.nb-note.takeaway{background:#fbe2e7;color:#e11d48}
.nb-all,.nb-sources{border:1px solid #e1e5ef;border-radius:14px;padding:10px 12px;background:#fff}
.nb-all summary,.nb-sources summary{cursor:pointer;font-size:13px;font-weight:700;color:#ea580c;display:flex;align-items:center;gap:6px;list-style:none}
.nb-all summary::-webkit-details-marker,.nb-sources summary::-webkit-details-marker{display:none}
.nb-all summary::after,.nb-sources summary::after{content:'›';margin-left:auto;font-size:18px;line-height:1;transition:transform .2s}
.nb-all[open] summary::after,.nb-sources[open] summary::after{transform:rotate(90deg)}
.nb-sources summary svg{width:16px;height:16px}
.nb-all[open] summary,.nb-sources[open] summary{margin-bottom:8px}
.nb-ref{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.nb-ref .apa{margin:0;font-size:12.5px;line-height:18px;color:#0d1324;padding-left:18px;text-indent:-18px}

/* Tutor intro (first question of a tutor session) */
.tutor-intro{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#fce9df,#fbe2e7);border:1px solid #f8c9b5}

.tutor-card{border-radius:18px;padding:16px;background:var(--surface,#fff);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tutor-card .tc-eyebrow{font-family:var(--mono,ui-monospace,monospace);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--muted)}

.cred-note{margin:0;font-size:13px;color:var(--muted)}

/* Celebrations */
#fx{border:0;padding:24px;background:transparent;max-width:none;max-height:none;width:100%;height:100%;display:none;align-items:center;justify-content:center;overflow:hidden}
#fx[open]{display:flex}
#fx::backdrop{background:rgba(5,8,20,.6)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;height:4px;border-radius:2px;animation:fx-fall 2.6s cubic-bezier(.25,.46,.45,.94) forwards}
.confetti i:nth-child(odd){height:6px}
@keyframes fx-fall{0%{transform:translateY(0) rotate(var(--r));opacity:1}80%{opacity:1}100%{transform:translateY(var(--d)) rotate(calc(var(--r) + 540deg));opacity:0}}
.fx-card{position:relative;background:#111527;color:#eef1fa;border-radius:26px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:380px;text-align:center;animation:fx-pop .35s cubic-bezier(.2,1.4,.4,1)}
html[data-ui="daylight"] .fx-card{background:#fff;color:#0d1324}
@keyframes fx-pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.fx-eyebrow{font-family:var(--mono,'JetBrains Mono',monospace);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:#9aa3bd}
.fx-medal{width:108px;height:108px;border-radius:32px;display:flex;align-items:center;justify-content:center;color:#fff}
.fx-medal svg{width:50px;height:50px;stroke-width:1.8}

.fx-go{margin-top:6px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:13px;background:linear-gradient(135deg,#ea580c,#e11d48);color:#fff;font-weight:700;font-size:15px}
.fx-go svg{width:16px;height:16px}
.fx-form{width:100%;display:grid;gap:6px;text-align:left}
.fx-form label{font-size:13px;font-weight:600;color:#9aa3bd}
.fx-form input{padding:12px;border-radius:12px;border:1.5px solid #232a44;background:#0c1020;color:#eef1fa;font-size:16px}
html[data-ui="daylight"] .fx-form input{background:#fff;color:#0d1324;border-color:#e1e5ef}
@media (prefers-reduced-motion:reduce){.fx-card{animation:none}}
.qb-title{flex:1;min-width:0}

.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:#64748b66;transition:background .2s}
.switch span:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0004}
.switch input:checked+span{background:#22c55e}.switch input:checked+span:after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid #93c5fd;outline-offset:2px}
